                texte: "1 Que tes demeures sont aimables, Éternel des armées !\n2 Mon âme soupire et languit après les parvis de l'Éternel, Mon cœur et ma chair poussent des cris vers le Dieu vivant.\n3 Le passereau même trouve une maison, Et l'hirondelle un nid où elle dépose ses petits... Tes autels, Éternel des armées, Mon roi et mon Dieu !\n4 Heureux ceux qui habitent ta maison ! Ils peuvent te célébrer encore.\n5 Heureux ceux qui placent en toi leur appui, Et qui trouvent dans leur cœur des chemins tout tracés !\n6 Lorsqu'ils traversent la vallée de Baca, Ils la transforment en un lieu plein de sources, Et la pluie la couvre aussi de bénédictions.\n7 Leur force augmente pendant la marche, Et ils se présentent devant Dieu à Sion.\n8 Éternel, Dieu des armées, écoute ma prière ! Prête l'oreille, Dieu de Jacob !\n9 Toi qui es notre bouclier, vois, ô Dieu ! Regarde la face de ton oint !\n10 Mieux vaut un jour dans tes parvis que mille ailleurs ; Je préfère me tenir sur le seuil de la maison de mon Dieu, Plutôt que d'habiter sous les tentes de la méchanceté.\n11 Car l'Éternel Dieu est un soleil et un bouclier, L'Éternel donne la grâce et la gloire, Il ne refuse aucun bien à ceux qui marchent dans l'intégrité.\n12 Éternel des armées, Heureux l'homme qui se confie en toi !"
            }, {
                num: 85,
                titre: "Au chef des chantres. Des fils de Koré. Psaume.",
                premierVers: "Tu as été favorable à ton pays, ô Éternel ! Tu as ramené les captifs de Jacob ;",
                texte: "1 Tu as été favorable à ton pays, ô Éternel ! Tu as ramené les captifs de Jacob ;\n2 Tu as pardonné l'iniquité de ton peuple, Tu as couvert tous ses péchés ;\n3 Tu as retiré toute ta fureur, Tu es revenu de l'ardeur de ta colère.\n4 Rétablis-nous, Dieu de notre salut ! Cesse ton indignation contre nous !\n5 T'irriteras-tu contre nous à jamais ? Prolongeras-tu ta colère éternellement ?\n6 Ne nous redonneras-tu pas la vie, Afin que ton peuple se réjouisse en toi ?\n7 Éternel, fais-nous voir ta bonté, Et accorde-nous ton salut !\n8 J'écouterai ce que dit Dieu, l'Éternel ; Car il parle de paix à son peuple et à ses fidèles, Pourvu qu'ils ne retombent pas dans la folie.\n9 Oui, son salut est près de ceux qui le craignent, Afin que la gloire demeure dans notre pays.\n10 La bonté et la fidélité se rencontrent, La justice et la paix s'embrassent ;\n11 La fidélité germe de la terre, Et la justice regarde du haut des cieux.\n12 L'Éternel aussi donnera le bonheur, Et notre terre donnera ses fruits.\n13 La justice marchera devant lui, Et imprimera ses pas sur le chemin."
            }, {

                texte: "1 Éternel, incline ton oreille, exauce-moi ! Car je suis malheureux et indigent.\n2 Garde mon âme, car je suis pieux ! Mon Dieu, sauve ton serviteur qui se confie en toi !\n3 Aie pitié de moi, Seigneur ! Car je crie à toi tout le jour.\n4 Réjouis l'âme de ton serviteur, Car j'élève à toi mon âme, Seigneur.\n5 Car tu es bon, Seigneur, tu pardonnes, Tu es plein d'amour pour tous ceux qui t'invoquent.\n6 Éternel, prête l'oreille à ma prière, Sois attentif à la voix de mes supplications !\n7 Je t'invoque au jour de ma détresse, Car tu m'exauces.\n8 Nul n'est comme toi parmi les dieux, Seigneur, Et rien ne ressemble à tes œuvres.\n9 Toutes les nations que tu as faites viendront Se prosterner devant ta face, Seigneur, Et rendre gloire à ton nom.\n10 Car tu es grand, et tu opères des prodiges ; Toi seul, tu es Dieu.\n11 Enseigne-moi tes voies, ô Éternel ! Je marcherai dans ta fidélité. Dispose mon cœur à la crainte de ton nom.\n12 Je te louerai de tout mon cœur, Seigneur, mon Dieu ! Et je glorifierai ton nom à perpétuité.\n13 Car ta bonté est grande envers moi, Et tu délivres mon âme du séjour profond des morts.\n14 Ô Dieu, des orgueilleux se sont levés contre moi, Une troupe d'hommes violents en veulent à ma vie ; Ils ne portent pas leurs pensées sur toi.\n15 Mais toi, Seigneur, tu es un Dieu miséricordieux et compatissant, Lent à la colère, riche en bonté et en fidélité ;\n16 Tourne vers moi les regards et aie pitié de moi, Donne la force à ton serviteur, Et sauve le fils de ta servante !\n17 Opère un signe en ma faveur ! Que mes ennemis le voient et soient confus ! Car tu me secours et tu me consoles, ô Éternel !"

            }, {
                num: 88,
                titre: "Cantique. Psaume des fils de Koré. Au chef des chantres. Pour chanter sur la flûte. Cantique d'Héman l'Ézrachite.",
                premierVers: "Éternel, Dieu de mon salut ! Je crie jour et nuit devant toi.",
                texte: "1 Éternel, Dieu de mon salut ! Je crie jour et nuit devant toi.\n2 Que ma prière parvienne en ta présence ! Prête l'oreille à mes supplications !\n3 Car mon âme est rassasiée de maux, Et ma vie s'approche du séjour des morts.\n4 Je suis mis au rang de ceux qui descendent dans la fosse, Je suis comme un homme qui n'a plus de force.\n5 Je suis étendu parmi les morts, Semblable à ceux qui sont tués et couchés dans le sépulcre, À ceux dont tu n'as plus le souvenir, Et qui sont séparés de ta main.\n6 Tu m'as jeté dans une fosse profonde, Dans les ténèbres, dans les abîmes.\n7 Ta fureur s'appesantit sur moi, Et tu m'accables de tous tes flots.\n8 Tu as éloigné de moi mes amis, Tu m'as rendu pour eux un objet d'horreur ; Je suis enfermé et je ne puis sortir.\n9 Mes yeux se consument par la souffrance ; Je t'invoque tous les jours, ô Éternel ! J'étends vers toi les mains.\n10 Feras-tu des miracles pour les morts ? Les morts se lèveront-ils pour te louer ?\n11 Parle-t-on de ta bonté dans le sépulcre, De ta fidélité dans l'abîme ?\n12 Tes prodiges sont-ils connus dans les ténèbres, Et ta justice dans la terre de l'oubli ?\n13 Ô Éternel, j'implore ton secours, Et le matin ma prière s'élève à toi.\n14 Pourquoi, Éternel, repousses-tu mon âme ? Pourquoi me caches-tu ta face ?\n15 Je suis malheureux et moribond dès ma jeunesse, Je suis chargé de tes terreurs, je suis troublé.\n16 Ta fureur passe sur moi, Tes terreurs m'anéantissent ;\n17 Elles m'environnent tout le jour comme des eaux, Elles m'enveloppent toutes à la fois.\n18 Tu as éloigné de moi amis et compagnons ; Mes intimes ont disparu."

                titre: "Cantique d'Éthan l'Ézrachite.",

                texte: "1 Je chanterai toujours les bontés de l'Éternel ; Ma bouche fera connaître à jamais ta fidélité.\n2 Car je dis : La bonté a des fondements éternels ; Tu établis ta fidélité dans les cieux.\n3 J'ai fait alliance avec mon élu ; Voici ce que j'ai juré à David, mon serviteur :\n4 J'affermirai ta postérité pour toujours, Et j'établirai ton trône à perpétuité.\n5 Les cieux célèbrent tes merveilles, ô Éternel ! Et ta fidélité dans l'assemblée des saints.\n6 Car qui, dans le ciel, peut se comparer à l'Éternel ? Qui est semblable à toi parmi les fils de Dieu ?\n7 Dieu est terrible dans la grande assemblée des saints, Il est redoutable pour tous ceux qui l'entourent.\n8 Éternel, Dieu des armées, qui est comme toi puissant, ô Éternel ? Ta fidélité t'environne.\n9 Tu domptes l'orgueil de la mer ; Quand ses flots se soulèvent, tu les apaises.\n10 Tu écrasas l'Égypte comme un cadavre, Tu dispersas tes ennemis par la puissance de ton bras.\n11 C'est à toi qu'appartiennent les cieux et la terre, C'est toi qui as fondé le monde et ce qu'il renferme.\n12 Tu as créé le nord et le midi ; Le Thabor et l'Hermon se réjouissent à ton nom.\n13 Ton bras est puissant, Ta main forte, ta droite élevée.\n14 La justice et l'équité sont la base de ton trône. La bonté et la fidélité sont devant ta face.\n15 Heureux le peuple qui connaît le son de la trompette ; Il marche à la clarté de ta face, ô Éternel !\n16 Il se réjouit sans cesse de ton nom, Et il se glorifie de ta justice.\n17 Car tu es la gloire de sa puissance ; C'est ta faveur qui relève notre force.\n18 Car l'Éternel est notre bouclier, Le Saint d'Israël est notre roi.\n19 Alors tu parlas dans une vision à ton bien-aimé, Et tu dis : J'ai prêté mon secours à un héros, J'ai élevé du milieu du peuple un jeune homme ;\n20 J'ai trouvé David, mon serviteur, Je l'ai oint de mon huile sainte.\n21 Ma main le soutiendra, Et mon bras le fortifiera.\n22 L'ennemi ne le surprendra pas, Et le méchant ne l'opprimera point ;\n23 J'écraserai devant lui ses adversaires, Et je frapperai ceux qui le haïssent.\n24 Ma fidélité et ma bonté seront avec lui, Et sa force s'élèvera par mon nom.\n25 Je mettrai sa main sur la mer, Et sa droite sur les fleuves.\n26 Lui, il m'invoquera : Tu es mon père, Mon Dieu et le rocher de mon salut !\n27 Et moi, je ferai de lui le premier-né, Le plus élevé des rois de la terre.\n28 Je lui conserverai toujours ma bonté, Et mon alliance lui sera fidèle ;\n29 Je rendrai sa postérité éternelle, Et son trône comme les jours des cieux.\n30 Si ses fils abandonnent ma loi Et ne marchent pas selon mes ordonnances,\n31 S'ils violent mes préceptes Et n'observent pas mes commandements,\n32 Je punirai de la verge leurs transgressions, Et par des coups leurs iniquités ;\n33 Mais je ne lui retirerai point ma bonté Et je ne trahirai pas ma fidélité,\n34 Je ne violerai point mon alliance Et je ne changerai pas ce qui est sorti de mes lèvres.\n35 J'ai juré une fois par ma sainteté : Mentirai-je à David ?\n36 Sa postérité subsistera toujours ; Son trône sera devant moi comme le soleil,\n37 Comme la lune il aura une éternelle durée, Le témoin qui est dans le ciel est fidèle.\n38 Et pourtant, tu as rejeté, tu as repoussé ! Tu t'es irrité contre ton oint !\n39 Tu as dédaigné l'alliance avec ton serviteur ; Tu as abattu, profané sa couronne.\n40 Tu as détruit toutes ses murailles, Tu as mis en ruines ses forteresses.\n41 Tous les passants le dépouillent ; Il est un objet d'opprobre pour ses voisins.\n42 Tu as élevé la droite de ses adversaires, Tu as réjoui tous ses ennemis ;\n43 Tu as fait reculer le tranchant de son glaive, Et tu ne l'as pas soutenu dans le combat.\n44 Tu as mis fin à sa splendeur, Et tu as jeté son trône à terre ;\n45 Tu as abrégé les jours de sa jeunesse, Tu l'as couvert de honte.\n46 Jusques à quand, Éternel, te cacheras-tu sans cesse, Et ta fureur s'embrasera-t-elle comme le feu ?\n47 Souviens-toi de ce qu'est la durée de ma vie, Et pour quel néant tu as créé tous les fils de l'homme.\n48 Y a-t-il un homme qui puisse vivre et ne pas voir la mort, Qui puisse sauver son âme du séjour des morts ?\n49 Où sont, Seigneur, tes bontés premières, Que tu juras à David dans ta fidélité ?\n50 Souviens-toi, Seigneur, de l'opprobre de tes serviteurs, Souviens-toi que je porte dans mon sein tous les peuples nombreux ;\n51 Souviens-toi des outrages de tes ennemis, ô Éternel, De leurs outrages contre les pas de ton oint.\n52 Béni soit à jamais l'Éternel ! Amen ! Amen !"

                texte: "1 Il est beau de louer l'Éternel, Et de célébrer ton nom, ô Très-Haut !\n2 D'annoncer le matin ta bonté, Et ta fidélité pendant les nuits,\n3 Sur l'instrument à dix cordes et sur le luth, Aux sons de la harpe.\n4 Tu me réjouis par tes œuvres, ô Éternel ! Et je chante avec allégresse l'ouvrage de tes mains.\n5 Que tes œuvres sont grandes, ô Éternel ! Que tes pensées sont profondes !\n6 L'homme stupide n'y connaît rien, Et l'insensé n'y prend point garde.\n7 Si les méchants croissent comme l'herbe, Et si tous ceux qui font le mal fleurissent, C'est pour être détruits à jamais.\n8 Mais toi, tu es le Très-Haut, À perpétuité, ô Éternel !\n9 Car voici, tes ennemis, ô Éternel ! Car voici, tes ennemis périssent ; Tous ceux qui font le mal sont dispersés.\n10 Et tu me donnes la force du buffle ; Je suis arrosé avec une huile fraîche.\n11 Mon œil se plaît à contempler mes ennemis, Et mon oreille à entendre mes méchants adversaires.\n12 Les justes croissent comme le palmier, Ils s'élèvent comme le cèdre du Liban.\n13 Plantés dans la maison de l'Éternel, Ils prospèrent dans les parvis de notre Dieu ;\n14 Ils portent encore des fruits dans la vieillesse, Ils sont pleins de sève et verdoyants,\n15 Pour faire connaître que l'Éternel est juste. Il est mon rocher, et il n'y a point en lui d'iniquité."

tre Dieu, les anéantira."

                titre: "Prière du malheureux, lorsqu'il est abattu et qu'il répand sa plainte devant l'Éternel.",

                texte: "1 Éternel, écoute ma prière, Et que mon cri parvienne jusqu'à toi !\n2 Ne me cache pas ta face au jour de ma détresse ! Incline vers moi ton oreille quand je crie ! Hâte-toi de m'exaucer !\n3 Car mes jours s'évanouissent en fumée, Et mes os sont enflammés comme un tison.\n4 Mon cœur est frappé et se dessèche comme l'herbe ; J'oublie même de manger mon pain.\n5 Mes gémissements sont tels Que ma peau s'attache à mes os.\n6 Je ressemble au pélican du désert, Je suis comme le hibou des ruines ;\n7 Je n'ai plus de sommeil, et je suis Comme l'oiseau solitaire sur un toit.\n8 Chaque jour mes ennemis m'outragent, Et c'est par mon nom que maudissent ceux qui sont furieux contre moi.\n9 Je mange la poussière au lieu de pain, Et je mêle des larmes à ma boisson,\n10 À cause de ta colère et de ton indignation ; Car tu m'as soulevé et jeté au loin.\n11 Mes jours sont comme l'ombre à son déclin, Et je me dessèche comme l'herbe.\n12 Mais toi, Éternel, tu règnes à perpétuité, Et ta mémoire dure de génération en génération.\n13 Tu te lèveras, tu auras pitié de Sion ; Car le temps d'avoir pitié d'elle, Le temps fixé est arrivé.\n14 Car tes serviteurs en aiment les pierres, Ils en chérissent la poussière.\n15 Alors les nations craindront le nom de l'Éternel, Et tous les rois de la terre ta gloire.\n16 Oui, l'Éternel rebâtira Sion, Il paraîtra dans sa gloire.\n17 Il est attentif à la prière du misérable, Il ne dédaigne pas sa supplication.\n18 Que cela soit écrit pour la génération future, Et que le peuple qui sera créé célèbre l'Éternel !\n19 Car il regarde du lieu élevé de sa sainteté ; Du haut des cieux l'Éternel regarde sur la terre,\n20 Pour écouter les gémissements des captifs, Pour délivrer ceux qui sont voués à la mort,\n21 Afin qu'ils publient dans Sion le nom de l'Éternel, Et ses louanges dans Jérusalem,\n22 Quand tous les peuples s'assembleront, Et tous les royaumes, pour servir l'Éternel.\n23 Il a brisé ma force dans la route, Il a abrégé mes jours.\n24 Je dis : Mon Dieu, ne m'enlève pas au milieu de mes jours, Toi, dont les années durent éternellement !\n25 Tu as anciennement fondé la terre, Et les cieux sont l'ouvrage de tes mains.\n26 Ils périront, mais tu subsisteras ; Ils s'useront tous comme un vêtement ; Tu les changeras comme un habit, et ils seront changés.\n27 Mais toi, tu restes le même, Et tes années ne finiront point.\n28 Les fils de tes serviteurs habiteront leur pays, Et leur postérité s'affermira devant toi."
            }, {
                num: 103,
                titre: "De David.",
                premierVers: "Mon âme, bénis l'Éternel ! Que tout ce qui est en moi bénisse son saint nom !",
                texte: "1 Mon âme, bénis l'Éternel ! Que tout ce qui est en moi bénisse son saint nom !\n2 Mon âme, bénis l'Éternel, Et n'oublie aucun de ses bienfaits !\n3 C'est lui qui pardonne toutes tes iniquités, Qui guérit toutes tes maladies ;\n4 C'est lui qui délivre ta vie de la fosse, Qui te couronne de bonté et de miséricorde ;\n5 C'est lui qui rassasie de biens ta vieillesse, Qui te fait rajeunir comme l'aigle.\n6 L'Éternel fait justice, Il fait droit à tous les opprimés.\n7 Il a manifesté ses voies à Moïse, Ses œuvres aux enfants d'Israël.\n8 L'Éternel est miséricordieux et compatissant, Lent à la colère et riche en bonté ;\n9 Il ne conteste pas sans cesse, Il ne garde pas sa colère à toujours ;\n10 Il ne nous traite pas selon nos péchés, Il ne nous punit pas selon nos iniquités.\n11 Mais autant les cieux sont élevés au-dessus de la terre, Autant sa bonté est grande pour ceux qui le craignent ;\n12 Autant l'orient est éloigné de l'occident, Autant il éloigne de nous nos transgressions.\n13 Comme un père a compassion de ses enfants, L'Éternel a compassion de ceux qui le craignent.\n14 Car il sait de quoi nous sommes formés, Il se souvient que nous sommes poussière.\n15 L'homme ! ses jours sont comme l'herbe, Il fleurit comme la fleur des champs.\n16 Lorsqu'un vent passe sur elle, elle n'est plus, Et le lieu qu'elle occupait ne la reconnaît plus.\n17 Mais la bonté de l'Éternel dure à jamais pour ceux qui le craignent, Et sa miséricorde pour les enfants de leurs enfants,\n18 Pour ceux qui gardent son alliance, Et se souviennent de ses commandements afin de les accomplir.\n19 L'Éternel a établi son trône dans les cieux, Et son règne domine sur toutes choses.\n20 Bénissez l'Éternel, vous ses anges, Qui êtes puissants en force, et qui exécutez ses ordres, En obéissant à la voix de sa parole !\n21 Bénissez l'Éternel, vous toutes ses armées, Qui êtes ses serviteurs, et qui faites sa volonté !\n22 Bénissez l'Éternel, vous toutes ses œuvres, Dans tous les lieux de sa domination ! Mon âme, bénis l'Éternel !"
            }, {
                num: 104,
                titre: "",
                premierVers: "Mon âme, bénis l'Éternel ! Éternel, mon Dieu, tu es infiniment grand ! Tu es revêtu d'éclat et de magnificence !",
                texte: "1 Mon âme, bénis l'Éternel ! Éternel, mon Dieu, tu es infiniment grand ! Tu es revêtu d'éclat et de magnificence !\n2 Il s'enveloppe de lumière comme d'un manteau ; Il étend les cieux comme un pavillon.\n3 Il forme avec les eaux le faîte de sa demeure ; Il prend les nuées pour son char, Il s'avance sur les ailes du vent.\n4 Il fait des vents ses messagers, Des flammes de feu ses serviteurs.\n5 Il a établi la terre sur ses fondements, Elle ne sera jamais ébranlée.\n6 Tu l'avais couverte de l'abîme comme d'un vêtement, Les eaux s'arrêtaient sur les montagnes ;\n7 Elles ont fui devant ta menace, Elles se sont précipitées à la voix de ton tonnerre.\n8 Des montagnes se sont élevées, des vallées se sont abaissées, Au lieu que tu leur avais fixé.\n9 Tu as posé une limite que les eaux ne doivent point franchir, Afin qu'elles ne reviennent plus couvrir la terre.\n10 Il conduit les sources dans des torrents Qui coulent entre les montagnes.\n11 Elles abreuvent tous les animaux des champs ; Les ânes sauvages y étanchent leur soif.\n12 Les oiseaux du ciel habitent sur leurs bords, Et font résonner leur voix parmi les rameaux.\n13 De sa haute demeure, il abreuve les montagnes ; La terre est rassasiée du fruit de tes œuvres.\n14 Il fait germer l'herbe pour le bétail, Et les plantes pour les besoins de l'homme, Afin que la terre produise du pain,\n15 Le vin qui réjouit le cœur de l'homme, Et fait plus que l'huile resplendir son visage, Et le pain qui soutient le cœur de l'homme.\n16 Les arbres de l'Éternel se rassasient, Les cèdres du Liban, qu'il a plantés.\n17 C'est là que les oiseaux font leurs nids ; La cigogne a sa demeure dans les cyprès,\n18 Les montagnes élevées sont pour les bouquetins, Les rochers sont le refuge des damans.\n19 Il a fait la lune pour marquer les temps ; Le soleil sait quand il doit se coucher.\n20 Tu amènes les ténèbres, et il est nuit : Alors tous les animaux des forêts sont en mouvement ;\n21 Les lionceaux rugissent après leur proie, Et demandent à Dieu leur nourriture.\n22 Le soleil se lève : ils se retirent, Et se couchent dans leurs tanières.\n23 L'homme sort pour se rendre à son ouvrage, Et à son travail, jusqu'au soir.\n24 Que tes œuvres sont nombreuses, ô Éternel ! Tu les as toutes faites avec sagesse. La terre est remplie de tes biens.\n25 Voici la grande et vaste mer : Là se meuvent sans nombre Des animaux petits et grands ;\n26 Là se promènent les navires, Et ce léviathan que tu as formé pour se jouer dans les flots.\n27 Tous ces animaux espèrent en toi, Pour que tu leur donnes la nourriture en son temps.\n28 Tu la leur donnes, et ils la recueillent ; Tu ouvres ta main, et ils se rassasient de biens.\n29 Tu caches ta face : ils sont tremblants ; Tu leur retires le souffle : ils expirent, Et retournent dans leur poussière.\n30 Tu envoies ton souffle : ils sont créés, Et tu renouvelles la face de la terre.\n31 Que la gloire de l'Éternel subsiste à jamais ! Que l'Éternel se réjouisse de ses œuvres !\n32 Il regarde la terre, et elle tremble ; Il touche les montagnes, et elles sont fumantes.\n33 Je chanterai l'Éternel tant que je vivrai, Je célébrerai mon Dieu tant que j'existerai.\n34 Que mes paroles lui soient agréables ! Je veux me réjouir en l'Éternel.\n35 Que les pécheurs disparaissent de la terre, Et que les méchants ne soient plus ! Mon âme, bénis l'Éternel ! Louez l'Éternel !"
            }, {
                num: 105,
                titre: "",
                premierVers: "Louez l'Éternel, invoquez son nom ! Faites connaître parmi les peuples ses hauts faits !",
                texte: "1 Louez l'Éternel, invoquez son nom ! Faites connaître parmi les peuples ses hauts faits !\n2 Chantez, chantez en son honneur ! Parlez de toutes ses merveilles !\n3 Glorifiez-vous de son saint nom ! Que le cœur de ceux qui cherchent l'Éternel se réjouisse !\n4 Ayez recours à l'Éternel et à son appui, Cherchez continuellement sa face !\n5 Souvenez-vous des prodiges qu'il a faits, De ses miracles et des jugements de sa bouche,\n6 Postérité d'Abraham, son serviteur, Enfants de Jacob, ses élus !\n7 L'Éternel est notre Dieu ; Ses jugements s'exercent sur toute la terre.\n8 Il se rappelle à toujours son alliance, Ses promesses pour mille générations,\n9 L'alliance qu'il a traitée avec Abraham, Et le serment qu'il a fait à Isaac ;\n10 Il l'a érigée pour Jacob en loi, Pour Israël en alliance éternelle,\n11 Disant : Je te donnerai le pays de Canaan Comme héritage qui vous est échu.\n12 Ils étaient alors peu nombreux, Très peu nombreux, et étrangers dans le pays,\n13 Et ils allaient d'une nation à l'autre Et d'un royaume vers un autre peuple ;\n14 Mais il ne permit à personne de les opprimer, Et il châtia des rois à cause d'eux :\n15 Ne touchez pas à mes oints, Et ne faites pas de mal à mes prophètes !\n16 Il appela sur le pays la famine, Il coupa tout moyen de subsistance.\n17 Il envoya devant eux un homme : Joseph fut vendu comme esclave.\n18 On serra ses pieds dans des liens, On le mit aux fers,\n19 Jusqu'au temps où arriva ce qu'il avait annoncé, Et où la parole de l'Éternel l'éprouva.\n20 Le roi fit ôter ses liens, Le dominateur des peuples le délivra.\n21 Il l'établit seigneur sur sa maison, Et gouverneur de tous ses biens,\n22 Afin qu'il pût à son gré enchaîner ses princes, Et qu'il enseignât la sagesse à ses anciens.\n23 Alors Israël vint en Égypte, Et Jacob séjourna dans le pays de Cham.\n24 L'Éternel rendit son peuple très fécond, Et plus puissant que ses adversaires.\n25 Il changea le cœur des Égyptiens, pour qu'ils haïssent son peuple Et qu'ils traitassent ses serviteurs avec perfidie.\n26 Il envoya Moïse, son serviteur, Et Aaron, qu'il avait choisi.\n27 Ils accomplirent par son pouvoir des prodiges au milieu d'eux, Ils firent des miracles dans le pays de Cham.\n28 Il envoya des ténèbres, et il fit obscurité, Et ils ne furent pas rebelles à sa parole.\n29 Il changea leurs eaux en sang, Et fit périr leurs poissons.\n30 Le pays fourmilla de grenouilles, Jusque dans les chambres de leurs rois.\n31 Il dit, et parurent les mouches venimeuses, Les poux sur tout leur territoire.\n32 Il leur donna pour pluie de la grêle, Des flammes de feu dans leur pays.\n33 Il frappa leurs vignes et leurs figuiers, Et brisa les arbres de leur contrée.\n34 Il dit, et parurent les sauterelles, Des sauterelles sans nombre,\n35 Qui dévorèrent toute l'herbe du pays, Qui dévorèrent les fruits de leurs champs.\n36 Il frappa tous les premiers-nés dans leur pays, Toutes les prémices de leur force.\n37 Il fit sortir son peuple avec de l'argent et de l'or, Et nul ne chancela parmi ses tribus.\n38 Les Égyptiens se réjouirent de leur départ, Car la terreur qu'ils avaient d'eux les saisissait.\n39 Il étendit la nuée pour les couvrir, Et le feu pour éclairer la nuit.\n40 À leur demande, il fit venir des cailles, Et il les rassasia du pain du ciel.\n41 Il ouvrit le rocher, et des eaux coulèrent ; Elles se répandirent comme un fleuve dans les lieux arides.\n42 Car il se souvint de sa parole sainte, Et d'Abraham, son serviteur.\n43 Il fit sortir son peuple dans l'allégresse, Ses élus au milieu des cris de joie.\n44 Il leur donna les terres des nations, Et ils possédèrent le fruit du travail des peuples,\n45 Afin qu'ils gardassent ses ordonnances, Et qu'ils observassent ses lois. Louez l'Éternel !"
            }, {
                num: 106,
                titre: "",
                premierVers: "Louez l'Éternel ! Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours !",
                texte: "1 Louez l'Éternel ! Louez l'Éternel, car il est bon, Car sa miséricorde dure à toujours !\n2 Qui dira les hauts faits de l'Éternel ? Qui publiera toute sa louange ?\n3 Heureux ceux qui observent la loi, Qui pratiquent la justice en tout temps !\n4 Éternel, souviens-toi de moi dans ta bienveillance pour ton peuple ! Souviens-toi de moi en lui accordant ton secours,\n5 Afin que je voie le bonheur de tes élus, Que je me réjouisse de la joie de ton peuple, Et que je me glorifie avec ton héritage !\n6 Nous avons péché comme nos pères, Nous avons commis l'iniquité, nous avons fait le mal.\n7 Nos pères en Égypte ne furent pas attentifs à tes miracles, Ils ne se souvinrent pas de la multitude de tes grâces, Ils furent rebelles près de la mer, près de la mer Rouge.\n8 Mais il les sauva à cause de son nom, Pour manifester sa puissance.\n9 Il menaça la mer Rouge, et elle se dessécha ; Et il les fit marcher à travers les abîmes comme dans un désert.\n10 Il les sauva de la main de celui qui les haïssait, Il les délivra de la main de l'ennemi.\n11 Les eaux couvrirent leurs adversaires : Il n'en resta pas un seul.\n12 Et ils crurent à ses paroles, Ils chantèrent ses louanges.\n13 Mais ils oublièrent bientôt ses œuvres, Ils n'attendirent pas l'exécution de ses desseins.\n14 Ils furent saisis de convoitise dans le désert, Et ils tentèrent Dieu dans la solitude.\n15 Il leur accorda ce qu'ils demandaient ; Puis il envoya le dépérissement dans leur corps.\n16 Ils se montrèrent, dans le camp, jaloux contre Moïse, Contre Aaron, le saint de l'Éternel.\n17 La terre s'ouvrit et engloutit Dathan, Et elle se referma sur la troupe d'Abiram ;\n18 Le feu embrasa leur troupe, La flamme consuma les méchants.\n19 Ils firent un veau en Horeb, Ils se prosternèrent devant une image de métal fondu,\n20 Ils échangèrent leur gloire Contre la figure d'un bœuf qui mange l'herbe.\n21 Ils oublièrent Dieu, leur sauveur, Qui avait fait de grandes choses en Égypte,\n22 Des miracles dans le pays de Cham, Des prodiges sur la mer Rouge.\n23 Et il parla de les exterminer ; Mais Moïse, son élu, se tint à la brèche devant lui, Pour détourner sa fureur et l'empêcher de les détruire.\n24 Ils méprisèrent le pays des délices ; Ils ne crurent pas à la parole de l'Éternel,\n25 Ils murmurèrent dans leurs tentes, Ils n'obéirent point à sa voix.\n26 Et il leva la main pour jurer De les faire tomber dans le désert,\n27 De faire tomber leur postérité parmi les nations, Et de les disperser au milieu des pays.\n28 Ils s'attachèrent à Baal-Peor, Et mangèrent des victimes sacrifiées aux morts.\n29 Ils irritèrent l'Éternel par leurs actions, Et une plaie fit irruption parmi eux.\n30 Phinées se leva et intervint, Et la plaie s'arrêta ;\n31 Cela lui fut imputé à justice, De génération en génération pour toujours.\n32 Ils irritèrent l'Éternel près des eaux de Meriba ; Et Moïse fut puni à cause d'eux,\n33 Car ils aigrirent son esprit, Et il s'exprima légèrement des lèvres.\n34 Ils ne détruisirent point les peuples Que l'Éternel leur avait ordonné de détruire.\n35 Ils se mêlèrent avec les nations, Et ils apprirent leurs œuvres.\n36 Ils servirent leurs idoles, Qui furent pour eux un piège ;\n37 Ils sacrifièrent leurs fils Et leurs filles aux démons,\n38 Ils répandirent le sang innocent, Le sang de leurs fils et de leurs filles, Qu'ils sacrifièrent aux idoles de Canaan, Et le pays fut profané par des meurtres.\n39 Ils se souillèrent par leurs œuvres, Ils se prostituèrent par leurs actions.\n40 La colère de l'Éternel s'enflamma contre son peuple, Et il prit en horreur son héritage.\n41 Il les livra entre les mains des nations ; Ceux qui les haïssaient dominèrent sur eux ;\n42 Leurs ennemis les opprimèrent, Et ils furent humiliés sous leur puissance.\n43 Plusieurs fois il les délivra ; Mais ils se montrèrent rebelles dans leurs desseins, Et ils devinrent malheureux par leur iniquité.\n44 Il vit leur détresse, Lorsqu'il entendit leurs supplications.\n45 Il se souvint en leur faveur de son alliance ; Il eut pitié selon sa grande bonté,\n46 Et il excita pour eux la compassion De tous ceux qui les retenaient captifs.\n47 Sauve-nous, Éternel, notre Dieu ! Et rassemble-nous du milieu des nations, Afin que nous célébrions ton saint nom, Et que nous mettions notre gloire à te louer !\n48 Béni soit l'Éternel, le Dieu d'Israël, d'éternité en éternité ! Et que tout le peuple dise : Amen ! Louez l'Éternel !"
            }, {
                num: 107,
                titre: "",
                premierVers: "Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours ! Qu'ainsi disent les rachetés de l'Éternel, ceux qu'il a délivrés de la main de l'ennemi,",
                texte: "1 Louez l'Éternel, car il est bon, Car sa miséricorde dure à toujours !\n2 Qu'ainsi disent les rachetés de l'Éternel, Ceux qu'il a délivrés de la main de l'ennemi,\n3 Et qu'il a rassemblés de tous les pays, De l'orient et de l'occident, du nord et de la mer !\n4 Ils erraient dans le désert, ils marchaient dans la solitude, Sans trouver une ville où ils pussent habiter.\n5 Ils souffraient de la faim et de la soif ; Leur âme était languissante.\n6 Dans leur détresse, ils crièrent à l'Éternel, Et il les délivra de leurs angoisses ;\n7 Il les conduisit par le droit chemin, Pour qu'ils arrivassent dans une ville habitable.\n8 Qu'ils louent l'Éternel pour sa bonté, Et pour ses merveilles en faveur des fils de l'homme !\n9 Car il a satisfait l'âme altérée, Il a comblé de biens l'âme affamée.\n10 Ceux qui habitaient les ténèbres et l'ombre de la mort Vivaient captifs dans la misère et dans les chaînes,\n11 Parce qu'ils s'étaient révoltés contre les paroles de Dieu, Parce qu'ils avaient méprisé le conseil du Très-Haut.\n12 Il humilia leur cœur par la souffrance ; Ils succombèrent, et personne ne les secourut.\n13 Dans leur détresse, ils crièrent à l'Éternel, Et il les délivra de leurs angoisses ;\n14 Il les fit sortir des ténèbres et de l'ombre de la mort, Et il rompit leurs liens.\n15 Qu'ils louent l'Éternel pour sa bonté, Et pour ses merveilles en faveur des fils de l'homme !\n16 Car il a brisé les portes d'airain, Il a rompu les verrous de fer.\n17 Les insensés, par leur conduite coupable Et par leurs iniquités, s'étaient rendus malheureux.\n18 Leur âme avait en horreur toute nourriture, Et ils touchaient aux portes de la mort.\n19 Dans leur détresse, ils crièrent à l'Éternel, Et il les délivra de leurs angoisses ;\n20 Il envoya sa parole et les guérit, Il les fit échapper de la fosse.\n21 Qu'ils louent l'Éternel pour sa bonté, Et pour ses merveilles en faveur des fils de l'homme !\n22 Qu'ils offrent des sacrifices d'actions de grâces, Et qu'ils publient ses œuvres avec des cris de joie !\n23 Ceux qui étaient descendus sur la mer dans des navires, Et qui travaillaient sur les grandes eaux,\n24 Ceux-là virent les œuvres de l'Éternel Et ses merveilles au milieu de l'abîme.\n25 Il dit, et il fit souffler la tempête, Qui souleva les flots de la mer.\n26 Ils montaient vers les cieux, ils descendaient dans l'abîme ; Leur âme était éperdue en face du danger ;\n27 Saisis de vertige, ils chancelaient comme un homme ivre, Et toute leur habileté était anéantie.\n28 Dans leur détresse, ils crièrent à l'Éternel, Et il les délivra de leurs angoisses ;\n29 Il arrêta la tempête, ramena le calme, Et les flots se turent.\n30 Ils se réjouirent de ce qu'ils s'étaient apaisés, Et l'Éternel les conduisit au port désiré.\n31 Qu'ils louent l'Éternel pour sa bonté, Et pour ses merveilles en faveur des fils de l'homme !\n32 Qu'ils l'exaltent dans l'assemblée du peuple, Et qu'ils le célèbrent dans la réunion des anciens !\n33 Il change les fleuves en désert, Et les sources d'eaux en terre desséchée,\n34 Le pays fertile en pays salé, À cause de la méchanceté de ses habitants.\n35 Il change le désert en étang, Et la terre aride en sources d'eaux,\n36 Et il y établit ceux qui sont affamés. Ils fondent une ville pour l'habiter ;\n37 Ils ensemencent des champs, plantent des vignes, Et ils en recueillent les produits.\n38 Il les bénit, et ils deviennent très nombreux, Et il ne diminue point leur bétail.\n39 Sont-ils amoindris et humiliés Par l'oppression, le malheur et la souffrance ;\n40 Verse-t-il le mépris sur les grands, Les fait-il errer dans des déserts sans chemin,\n41 Il relève le malheureux de la misère, Et il rend les familles nombreuses comme des troupeaux.\n42 Les hommes droits le voient et se réjouissent, Mais toute iniquité ferme la bouche.\n43 Que celui qui est sage prenne garde à ces choses, Et qu'il soit attentif aux bontés de l'Éternel."
            }, {
                num: 108,
                titre: "Cantique. Psaume de David.",
                premierVers: "Mon cœur est affermi, ô Dieu ! Je chanterai, je ferai retentir mes instruments : c'est ma gloire !",
                texte: "1 Mon cœur est affermi, ô Dieu ! Je chanterai, je ferai retentir mes instruments : c'est ma gloire !\n2 Réveillez-vous, mon luth et ma harpe ! Je réveillerai l'aurore.\n3 Je te louerai parmi les peuples, Éternel ! Je te chanterai parmi les nations.\n4 Car ta bonté s'élève au-dessus des cieux, Et ta fidélité jusqu'aux nues.\n5 Élève-toi sur les cieux, ô Dieu ! Et que ta gloire soit sur toute la terre !\n6 Afin que tes bien-aimés soient délivrés, Sauve par ta droite, et exauce-nous !\n7 Dieu a dit dans sa sainteté : Je triompherai, Je partagerai Sichem, je mesurerai la vallée de Succoth ;\n8 À moi Galaad, à moi Manassé ; Éphraïm est le rempart de ma tête, Et Juda, mon sceptre ;\n9 Moab est le bassin où je me lave ; Je jette mon soulier sur Édom ; Je pousse des cris de joie sur le pays des Philistins !\n10 Qui me mènera dans la ville forte ? Qui me conduit à Édom ?\n11 N'est-ce pas toi, ô Dieu, qui nous as repoussés, Et qui ne sortais plus, ô Dieu, avec nos armées ?\n12 Donne-nous du secours contre l'ennemi ! Car le secours de l'homme n'est que vanité.\n13 Avec Dieu, nous ferons des exploits ; Il écrasera nos ennemis."
            }, {
                num: 109,
                titre: "Au chef des chantres. De David. Psaume.",
                premierVers: "Dieu de ma louange, ne te tais point !",
                texte: "1 Dieu de ma louange, ne te tais point !\n2 Car ils ouvrent contre moi une bouche méchante et trompeuse, Ils me parlent avec une langue mensongère,\n3 Ils m'environnent de discours haineux Et ils me font la guerre sans cause.\n4 Tandis que je les aime, ils sont mes adversaires ; Mais moi je recours à la prière.\n5 Ils me rendent le mal pour le bien, Et de la haine pour mon amour.\n6 Place-le sous l'autorité d'un méchant, Et qu'un accusateur se tienne à sa droite !\n7 Quand on le jugera, qu'il soit déclaré coupable, Et que sa prière passe pour un péché !\n8 Que ses jours soient peu nombreux, Qu'un autre prenne sa charge !\n9 Que ses enfants deviennent orphelins, Et sa femme veuve !\n10 Que ses enfants soient vagabonds et qu'ils mendient, Qu'ils cherchent du pain loin de leurs demeures en ruines !\n11 Que le créancier s'empare de tout ce qui est à lui, Et que les étrangers pillent le fruit de son travail !\n12 Que nul ne conserve pour lui de l'affection, Et que personne n'ait pitié de ses orphelins !\n13 Que ses descendants soient exterminés, Et que leur nom s'éteigne dans la génération suivante !\n14 Que l'iniquité de ses pères reste en souvenir devant l'Éternel, Et que le péché de sa mère ne soit point effacé !\n15 Qu'ils soient toujours présents devant l'Éternel, Et qu'il retranche de la terre leur mémoire,\n16 Parce qu'il ne s'est pas souvenu d'exercer la miséricorde, Parce qu'il a persécuté le malheureux et l'indigent, Jusqu'à faire mourir l'homme au cœur brisé !\n17 Il aimait la malédiction : qu'elle tombe sur lui ! Il ne se plaisait pas à la bénédiction : qu'elle s'éloigne de lui !\n18 Qu'il revête la malédiction comme son vêtement, Qu'elle pénètre comme de l'eau dans son intérieur, Comme de l'huile dans ses os !\n19 Qu'elle lui serve de vêtement pour se couvrir, De ceinture dont il soit toujours ceint !\n20 Tel soit, de la part de l'Éternel, le salaire de mes ennemis, Et de ceux qui parlent méchamment de moi !\n21 Et toi, Éternel, Seigneur, agis en ma faveur à cause de ton nom, Car ta bonté est grande, délivre-moi !\n22 Je suis malheureux et indigent, Et mon cœur est blessé au-dedans de moi.\n23 Je m'en vais comme l'ombre à son déclin, Je suis chassé comme la sauterelle.\n24 Mes genoux sont affaiblis par le jeûne, Et mon corps est épuisé de maigreur.\n25 Je suis pour eux un objet d'opprobre ; Ils me regardent, et secouent la tête.\n26 Secours-moi, Éternel, mon Dieu ! Sauve-moi par ta bonté !\n27 Et qu'ils sachent que c'est ta main, Que c'est toi, Éternel, qui l'as fait !\n28 S'ils maudissent, toi tu béniras ; S'ils se lèvent, ils seront confus, Et ton serviteur se réjouira.\n29 Que mes adversaires revêtent l'ignominie, Qu'ils se couvrent de leur honte comme d'un manteau !\n30 Je louerai de ma bouche hautement l'Éternel, Je le célébrerai au milieu de la multitude ;\n31 Car il se tient à la droite du pauvre, Pour le délivrer de ceux qui le condamnent."
            }, {
                num: 110,
                titre: "De David. Psaume.",
                premierVers: "Parole de l'Éternel à mon Seigneur : Assieds-toi à ma droite, jusqu'à ce que je fasse de tes ennemis ton marchepied.",
                texte: "1 Parole de l'Éternel à mon Seigneur : Assieds-toi à ma droite, Jusqu'à ce que je fasse de tes ennemis ton marchepied.\n2 L'Éternel étendra de Sion le sceptre de ta puissance : Domine au milieu de tes ennemis !\n3 Ton peuple est plein de bonne volonté, Quand tu rassembles ton armée ; Avec des ornements sacrés, du sein de l'aurore Ta jeunesse vient à toi comme une rosée.\n4 L'Éternel l'a juré, et il ne se repentira point : Tu es sacrificateur pour toujours, À la manière de Melchisédek.\n5 Le Seigneur, à ta droite, Brise des rois au jour de sa colère.\n6 Il exerce la justice parmi les nations : tout est plein de cadavres ; Il brise des têtes sur toute l'étendue du pays.\n7 Il boit au torrent pendant la marche : C'est pourquoi il relève la tête."
            }, {
                num: 111,
                titre: "",
                premierVers: "Louez l'Éternel ! Je louerai l'Éternel de tout mon cœur, dans la réunion des hommes droits et dans l'assemblée.",
                texte: "1 Louez l'Éternel ! Je louerai l'Éternel de tout mon cœur, Dans la réunion des hommes droits et dans l'assemblée.\n2 Les œuvres de l'Éternel sont grandes, Recherchées par tous ceux qui les aiment.\n3 Son œuvre n'est que splendeur et magnificence, Et sa justice subsiste à jamais.\n4 Il a laissé la mémoire de ses prodiges ; L'Éternel est miséricordieux et compatissant.\n5 Il a donné de la nourriture à ceux qui le craignent ; Il se souvient toujours de son alliance.\n6 Il a manifesté à son peuple la puissance de ses œuvres, En lui livrant l'héritage des nations.\n7 Les œuvres de ses mains sont fidélité et justice ; Toutes ses ordonnances sont véritables,\n8 Affermies pour l'éternité, Faites avec fidélité et droiture.\n9 Il a envoyé la délivrance à son peuple, Il a établi pour toujours son alliance ; Son nom est saint et redoutable.\n10 La crainte de l'Éternel est le commencement de la sagesse ; Tous ceux qui l'observent ont une raison saine. Sa gloire subsiste à jamais."
            }, {
                num: 112,
                titre: "",
                premierVers: "Louez l'Éternel ! Heureux l'homme qui craint l'Éternel, qui trouve un grand plaisir à ses commandements.",
                texte: "1 Louez l'Éternel ! Heureux l'homme qui craint l'Éternel, Qui trouve un grand plaisir à ses commandements.\n2 Sa postérité sera puissante sur la terre, La génération des hommes droits sera bénie.\n3 Il a dans sa maison bien-être et richesse, Et sa justice subsiste à jamais.\n4 La lumière se lève dans les ténèbres pour les hommes droits, Pour celui qui est miséricordieux, compatissant et juste.\n5 Heureux l'homme qui exerce la miséricorde et qui prête, Qui règle ses actions d'après la justice.\n6 Car il ne chancelle jamais ; La mémoire du juste dure toujours.\n7 Il ne craint point les mauvaises nouvelles ; Son cœur est ferme, confiant en l'Éternel.\n8 Son cœur est affermi, il n'a point de crainte, Jusqu'à ce qu'il mette son plaisir à regarder ses adversaires.\n9 Il fait des largesses, il donne aux indigents ; Sa justice subsiste à jamais ; Sa tête s'élève avec gloire.\n10 Le méchant le voit et s'irrite, Il grince les dents et se consume ; Les désirs des méchants périssent."
            }, {
                num: 113,
                titre: "",
                premierVers: "Louez l'Éternel ! Serviteurs de l'Éternel, louez, louez le nom de l'Éternel !",
                texte: "1 Louez l'Éternel ! Serviteurs de l'Éternel, louez, Louez le nom de l'Éternel !\n2 Que le nom de l'Éternel soit béni, Dès maintenant et à jamais !\n3 Du lever du soleil jusqu'à son couchant, Que le nom de l'Éternel soit célébré !\n4 L'Éternel est élevé au-dessus de toutes les nations, Sa gloire est au-dessus des cieux.\n5 Qui est semblable à l'Éternel, notre Dieu ? Il a sa demeure en haut ;\n6 Il abaisse les regards Sur les cieux et sur la terre.\n7 De la poussière il retire le pauvre, Du fumier il relève l'indigent,\n8 Pour les faire asseoir avec les grands, Avec les grands de son peuple.\n9 Il donne une maison à celle qui était stérile, Il en fait une mère joyeuse au milieu de ses enfants. Louez l'Éternel !"
            }, {
                num: 114,
                titre: "",
                premierVers: "Quand Israël sortit d'Égypte, quand la maison de Jacob s'éloigna d'un peuple barbare,",
                texte: "1 Quand Israël sortit d'Égypte, Quand la maison de Jacob s'éloigna d'un peuple barbare,\n2 Juda devint son sanctuaire, Israël fut son domaine.\n3 La mer le vit et s'enfuit, Le Jourdain retourna en arrière ;\n4 Les montagnes sautèrent comme des béliers, Les collines comme des agneaux.\n5 Qu'as-tu, mer, pour t'enfuir, Jourdain, pour retourner en arrière ?\n6 Qu'avez-vous, montagnes, pour sauter comme des béliers, Et vous, collines, comme des agneaux ?\n7 Tremble, ô terre, devant le Seigneur, Devant le Dieu de Jacob,\n8 Qui change le rocher en étang, Le roc en source d'eaux."
            }, {
                num: 115,
                titre: "",
                premierVers: "Non pas à nous, Éternel, non pas à nous, mais à ton nom donne gloire, à cause de ta bonté, à cause de ta fidélité !",
                texte: "1 Non pas à nous, Éternel, non pas à nous, Mais à ton nom donne gloire, À cause de ta bonté, à cause de ta fidélité !\n2 Pourquoi les nations diraient-elles : Où donc est leur Dieu ?\n3 Notre Dieu est au ciel, Il fait tout ce qu'il veut.\n4 Leurs idoles sont de l'argent et de l'or, Elles sont l'ouvrage de la main des hommes.\n5 Elles ont une bouche et ne parlent point, Elles ont des yeux et ne voient point,\n6 Elles ont des oreilles et n'entendent point, Elles ont un nez et ne sentent point,\n7 Elles ont des mains et ne touchent point, Des pieds et ne marchent point, Elles ne produisent aucun son dans leur gosier.\n8 Ils leur ressemblent, ceux qui les font, Tous ceux qui se confient en elles.\n9 Israël, confie-toi en l'Éternel ! Il est leur secours et leur bouclier.\n10 Maison d'Aaron, confie-toi en l'Éternel ! Il est leur secours et leur bouclier.\n11 Vous qui craignez l'Éternel, confiez-vous en l'Éternel ! Il est leur secours et leur bouclier.\n12 L'Éternel se souvient de nous : il bénira, Il bénira la maison d'Israël, Il bénira la maison d'Aaron,\n13 Il bénira ceux qui craignent l'Éternel, les petits et les grands ;\n14 L'Éternel vous multipliera ses faveurs, À vous et à vos enfants.\n15 Soyez bénis par l'Éternel, Qui a fait les cieux et la terre !\n16 Les cieux sont les cieux de l'Éternel, Mais il a donné la terre aux fils de l'homme.\n17 Ce ne sont pas les morts qui louent l'Éternel, Ce n'est aucun de ceux qui descendent dans le lieu du silence ;\n18 Mais nous, nous bénirons l'Éternel, Dès maintenant et à jamais. Louez l'Éternel !"
            }, {
                num: 116,
                titre: "",
                premierVers: "J'aime l'Éternel, car il entend ma voix, mes supplications ;",
                texte: "1 J'aime l'Éternel, car il entend Ma voix, mes supplications ;\n2 Car il a penché son oreille vers moi ; Et je l'invoquerai toute ma vie.\n3 Les liens de la mort m'avaient environné, Et les angoisses du sépulcre m'avaient saisi ; J'étais en proie à la détresse et à la douleur.\n4 Mais j'invoquai le nom de l'Éternel : Ô Éternel, sauve mon âme !\n5 L'Éternel est miséricordieux et juste, Notre Dieu est plein de compassion ;\n6 L'Éternel garde les simples ; J'étais malheureux, et il m'a sauvé.\n7 Mon âme, retourne à ton repos, Car l'Éternel t'a fait du bien.\n8 Oui, tu as délivré mon âme de la mort, Mes yeux des larmes, Mes pieds de la chute.\n9 Je marcherai devant l'Éternel, Sur la terre des vivants.\n10 J'avais confiance, lorsque je disais : Je suis bien malheureux !\n11 Je disais dans mon angoisse : Tout homme est menteur.\n12 Comment rendrai-je à l'Éternel Tous ses bienfaits envers moi ?\n13 J'élèverai la coupe des délivrances, Et j'invoquerai le nom de l'Éternel ;\n14 J'accomplirai mes vœux envers l'Éternel, En présence de tout son peuple.\n15 Elle a du prix aux yeux de l'Éternel, La mort de ses bien-aimés.\n16 Écoute-moi, ô Éternel, car je suis ton serviteur, Ton serviteur, fils de ta servante. Tu as détaché mes liens.\n17 Je t'offrirai un sacrifice d'actions de grâces, Et j'invoquerai le nom de l'Éternel ;\n18 J'accomplirai mes vœux envers l'Éternel, En présence de tout son peuple,\n19 Dans les parvis de la maison de l'Éternel, Au milieu de toi, Jérusalem ! Louez l'Éternel !"

            }, {
                num: 118,
                titre: "",
                premierVers: "Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours !",
                texte: "1 Louez l'Éternel, car il est bon, Car sa miséricorde dure à toujours !\n2 Qu'Israël dise : Car sa miséricorde dure à toujours !\n3 Que la maison d'Aaron dise : Car sa miséricorde dure à toujours !\n4 Que ceux qui craignent l'Éternel disent : Car sa miséricorde dure à toujours !\n5 Du sein de la détresse j'ai invoqué l'Éternel : L'Éternel m'a exaucé, il m'a mis au large.\n6 L'Éternel est pour moi, je ne crains rien : Que peuvent me faire des hommes ?\n7 L'Éternel est mon secours, Et je me réjouis à la vue de mes ennemis.\n8 Mieux vaut chercher un refuge en l'Éternel Que de se confier à l'homme ;\n9 Mieux vaut chercher un refuge en l'Éternel Que de se confier aux grands.\n10 Toutes les nations m'environnaient : Au nom de l'Éternel, je les taille en pièces.\n11 Elles m'environnaient, m'enveloppaient : Au nom de l'Éternel, je les taille en pièces.\n12 Elles m'environnaient comme des abeilles ; Elles s'éteignent comme un feu d'épines ; Au nom de l'Éternel, je les taille en pièces.\n13 Tu me poussais pour me faire tomber ; Mais l'Éternel m'a secouru.\n14 L'Éternel est ma force et le sujet de mes louanges ; C'est lui qui m'a sauvé.\n15 Des cris de triomphe et de salut s'élèvent dans les tentes des justes : La droite de l'Éternel manifeste sa puissance !\n16 La droite de l'Éternel est élevée ! La droite de l'Éternel manifeste sa puissance !\n17 Je ne mourrai pas, je vivrai, Et je raconterai les œuvres de l'Éternel.\n18 L'Éternel m'a châtié, Mais il ne m'a pas livré à la mort.\n19 Ouvrez-moi les portes de la justice : J'entrerai, je louerai l'Éternel.\n20 Voici la porte de l'Éternel : C'est par elle qu'entrent les justes.\n21 Je te loue, parce que tu m'as exaucé, Parce que tu m'as sauvé.\n22 La pierre qu'ont rejetée ceux qui bâtissaient Est devenue la principale de l'angle.\n23 C'est de l'Éternel que cela est venu : C'est un prodige à nos yeux.\n24 C'est ici la journée que l'Éternel a faite : Qu'elle soit pour nous un sujet d'allégresse et de joie !\n25 Ô Éternel, accorde le salut ! Ô Éternel, donne la prospérité !\n26 Béni soit celui qui vient au nom de l'Éternel ! Nous vous bénissons de la maison de l'Éternel.\n27 L'Éternel est Dieu, et il nous éclaire. Attachez la victime avec des liens, Amenez-la jusqu'aux cornes de l'autel !\n28 Tu es mon Dieu, et je te louerai ; Mon Dieu, je t'exalterai.\n29 Louez l'Éternel, car il est bon, Car sa miséricorde dure à toujours !"
            }, {
                num: 119,
                titre: "",
                premierVers: "Heureux ceux qui sont intègres dans leur voie, qui marchent selon la loi de l'Éternel !",
                texte: "1 Heureux ceux qui sont intègres dans leur voie, Qui marchent selon la loi de l'Éternel !\n2 Heureux ceux qui gardent ses préceptes, Qui le cherchent de tout leur cœur,\n3 Qui ne commettent point d'iniquité, Et qui marchent dans ses voies !\n4 Tu as prescrit tes ordonnances, Pour qu'on les observe avec soin.\n5 Puissent mes actions être bien réglées, Afin que je garde tes statuts !\n6 Alors je ne rougirai point, À la vue de tous tes commandements.\n7 Je te louerai dans la droiture de mon cœur, En apprenant les lois de ta justice.\n8 Je veux garder tes statuts : Ne m'abandonne pas entièrement !\n9 Comment le jeune homme rendra-t-il pur son sentier ? En se dirigeant d'après ta parole.\n10 Je te cherche de tout mon cœur : Ne me laisse pas m'égarer loin de tes commandements !\n11 Je serre ta parole dans mon cœur, Afin de ne pas pécher contre toi.\n12 Béni sois-tu, ô Éternel ! Enseigne-moi tes statuts !\n13 De mes lèvres j'énumère Tous les jugements de ta bouche.\n14 Je me réjouis en suivant tes préceptes, Comme si je possédais tous les trésors.\n15 Je médite tes ordonnances, J'ai tes sentiers sous les yeux.\n16 Je fais mes délices de tes statuts, Je n'oublie point ta parole.\n17 Fais du bien à ton serviteur, pour que je vive Et que j'observe ta parole !\n18 Ouvre mes yeux, pour que je contemple Les merveilles de ta loi !\n19 Je suis un étranger sur la terre : Ne me cache pas tes commandements !\n20 Mon âme est brisée par le désir Qui toujours la porte vers tes lois.\n21 Tu menaces les orgueilleux, ces maudits, Qui s'égarent loin de tes commandements.\n22 Décharge-moi de l'opprobre et du mépris ! Car j'observe tes préceptes.\n23 Des princes ont beau s'asseoir et parler contre moi, Ton serviteur médite tes statuts.\n24 Tes préceptes font mes délices, Ce sont mes conseillers.\n25 Mon âme est attachée à la poussière : Rends-moi la vie selon ta parole !\n26 Je raconte mes voies, et tu m'exauces : Enseigne-moi tes statuts !\n27 Fais-moi comprendre la voie de tes ordonnances, Et je méditerai sur tes merveilles !\n28 Mon âme pleure de chagrin : Relève-moi selon ta parole !\n29 Éloigne de moi la voie du mensonge, Et accorde-moi la grâce de suivre ta loi !\n30 Je choisis la voie de la vérité, Je place tes lois sous mes yeux.\n31 Je m'attache à tes préceptes : Éternel, ne me rends point confus !\n32 Je cours dans la voie de tes commandements, Car tu élargis mon cœur.\n33 Enseigne-moi, Éternel, la voie de tes statuts, Pour que je la retienne jusqu'à la fin !\n34 Donne-moi l'intelligence, pour que je garde ta loi Et que je l'observe de tout mon cœur !\n35 Conduis-moi dans le sentier de tes commandements ! Car je l'aime.\n36 Incline mon cœur vers tes préceptes, Et non vers le gain !\n37 Détourne mes yeux de la vue des choses vaines, Fais-moi vivre dans ta voie !\n38 Accomplis envers ton serviteur ta promesse, Qui est pour ceux qui te craignent !\n39 Éloigne de moi l'opprobre que je redoute ! Car tes jugements sont pleins de bonté.\n40 Voici, je désire pratiquer tes ordonnances : Fais-moi vivre dans ta justice !\n41 Éternel, que ta miséricorde vienne sur moi, Ton salut selon ta promesse !\n42 Et je pourrai répondre à celui qui m'outrage, Car je me confie en ta parole.\n43 N'ôte pas entièrement de ma bouche la parole de la vérité ! Car j'espère en tes jugements.\n44 Je garderai ta loi constamment, À toujours et à perpétuité.\n45 Je marcherai au large, Car je recherche tes ordonnances.\n46 Je parlerai de tes préceptes devant les rois, Et je ne rougirai point.\n47 Je fais mes délices de tes commandements. Je les aime.\n48 Je lève mes mains vers tes commandements que j'aime, Et je veux méditer tes statuts.\n49 Souviens-toi de ta promesse à ton serviteur, Puisque tu m'as donné l'espérance !\n50 C'est ma consolation dans ma misère, Car ta promesse me rend la vie.\n51 Des orgueilleux me chargent de railleries ; Je ne m'écarte point de ta loi.\n52 Je pense à tes jugements d'autrefois, ô Éternel ! Et je me console.\n53 Une ardente colère me saisit à la vue des méchants Qui abandonnent ta loi.\n54 Tes statuts sont le sujet de mes cantiques, Dans la maison où je suis étranger.\n55 La nuit je me souviens de ton nom, ô Éternel ! Et je garde ta loi.\n56 C'est là ce qui m'est propre, Car j'observe tes ordonnances.\n57 Ma part, ô Éternel, je le dis, C'est de garder tes paroles.\n58 Je t'implore de tout mon cœur : Aie pitié de moi, selon ta promesse !\n59 Je réfléchis à mes voies, Et je dirige mes pieds vers tes préceptes.\n60 Je me hâte, je ne diffère point D'observer tes commandements.\n61 Les pièges des méchants m'environnent ; Je n'oublie point ta loi.\n62 Au milieu de la nuit je me lève pour te louer, À cause des jugements de ta justice.\n63 Je suis l'ami de tous ceux qui te craignent, Et de ceux qui gardent tes ordonnances.\n64 La terre, ô Éternel, est pleine de ta bonté ; Enseigne-moi tes statuts !\n65 Tu fais du bien à ton serviteur, Ô Éternel, selon ta parole !\n66 Enseigne-moi le sens et la connaissance ! Car je crois à tes commandements.\n67 Avant d'avoir été humilié, je m'égarais ; Maintenant j'observe ta parole.\n68 Tu es bon et bienfaisant ; Enseigne-moi tes statuts !\n69 Des orgueilleux imaginent contre moi des faussetés ; Moi, je garde de tout mon cœur tes ordonnances.\n70 Leur cœur est insensible comme la graisse ; Moi, je fais mes délices de ta loi.\n71 Il m'est bon d'être humilié, Afin que j'apprenne tes statuts.\n72 Mieux vaut pour moi la loi de ta bouche Que mille objets d'or et d'argent.\n73 Tes mains m'ont créé, elles m'ont formé ; Donne-moi l'intelligence, pour que j'apprenne tes commandements !\n74 Ceux qui te craignent me voient et se réjouissent, Car j'espère en tes promesses.\n75 Je sais, ô Éternel, que tes jugements sont justes ; C'est par fidélité que tu m'as humilié.\n76 Que ta bonté soit ma consolation, Comme tu l'as promis à ton serviteur !\n77 Que tes compassions viennent sur moi, pour que je vive ! Car ta loi fait mes délices.\n78 Qu'ils soient confondus, les orgueilleux qui m'oppriment sans cause ! Moi, je médite sur tes ordonnances.\n79 Qu'ils reviennent à moi, ceux qui te craignent, Et ceux qui connaissent tes préceptes !\n80 Que mon cœur soit sincère dans tes statuts, Afin que je ne sois pas couvert de honte !\n81 Mon âme languit après ton salut ; J'espère en ta promesse.\n82 Mes yeux languissent après ta promesse ; Je dis : Quand me consoleras-tu ?\n83 Car je suis comme une outre dans la fumée ; Je n'oublie point tes statuts.\n84 Quel est le nombre des jours de ton serviteur ? Quand feras-tu justice de ceux qui me persécutent ?\n85 Des orgueilleux creusent des fosses devant moi ; Ils n'agissent point selon ta loi.\n86 Tous tes commandements sont fidèles ; Ils me persécutent sans cause : secours-moi !\n87 Ils ont failli me terrasser et m'anéantir ; Et moi, je n'abandonne point tes ordonnances.\n88 Fais-moi vivre selon ta bonté, Afin que j'observe les préceptes de ta bouche !\n89 À toujours, ô Éternel ! Ta parole subsiste dans les cieux.\n90 De génération en génération ta fidélité subsiste ; Tu as fondé la terre, et elle demeure ferme.\n91 C'est d'après tes lois que tout subsiste aujourd'hui, Car toutes choses te sont assujetties.\n92 Si ta loi n'eût fait mes délices, J'eusse alors péri dans ma misère.\n93 Je n'oublierai jamais tes ordonnances, Car c'est par elles que tu me rends la vie.\n94 Je suis à toi : sauve-moi ! Car je recherche tes ordonnances.\n95 Des méchants m'attendent pour me faire périr ; Je suis attentif à tes préceptes.\n96 Je vois des bornes à tout ce qui est parfait : Tes commandements n'ont point de limite.\n97 Combien j'aime ta loi ! Elle est tout le jour ma méditation.\n98 Tes commandements me rendent plus sage que mes ennemis, Car je les ai toujours avec moi.\n99 Je suis plus instruit que tous mes maîtres, Car tes préceptes sont ma méditation.\n100 J'ai plus d'intelligence que les vieillards, Car j'observe tes ordonnances.\n101 Je retiens mon pied loin de tout mauvais chemin, Afin de garder ta parole.                 titre: "",
                premierVers: "Louez l'Éternel ! Chantez à l'Éternel un cantique nouveau ! Chantez ses louanges dans l'assemblée des fidèles !",
                texte: "1 Louez l'Éternel ! Chantez à l'Éternel un cantique nouveau ! Chantez ses louanges dans l'assemblée des fidèles !\n2 Qu'Israël se réjouisse en celui qui l'a créé ! Que les fils de Sion soient dans l'allégresse à cause de leur roi !\n3 Qu'ils louent son nom avec des danses, Qu'ils le célèbrent avec le tambourin et la harpe !\n4 Car l'Éternel prend plaisir à son peuple, Il glorifie les malheureux en les sauvant.\n5 Que les fidèles triomphent dans la gloire, Qu'ils poussent des cris de joie sur leur couche !\n6 Que les louanges de Dieu soient dans leur bouche, Et le glaive à deux tranchants dans leur main,\n7 Pour exercer la vengeance sur les nations, Pour châtier les peuples,\n8 Pour lier leurs rois avec des chaînes Et leurs grands avec des entraves de fer,\n9 Pour exécuter contre eux le jugement qui est écrit ! C'est une gloire pour tous ses fidèles. Louez l'Éternel !"
            }, {
                num: 150,
                titre: "",
                premierVers: "Louez l'Éternel ! Louez Dieu dans son sanctuaire ! Louez-le dans l'étendue céleste, où éclate sa puissance !",
                texte: "1 Louez l'Éternel ! Louez Dieu dans son sanctuaire ! Louez-le dans l'étendue céleste, où éclate sa puissance !\n2 Louez-le pour ses hauts faits ! Louez-le selon l'immensité de sa grandeur !\n3 Louez-le au son de la trompette ! Louez-le avec le luth et la harpe !\n4 Louez-le avec le tambourin et avec des danses ! Louez-le avec les instruments à cordes et le chalumeau !\n5 Louez-le avec les cymbales sonores ! Louez-le avec les cymbales retentissantes !\n6 Que tout ce qui respire loue l'Éternel ! Louez l'Éternel !"
            }];

            // ============================================================
            // VARIABLES GLOBALES POUR LA RECHERCHE PAGINÉE
            // ============================================================
            let rechercheResultats = [];   // tous les résultats uniques
            let recherchePage = 1;        // page courante
            const RESULTATS_PAR_PAGE = 20; // nombre de résultats par page
            let dernierMotRecherche = '';  // mot recherché pour le surlignage

            // ============================================================
            // RÉFÉRENCES DOM
            // ============================================================
            const inputNum = document.getElementById('psalmNum');
            const btnGoNum = document.getElementById('btnGoNum');
            const selectPsaume = document.getElementById('psalmSelect');
            const searchInput = document.getElementById('searchInput');
            const btnSearch = document.getElementById('btnSearch');
            const searchResults = document.getElementById('searchResults');
            const psalmDisplay = document.getElementById('psalmDisplay');

            // ============================================================
            // INITIALISATION DU MENU DÉROULANT
            // ============================================================
            function initSelect() {
                psaumes.forEach(ps => {
                    const option = document.createElement('option');
                    option.value = ps.num;
                    let premierVersCourt = ps.premierVers;
                    if (premierVersCourt.length > 100) {
                        premierVersCourt = premierVersCourt.substring(0, 97) + '...';
                    }
                    option.textContent = `Psaume ${ps.num} — ${premierVersCourt}`;
                    option.title = ps.premierVers;
                    selectPsaume.appendChild(option);
                });
            }

            // ============================================================
            // AFFICHAGE D'UN PSAUME
            // ============================================================
            function afficherPsaume(num, motRecherche = null) {
                const ps = psaumes.find(p => p.num === num);
                if (!ps) {
                    psalmDisplay.innerHTML =
                        '<p style="text-align:center;color:#c00;">Psaume non trouvé. Veuillez entrer un numéro entre 1 et 150.</p>';
                    psalmDisplay.classList.remove('empty');
                    return;
                }

                let texteFormate = ps.texte;
                if (motRecherche) {
                    const regex = new RegExp(`(${echapperRegex(motRecherche)})`, 'gi');
                    texteFormate = texteFormate.replace(regex,
                        '<mark class="highlight-word">$1</mark>');
                }

                const lignes = texteFormate.split('\n');
                const lignesHtml = lignes.map(ligne => {
                    const match = ligne.match(/^(\d+)\s/);
                    if (match) {
                        const numVers = match[1];
                        const reste = ligne.substring(match[0].length);
                        return `<span class="verse"><sup class="verse-num">${numVers}</sup> ${reste}</span>`;
                    }
                    return `<span class="verse">${ligne}</span>`;
                });

                const titreHtml = ps.titre ? `<p class="psalm-subtitle">${ps.titre}</p>` : '';

                psalmDisplay.innerHTML = `
                    <div class="psalm-header">
                        <h2 class="psalm-num">Psaume ${ps.num}</h2>
                        ${titreHtml}
                    </div>
                    <div class="psalm-text">
                        <p>${lignesHtml.join('</p><p>')}</p>
                    </div>
                `;
                psalmDisplay.classList.remove('empty');

                inputNum.value = num;
                selectPsaume.value = num;
                psalmDisplay.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function echapperRegex(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            // ============================================================
            // RECHERCHE PLEIN TEXTE (version paginée)
            // ============================================================
            function rechercherMot(mot) {
                if (!mot || mot.trim().length < 2) {
                    searchResults.innerHTML =
                        '<p class="no-results">Veuillez entrer au moins 2 caractères pour la recherche.</p>';
                    return;
                }

                const motClean = mot.trim();
                dernierMotRecherche = motClean;
                const regex = new RegExp(echapperRegex(motClean), 'gi');
                const resultats = [];

                psaumes.forEach(ps => {
                    const lignes = ps.texte.split('\n');
                    lignes.forEach(ligne => {
                        const match = ligne.match(regex);
                        if (match) {
                            let extrait = ligne.replace(/^\d+\s/, '');
                            if (extrait.length > 150) {
                                const idx = extrait.search(regex);
                                const start = Math.max(0, idx - 60);
                                const end = Math.min(extrait.length, idx + 90);
                                extrait = (start > 0 ? '...' : '') + extrait.substring(start, end) + (end < extrait
                                    .length ? '...' : '');
                            }
                            extrait = extrait.replace(regex, '<mark>$&</mark>');
                            const numVers = ligne.match(/^(\d+)/);
                            const refVers = numVers ? `v. ${numVers[1]}` : '';
                            resultats.push({
                                num: ps.num,
                                vers: refVers,
                                extrait: extrait,
                                premierVers: ps.premierVers
                            });
                        }
                    });
                });

                // Déduplication
                const seen = new Set();
                rechercheResultats = resultats.filter(r => {
                    const key = `${r.num}-${r.vers}`;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });

                recherchePage = 1;
                afficherPageResultats(1);
            }

            // Affiche la page de résultats demandée
            function afficherPageResultats(page) {
                const total = rechercheResultats.length;
                if (total === 0) {
                    searchResults.innerHTML =
                        `<p class="no-results">Aucun résultat trouvé pour « <strong>${dernierMotRecherche}</strong> ».</p>`;
                    return;
                }

                const totalPages = Math.ceil(total / RESULTATS_PAR_PAGE);
                // Contrôle de validité de la page
                if (page < 1) page = 1;
                if (page > totalPages) page = totalPages;
                recherchePage = page;

                const debut = (page - 1) * RESULTATS_PAR_PAGE;
                const fin = Math.min(debut + RESULTATS_PAR_PAGE, total);
                const pageItems = rechercheResultats.slice(debut, fin);

                const countHtml =
                    `<p class="result-count">${total} résultat(s) pour « <strong>${dernierMotRecherche}</strong> » — page ${page}/${totalPages}</p>`;
                const itemsHtml = pageItems.map(r => `
                    <div class="result-item" data-psalm="${r.num}" data-mot="${dernierMotRecherche}">
                        <span class="ref">Ps. ${r.num}${r.vers ? ', ' + r.vers : ''}</span>
                        <span class="extrait">${r.extrait}</span>
                    </div>
                `).join('');

                // Contrôles de pagination
                let paginationHtml = '';
                if (totalPages > 1) {
                    paginationHtml = `<div class="pagination">`;
                    if (page > 1) {
                        paginationHtml +=
                            `<button class="btn-page" data-page="${page - 1}">← Précédent</button>`;
                    }
                    paginationHtml += `<span class="page-indicator">${page} / ${totalPages}</span>`;
                    if (page < totalPages) {
                        paginationHtml +=
                            `<button class="btn-page" data-page="${page + 1}">Suivant →</button>`;
                    }
                    paginationHtml += `</div>`;
                }

                searchResults.innerHTML = countHtml + itemsHtml + paginationHtml;

                // Écouteurs sur les résultats et les boutons de pagination
                document.querySelectorAll('.result-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const num = parseInt(this.dataset.psalm);
                        const mot = this.dataset.mot;
                        afficherPsaume(num, mot);
                        psalmDisplay.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                });

                document.querySelectorAll('.btn-page').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const nouvellePage = parseInt(this.dataset.page);
                        afficherPageResultats(nouvellePage);
                    });
                });
            }

            // ============================================================
            // ÉCOUTEURS D'ÉVÉNEMENTS
            // ============================================================
            btnGoNum.addEventListener('click', () => {
                const num = parseInt(inputNum.value);
                if (num >= 1 && num <= 150) {
                    afficherPsaume(num);
                } else {
                    alert('Veuillez entrer un numéro entre 1 et 150.');
                }
            });

            inputNum.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    btnGoNum.click();
                }
            });

            selectPsaume.addEventListener('change', () => {
                const num = parseInt(selectPsaume.value);
                if (num >= 1 && num <= 150) {
                    afficherPsaume(num);
                }
            });

            btnSearch.addEventListener('click', () => {
                rechercherMot(searchInput.value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    rechercherMot(searchInput.value);
                }
            });

            // ============================================================
            // INITIALISATION
            // ============================================================
            function init() {
                initSelect();
                afficherPsaume(1);
            }

            init();
        })();
    </script>
</body>
</html>
