<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Psaumes de David</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --text: #2c2416;
            --card-bg: #fffdf7;
            --border: #d4c5a9;
            --accent: #8b6914;
            --accent-hover: #6b4f0e;
            --highlight: #fef3c7;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            --radius: 10px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', 'Palatino Linotype', serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.7;
            background-image: linear-gradient(to bottom, #f5f0e8 0%, #ede4d3 100%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* En-tête */
        header {
            text-align: center;
            padding: 36px 20px 28px;
            position: relative;
        }
        header h1 {
            font-size: 2.2em;
            color: #5c3d0e;
            letter-spacing: 0.03em;
            font-weight: normal;
            font-variant: small-caps;
            margin-bottom: 4px;
        }
        header .subtitle {
            font-size: 0.95em;
            color: #8b7355;
            font-style: italic;
        }
        header::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: var(--accent);
            margin: 16px auto 0;
            opacity: 0.5;
        }

        /* Panneau de contrôle */
        .controls {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 180px;
        }
        .control-group label {
            font-size: 0.85em;
            font-weight: bold;
            color: #5c3d0e;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .control-group input,
        .control-group select {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1em;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fffef9;
            color: var(--text);
            transition: var(--transition);
            width: 100%;
        }
        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 105, 20, 0.1);
        }
        .btn {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1em;
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
            letter-spacing: 0.03em;
            white-space: nowrap;
            min-height: 44px;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 105, 20, 0.3);
        }
        .btn-search {
            background: #5c3d0e;
            color: #fff;
        }
        .btn-search:hover {
            background: #3e2808;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(92, 61, 14, 0.3);
        }
        .btn-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex: 0 0 auto;
        }

        /* Zone de recherche */
        .search-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .search-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .search-row .control-group {
            flex: 2;
            min-width: 220px;
        }
        .search-results {
            margin-top: 16px;
            max-height: 500px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }
        .search-results .result-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            margin-bottom: 2px;
            font-size: 0.9em;
        }
        .search-results .result-item:hover {
            background: var(--highlight);
            border-left-color: var(--accent);
        }
        .result-item .ref {
            font-weight: bold;
            color: var(--accent);
            margin-right: 6px;
        }
        .result-item .extrait {
            color: #4a3f2f;
        }
        .result-item .extrait mark {
            background: #fde68a;
            padding: 1px 3px;
            border-radius: 2px;
        }
        .no-results {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 16px;
        }
        .result-count {
            font-size: 0.8em;
            color: #8b7355;
            margin-bottom: 8px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .btn-page {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: var(--transition);
        }
        .btn-page:hover {
            background: var(--highlight);
            border-color: var(--accent);
        }
        .page-indicator {
            font-weight: bold;
            color: var(--text);
        }

        /* Zone d'affichage du psaume */
        .psalm-display {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 36px;
            box-shadow: var(--shadow);
            min-height: 300px;
            position: relative;
        }
        .psalm-display.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bfae8e;
            font-style: italic;
            font-size: 1.1em;
        }
        .psalm-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px dotted var(--border);
        }
        .psalm-header .psalm-num {
            font-size: 1.6em;
            color: #5c3d0e;
            font-variant: small-caps;
            letter-spacing: 0.05em;
        }
        .psalm-header .psalm-subtitle {
            font-size: 0.85em;
            color: #8b7355;
            font-style: italic;
            margin-top: 2px;
        }
        .psalm-text {
            font-size: 1.05em;
            line-height: 2;
            text-align: justify;
        }
        .psalm-text .verse {
            display: inline;
        }
        .psalm-text .verse-num {
            font-size: 0.7em;
            color: #b0976a;
            vertical-align: super;
            margin-right: 2px;
            font-weight: bold;
        }
        .psalm-text p {
            margin-bottom: 10px;
            text-indent: 0;
        }
        .highlight-word {
            background: #fde68a;
            padding: 1px 4px;
            border-radius: 3px;
            transition: background 0.3s;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                gap: 14px;
                padding: 18px 16px;
            }
            .control-group {
                min-width: 100%;
            }
            .btn-row {
                width: 100%;
                justify-content: stretch;
            }
            .btn-row .btn {
                flex: 1;
            }
            .psalm-display {
                padding: 20px 16px;
            }
            .psalm-text {
                font-size: 0.95em;
                line-height: 1.8;
            }
            header h1 {
                font-size: 1.6em;
            }
            .search-row {
                flex-direction: column;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c5a9;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b0976a;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Les Psaumes de David</h1>
            <p class="subtitle">Traduction Louis Segond 1910</p>
        </header>

        <!-- Contrôles -->
        <div class="controls">
            <div class="control-group">
                <label for="psalmNum">📖 Psaume n°</label>
                <input type="number" id="psalmNum" placeholder="1-150" min="1" max="150" value="1">
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="btnGoNum" title="Afficher le psaume par son numéro">Afficher</button>
            </div>
            <div class="control-group">
                <label for="psalmSelect">📜 Choisir par le premier vers</label>
                <select id="psalmSelect">
                    <option value="">— Sélectionnez un psaume —</option>
                </select>
            </div>
        </div>

        <!-- Recherche -->
        <div class="search-section">
            <div class="search-row">
                <div class="control-group">
                    <label for="searchInput">🔍 Rechercher un mot dans tous les psaumes</label>
                    <input type="text" id="searchInput" placeholder="Ex: miséricorde, Éternel, cœur...">
                </div>
                <div class="btn-row">
                    <button class="btn btn-search" id="btnSearch">Rechercher</button>
                </div>
            </div>
            <div class="search-results" id="searchResults">
                <p class="no-results">Les résultats de recherche apparaîtront ici.</p>
            </div>
        </div>

        <!-- Affichage du psaume -->
        <div class="psalm-display empty" id="psalmDisplay">
            <p>Sélectionnez un psaume pour l'afficher ici.</p>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // BASE DE DONNÉES DES 150 PSAUMES (Louis Segond 1910)
            // Chaque psaume : { num, titre, premierVers, texte }
            // "premierVers" = premier vers significatif (hors attribution)
            // ============================================================
            const psaumes = [{
                num: 1,
                titre: "",
                premierVers: "Heureux l'homme qui ne marche pas selon le conseil des méchants, qui ne s'arrête pas sur la voie des pécheurs, et qui ne s'assied pas en compagnie des moqueurs,",
                texte: "1 Heureux l'homme qui ne marche pas selon le conseil des méchants, Qui ne s'arrête pas sur la voie des pécheurs, Et qui ne s'assied pas en compagnie des moqueurs,\n2 Mais qui trouve son plaisir dans la loi de l'Éternel, Et qui la médite jour et nuit !\n3 Il est comme un arbre planté près d'un courant d'eau, Qui donne son fruit en sa saison, Et dont le feuillage ne se flétrit point : Tout ce qu'il fait lui réussit.\n4 Il n'en est pas ainsi des méchants : Ils sont comme la paille que le vent dissipe.\n5 C'est pourquoi les méchants ne résistent point au jour du jugement, Ni les pécheurs dans l'assemblée des justes ;\n6 Car l'Éternel connaît la voie des justes, Et la voie des pécheurs mène à la ruine."
            }, {
                num: 2,
                titre: "",
                premierVers: "Pourquoi ce tumulte parmi les nations, ces vaines pensées parmi les peuples ?",
                texte: "1 Pourquoi ce tumulte parmi les nations, Ces vaines pensées parmi les peuples ?\n2 Pourquoi les rois de la terre se soulèvent-ils Et les princes se liguent-ils avec eux Contre l'Éternel et contre son oint ?\n3 Brisons leurs liens, Délivrons-nous de leurs chaînes !\n4 Celui qui siège dans les cieux rit, Le Seigneur se moque d'eux.\n5 Puis il leur parle dans sa colère, Il les épouvante dans sa fureur :\n6 C'est moi qui ai oint mon roi Sur Sion, ma montagne sainte !\n7 Je publierai le décret ; L'Éternel m'a dit : Tu es mon fils ! Je t'ai engendré aujourd'hui.\n8 Demande-moi et je te donnerai les nations pour héritage, Les extrémités de la terre pour possession ;\n9 Tu les briseras avec une verge de fer, Tu les briseras comme le vase d'un potier.\n10 Et maintenant, rois, conduisez-vous avec sagesse ! Juges de la terre, recevez instruction !\n11 Servez l'Éternel avec crainte, Et réjouissez-vous avec tremblement.\n12 Baisez le fils, de peur qu'il ne s'irrite, Et que vous ne périssiez dans votre voie, Car sa colère est prompte à s'enflammer. Heureux tous ceux qui se confient en lui !"
            }, {
                num: 3,
                titre: "Psaume de David. Lorsqu'il fuyait devant Absalom, son fils.",
                premierVers: "Éternel, que mes ennemis sont nombreux ! Quelle multitude se lève contre moi !",
                texte: "1 Éternel, que mes ennemis sont nombreux ! Quelle multitude se lève contre moi !\n2 Combien qui disent à mon sujet : Plus de salut pour lui auprès de Dieu !\n3 Mais toi, Éternel, tu es mon bouclier, Tu es ma gloire, et tu relèves ma tête.\n4 De ma voix je crie à l'Éternel, Et il me répond de sa montagne sainte.\n5 Je me couche, et je m'endors ; Je me réveille, car l'Éternel est mon soutien.\n6 Je ne crains pas les myriades de peuples Qui m'assiègent de toutes parts.\n7 Lève-toi, Éternel ! Sauve-moi, mon Dieu ! Car tu frappes à la joue tous mes ennemis, Tu brises les dents des méchants.\n8 Le salut est auprès de l'Éternel : Que ta bénédiction soit sur ton peuple !"
            }, {
                num: 4,
                titre: "Au chef des chantres. Avec instruments à cordes. Psaume de David.",
                premierVers: "Quand je crie, réponds-moi, Dieu de ma justice ! Quand je suis dans la détresse, sauve-moi ! Aie pitié de moi, écoute ma prière !",
                texte: "1 Quand je crie, réponds-moi, Dieu de ma justice ! Quand je suis dans la détresse, sauve-moi ! Aie pitié de moi, écoute ma prière !\n2 Fils des hommes, jusques à quand ma gloire sera-t-elle outragée ? Jusques à quand aimerez-vous la vanité, Chercherez-vous le mensonge ?\n3 Sachez que l'Éternel s'est choisi un homme pieux ; L'Éternel entend quand je crie à lui.\n4 Tremblez, et ne péchez point ; Parlez en vos cœurs sur votre couche, puis taisez-vous.\n5 Offrez des sacrifices de justice, Et confiez-vous à l'Éternel.\n6 Plusieurs disent : Qui nous fera voir le bonheur ? Fais lever sur nous la lumière de ta face, ô Éternel !\n7 Tu mets dans mon cœur plus de joie Qu'ils n'en ont quand abondent leur blé et leur vin.\n8 Je me couche et je m'endors en paix, Car toi seul, ô Éternel, tu me donnes la sécurité dans ma demeure."
            }, {
                num: 5,
                titre: "Au chef des chantres. Avec les flûtes. Psaume de David.",
                premierVers: "Prête l'oreille à mes paroles, ô Éternel ! Écoute mes gémissements !",
                texte: "1 Prête l'oreille à mes paroles, ô Éternel ! Écoute mes gémissements !\n2 Sois attentif à mes cris, mon roi et mon Dieu ! C'est à toi que j'adresse ma prière.\n3 Éternel, le matin tu entends ma voix ; Le matin je me tourne vers toi, et j'attends.\n4 Car tu n'es point un Dieu qui prenne plaisir au mal ; Le méchant n'a pas sa demeure auprès de toi.\n5 Les insensés ne subsistent pas devant tes yeux ; Tu hais tous ceux qui commettent l'iniquité.\n6 Tu fais périr les menteurs ; L'Éternel abhorre l'homme de sang et de fraude.\n7 Mais moi, par ta grande miséricorde, je vais à ta maison, Je me prosterne dans ton saint temple avec crainte.\n8 Éternel, conduis-moi dans ta justice, à cause de mes ennemis, Aplanis ta voie sous mes pas.\n9 Car il n'y a point de sincérité dans leur bouche ; Leur cœur est rempli de malice, Leur gosier est un sépulcre ouvert, Et ils ont sur la langue des paroles flatteuses.\n10 Frappe-les comme des coupables, ô Dieu ! Que leurs desseins amènent leur chute ! Précipite-les au milieu de leurs péchés sans nombre ! Car ils se révoltent contre toi.\n11 Alors tous ceux qui se confient en toi se réjouiront, Ils auront de l'allégresse à toujours, et tu les protégeras ; Tu seras un sujet de joie Pour ceux qui aiment ton nom.\n12 Car tu bénis le juste, ô Éternel ! Tu l'entoures de ta grâce comme d'un bouclier."
            }, {
                num: 6,
                titre: "Au chef des chantres. Avec instruments à cordes. Sur la harpe à huit cordes. Psaume de David.",
                premierVers: "Éternel, ne me punis pas dans ta colère, et ne me châtie pas dans ta fureur.",
                texte: "1 Éternel, ne me punis pas dans ta colère, Et ne me châtie pas dans ta fureur.\n2 Aie pitié de moi, Éternel, car je suis sans force ; Guéris-moi, Éternel, car mes os sont tremblants.\n3 Mon âme est toute troublée ; Et toi, Éternel, jusques à quand ?\n4 Reviens, Éternel, délivre mon âme ; Sauve-moi, à cause de ta miséricorde.\n5 Car on ne se souvient point de toi dans la mort ; Qui te célébrera dans le séjour des morts ?\n6 Je m'épuise à force de gémir ; Chaque nuit ma couche est baignée de mes larmes, Mon lit est trempé de mes pleurs.\n7 J'ai le visage usé par le chagrin ; Il vieillit à cause de tous mes adversaires.\n8 Éloignez-vous de moi, vous tous qui faites le mal ! Car l'Éternel entend la voix de mes larmes.\n9 L'Éternel entend mes supplications, L'Éternel accueille ma prière.\n10 Tous mes ennemis sont confondus, saisis d'épouvante ; Ils reculent, soudain confondus."
            }, {
                num: 7,
                titre: "Complainte de David. Chantée à l'Éternel, au sujet de Cusch, Benjamite.",
                premierVers: "Éternel, mon Dieu, je cherche en toi mon refuge ; sauve-moi de tous mes persécuteurs, et délivre-moi,",
                texte: "1 Éternel, mon Dieu, je cherche en toi mon refuge ; Sauve-moi de tous mes persécuteurs, et délivre-moi,\n2 Afin qu'il ne me déchire pas, comme un lion, Et ne me mette en pièces, sans que personne me secoure.\n3 Éternel, mon Dieu, si j'ai fait cela, S'il y a de l'iniquité dans mes mains,\n4 Si j'ai rendu le mal à celui qui était en paix avec moi, Si j'ai dépouillé celui qui m'opprimait sans cause,\n5 Que l'ennemi me poursuive et m'atteigne, Qu'il foule à terre ma vie, Et qu'il couche ma gloire dans la poussière !\n6 Lève-toi, ô Éternel, dans ta colère, Élève-toi contre la fureur de mes adversaires, Réveille-toi pour me secourir, ordonne un jugement !\n7 Que l'assemblée des nations t'environne ! Monte au-dessus d'elle vers les lieux élevés !\n8 L'Éternel juge les peuples : Rends-moi justice, ô Éternel, Selon mon droit et selon mon innocence !\n9 Mets un terme à la malice des méchants, Et affermis le juste, Toi qui sondes les cœurs et les reins, Dieu juste !\n10 Mon bouclier est en Dieu, Qui sauve ceux dont le cœur est droit.\n11 Dieu est un juste juge, Un Dieu qui s'irrite en tout temps.\n12 Si le méchant ne se convertit pas, il aiguise son glaive, Il bande son arc, et il vise ;\n13 Il dirige sur lui des traits meurtriers, Il rend ses flèches brûlantes.\n14 Voici, le méchant prépare le mal, Il conçoit l'iniquité, et il enfante le mensonge.\n15 Il ouvre une fosse, il la creuse, Et il tombe dans la fosse qu'il a faite.\n16 Son iniquité retombe sur sa tête, Et sa violence redescend sur son front.\n17 Je louerai l'Éternel pour sa justice, Je chanterai le nom de l'Éternel, du Très-Haut."
            }, {
                num: 8,
                titre: "Au chef des chantres. Sur la guitthith. Psaume de David.",
                premierVers: "Éternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre ! Ta majesté s'élève au-dessus des cieux.",
                texte: "1 Éternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre ! Ta majesté s'élève au-dessus des cieux.\n2 Par la bouche des enfants et de ceux qui sont à la mamelle Tu as fondé ta gloire, pour confondre tes adversaires, Pour imposer silence à l'ennemi et au vindicatif.\n3 Quand je contemple les cieux, ouvrage de tes mains, La lune et les étoiles que tu as créées :\n4 Qu'est-ce que l'homme, pour que tu te souviennes de lui ? Et le fils de l'homme, pour que tu prennes soin de lui ?\n5 Tu l'as fait de peu inférieur à Dieu, Et tu l'as couronné de gloire et de magnificence.\n6 Tu lui as donné la domination sur les œuvres de tes mains, Tu as tout mis sous ses pieds,\n7 Les brebis comme les bœufs, Et les animaux des champs,\n8 Les oiseaux du ciel et les poissons de la mer, Tout ce qui parcourt les sentiers des mers.\n9 Éternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre !"
            }, {
                num: 9,
                titre: "Au chef des chantres. Sur « Meurs pour le fils ». Psaume de David.",
                premierVers: "Je louerai l'Éternel de tout mon cœur, je raconterai toutes tes merveilles.",

ins ;\n21 Car j'ai observé les voies de l'Éternel, Et je n'ai point été coupable envers mon Dieu.\n22 Toutes ses ordonnances ont été devant moi, Et je ne me suis point écarté de ses lois.\n23 J'ai été sans reproche envers lui, Et je me suis tenu en garde contre mon iniquité.\n24 Aussi l'Éternel m'a-t-il rendu selon ma justice, Selon la pureté de mes mains devant ses yeux.\n25 Avec celui qui est bon tu te montres bon, Avec l'homme droit tu agis selon la droiture,\n26 Avec celui qui est pur tu te montres pur, Et avec le pervers tu agis selon sa perversité.\n27 Tu sauves le peuple qui s'humilie, Et tu abaisses les regards hautains.\n28 Oui, tu fais briller ma lumière ; L'Éternel, mon Dieu, éclaire mes ténèbres.\n29 Avec toi je me précipite sur une troupe en armes, Avec mon Dieu je franchis une muraille.\n30 Les voies de Dieu sont parfaites, La parole de l'Éternel est éprouvée ; Il est un bouclier pour tous ceux qui se confient en lui.\n31 Car qui est Dieu, si ce n'est l'Éternel ? Et qui est un rocher, si ce n'est notre Dieu ?\n32 C'est Dieu qui me ceint de force, Et qui me conduit dans la voie droite.\n33 Il rend mes pieds semblables à ceux des biches, Et il me place sur mes lieux élevés.\n34 Il exerce mes mains au combat, Et mes bras tendent l'arc d'airain.\n35 Tu me donnes le bouclier de ton salut, Ta droite me soutient, Et ta bonté me fait devenir grand.\n36 Tu élargis le chemin sous mes pas, Et mes pieds ne chancellent point.\n37 Je poursuis mes ennemis, je les atteins, Et je ne reviens pas avant de les avoir anéantis.\n38 Je les brise, et ils ne peuvent se relever ; Ils tombent sous mes pieds.\n39 Tu me ceins de force pour le combat, Tu fais plier sous moi mes adversaires.\n40 Tu fais tourner le dos à mes ennemis devant moi, Et j'extermine ceux qui me haïssent.\n41 Ils crient, et personne pour les sauver ! Ils crient à l'Éternel, et il ne leur répond pas !\n42 Je les broie comme la poussière qu'emporte le vent, Je les foule comme la boue des rues.\n43 Tu me délivres des dissensions du peuple ; Tu me mets à la tête des nations ; Un peuple que je ne connaissais pas m'est asservi.\n44 Dès qu'ils ont entendu, ils m'ont obéi ; Les fils de l'étranger me flattent ;\n45 Les fils de l'étranger sont en défaillance, Ils tremblent hors de leurs forteresses.\n46 Vive l'Éternel, et béni soit mon rocher ! Que le Dieu de mon salut soit exalté !\n47 Dieu est mon vengeur, Il m'assujettit les peuples,\n48 Il me délivre de mes ennemis ! Oui, tu m'élèves au-dessus de mes adversaires, Tu me sauves de l'homme violent.\n49 C'est pourquoi je te louerai parmi les nations, ô Éternel ! Et je chanterai à la gloire de ton nom.\n50 Il accorde de grandes délivrances à son roi, Et il fait miséricorde à son oint, À David, et à sa postérité, pour toujours."

                texte: "1 Je bénirai l'Éternel en tout temps ; Sa louange sera toujours dans ma bouche.\n2 Que mon âme se glorifie en l'Éternel ! Que les malheureux écoutent et se réjouissent !\n3 Exaltez avec moi l'Éternel ! Célébrons tous son nom !\n4 J'ai cherché l'Éternel, et il m'a répondu ; Il m'a délivré de toutes mes frayeurs.\n5 Quand on tourne vers lui les regards, on est rayonnant de joie, Et le visage ne se couvre pas de honte.\n6 Quand un malheureux crie, l'Éternel entend, Et il le sauve de toutes ses détresses.\n7 L'ange de l'Éternel campe autour de ceux qui le craignent, Et il les arrache au danger.\n8 Sentez et voyez combien l'Éternel est bon ! Heureux l'homme qui cherche en lui son refuge !\n9 Craignez l'Éternel, vous ses saints ! Car rien ne manque à ceux qui le craignent.\n10 Les lionceaux éprouvent la disette et la faim, Mais ceux qui cherchent l'Éternel ne sont privés d'aucun bien.\n11 Venez, mes fils, écoutez-moi ! Je vous enseignerai la crainte de l'Éternel.\n12 Quel est l'homme qui aime la vie, Qui désire voir des jours heureux ?\n13 Préserve ta langue du mal, Et tes lèvres des paroles trompeuses ;\n14 Éloigne-toi du mal, et fais le bien ; Recherche et poursuis la paix.\n15 Les yeux de l'Éternel sont sur les justes, Et ses oreilles sont attentives à leurs cris.\n16 L'Éternel tourne sa face contre les méchants, Pour retrancher de la terre leur souvenir.\n17 Quand les justes crient, l'Éternel entend, Et il les délivre de toutes leurs détresses ;\n18 L'Éternel est près de ceux qui ont le cœur brisé, Et il sauve ceux qui ont l'esprit abattu.\n19 Le juste a beaucoup de malheurs, Mais l'Éternel l'en délivre toujours ;\n20 Il garde tous ses os, Aucun d'eux n'est brisé.\n21 Le malheur tue le méchant, Et les ennemis du juste sont châtiés.\n22 L'Éternel délivre l'âme de ses serviteurs, Et tous ceux qui prennent en lui leur refuge ne sont point châtiés."
            }, {
                num: 35,
                titre: "De David.",
                premierVers: "Éternel, défends-moi contre mes adversaires, combats ceux qui me combattent !",
                texte: "1 Éternel, défends-moi contre mes adversaires, Combats ceux qui me combattent !\n2 Saisis le petit et le grand bouclier, Et lève-toi pour me secourir !\n3 Brandis la lance et le javelot contre mes persécuteurs ! Dis à mon âme : Je suis ton salut !\n4 Qu'ils soient honteux et confus, ceux qui en veulent à ma vie ! Qu'ils reculent et rougissent, ceux qui méditent ma perte !\n5 Qu'ils soient comme la paille emportée par le vent, Et que l'ange de l'Éternel les chasse !\n6 Que leur route soit ténébreuse et glissante, Et que l'ange de l'Éternel les poursuive !\n7 Car sans cause ils m'ont tendu leur filet sur une fosse, Sans cause ils l'ont creusée pour m'ôter la vie.\n8 Que la ruine les atteigne à l'improviste, Qu'ils soient pris dans le filet qu'ils ont tendu, Qu'ils y tombent et périssent !\n9 Et mon âme aura de la joie en l'Éternel, De l'allégresse en son salut.\n10 Tous mes os diront : Éternel, qui peut, comme toi, Délivrer le malheureux d'un plus fort que lui, Le malheureux et le pauvre de celui qui le dépouille ?\n11 De faux témoins se lèvent : Ils m'interrogent sur ce que j'ignore.\n12 Ils me rendent le mal pour le bien : Mon âme est dans l'abandon.\n13 Et moi, quand ils étaient malades, je revêtais un sac, J'humiliais mon âme par le jeûne, Je priais, la tête penchée sur mon sein.\n14 Comme pour un ami, pour un frère, je me traînais lentement ; Comme pour le deuil d'une mère, je me courbais avec tristesse.\n15 Puis, quand je chancelle, ils se réjouissent et s'assemblent, Ils s'assemblent à mon insu pour m'outrager, Ils me déchirent sans relâche ;\n16 Avec les impies, les moqueurs, Ils grincent des dents contre moi.\n17 Seigneur, jusques à quand le verras-tu ? Protège mon âme contre leurs embûches, Ma vie contre les lionceaux !\n18 Je te louerai dans la grande assemblée, Je te célébrerai au milieu d'un peuple nombreux.\n19 Que ceux qui sont à tort mes ennemis ne se réjouissent pas à mon sujet, Que ceux qui me haïssent sans cause ne m'insultent pas du regard !\n20 Car ils tiennent des discours de paix, Et ils méditent la tromperie contre les gens paisibles du pays.\n21 Ils ouvrent contre moi leur bouche, Ils disent : Ah ! ah ! nos yeux regardent !\n22 Éternel, tu le vois ! ne reste pas en silence ! Seigneur, ne t'éloigne pas de moi !\n23 Réveille-toi, réveille-toi pour me faire justice ! Mon Dieu et mon Seigneur, défends ma cause !\n24 Juge-moi selon ta justice, Éternel, mon Dieu ! Et qu'ils ne se réjouissent pas à mon sujet !\n25 Qu'ils ne disent pas dans leur cœur : Ah ! voilà ce que nous voulions ! Qu'ils ne disent pas : Nous l'avons englouti !\n26 Que tous ensemble ils soient honteux et confus, Ceux qui se réjouissent de mon malheur ! Qu'ils revêtent l'ignominie et l'opprobre, Ceux qui s'élèvent contre moi !\n27 Qu'ils aient de l'allégresse et de la joie, Ceux qui prennent plaisir à mon innocence, Et que sans cesse ils disent : Exalté soit l'Éternel, Qui veut la paix de son serviteur !\n28 Et ma langue célébrera ta justice, Elle dira tous les jours ta louange."
            }, {
                num: 36,
                titre: "Au chef des chantres. Du serviteur de l'Éternel, de David.",
                premierVers: "La parole impie du méchant est au fond de mon cœur ; la crainte de Dieu n'est pas devant ses yeux.",
                texte: "1 La parole impie du méchant est au fond de mon cœur ; La crainte de Dieu n'est pas devant ses yeux.\n2 Car il se flatte à ses propres yeux, Pour consommer son iniquité, pour assouvir sa haine.\n3 Les paroles de sa bouche sont fausseté et tromperie ; Il renonce à agir sagement, à faire le bien.\n4 Il médite l'injustice sur sa couche, Il se tient sur une voie qui n'est pas bonne, Il ne repousse pas le mal.\n5 Éternel, ta bonté atteint jusqu'aux cieux, Ta fidélité jusqu'aux nues.\n6 Ta justice est comme les montagnes de Dieu, Tes jugements sont comme le grand abîme. Éternel, tu soutiens les hommes et les bêtes.\n7 Combien est précieuse ta bonté, ô Dieu ! À l'ombre de tes ailes les fils de l'homme cherchent un refuge.\n8 Ils se rassasient de l'abondance de ta maison, Et tu les abreuves au torrent de tes délices.\n9 Car auprès de toi est la source de la vie ; Par ta lumière nous voyons la lumière.\n10 Étends ta bonté sur ceux qui te connaissent, Et ta justice sur ceux dont le cœur est droit !\n11 Que le pied de l'orgueil ne m'atteigne pas, Et que la main des méchants ne me fasse pas fuir !\n12 Déjà tombent ceux qui commettent l'iniquité ; Ils sont renversés, et ils ne peuvent se relever."
            }, {

                texte: "1 Ne t'irrite pas contre les méchants, N'envie pas ceux qui font le mal.\n2 Car ils sont fauchés aussi vite que l'herbe, Et ils se flétrissent comme le gazon vert.\n3 Confie-toi en l'Éternel, et pratique le bien ; Aie le pays pour demeure et la fidélité pour pâture.\n4 Fais de l'Éternel tes délices, Et il te donnera ce que ton cœur désire.\n5 Recommande ton sort à l'Éternel, Mets en lui ta confiance, et il agira.\n6 Il fera paraître ta justice comme la lumière, Et ton droit comme le soleil à son midi.\n7 Garde le silence devant l'Éternel, et espère en lui ; Ne t'irrite pas contre celui qui réussit dans ses voies, Contre l'homme qui vient à bout de ses desseins.\n8 Laisse la colère, abandonne la fureur ; Ne t'irrite pas, ce serait mal faire.\n9 Car les méchants seront retranchés, Et ceux qui espèrent en l'Éternel posséderont le pays.\n10 Encore un peu de temps, et le méchant n'est plus ; Tu regardes le lieu où il était, et il a disparu.\n11 Les misérables possèdent le pays, Et ils jouissent abondamment de la paix.\n12 Le méchant forme des projets contre le juste, Et il grince des dents contre lui.\n13 Le Seigneur se rit de lui, Car il voit que son jour arrive.\n14 Les méchants tirent le glaive, Ils bandent leur arc, Pour faire tomber le misérable et l'indigent, Pour égorger ceux dont la voie est droite.\n15 Leur glaive entre dans leur propre cœur, Et leurs arcs se brisent.\n16 Mieux vaut le peu du juste Que l'abondance de beaucoup de méchants ;\n17 Car les bras des méchants seront brisés, Mais l'Éternel soutient les justes.\n18 L'Éternel connaît les jours des hommes intègres, Et leur héritage dure à jamais.\n19 Ils ne sont pas confondus au temps du malheur, Et ils sont rassasiés aux jours de la famine.\n20 Mais les méchants périssent, Et les ennemis de l'Éternel, comme les plus beaux pâturages ; Ils s'évanouissent, ils s'évanouissent en fumée.\n21 Le méchant emprunte, et il ne rend pas ; Le juste est compatissant, et il donne.\n22 Car ceux que bénit l'Éternel possèdent le pays, Et ceux qu'il maudit sont retranchés.\n23 L'Éternel affermit les pas de l'homme, Et il prend plaisir à sa voie ;\n24 S'il tombe, il n'est pas terrassé, Car l'Éternel lui prend la main.\n25 J'ai été jeune, j'ai vieilli ; Et je n'ai point vu le juste abandonné, Ni sa postérité mendiant son pain.\n26 Toujours il est compatissant, et il prête ; Et sa postérité est en bénédiction.\n27 Détourne-toi du mal, fais le bien, Et tu posséderas le pays à jamais.\n28 Car l'Éternel aime la justice, Et il n'abandonne pas ses fidèles ; Ils sont toujours sous sa garde, Mais la postérité des méchants est retranchée.\n29 Les justes posséderont le pays, Et ils y demeureront à jamais.\n30 La bouche du juste annonce la sagesse, Et sa langue proclame la justice.\n31 La loi de son Dieu est dans son cœur ; Ses pas ne chancellent point.\n32 Le méchant épie le juste, Et il cherche à le faire mourir.\n33 L'Éternel ne le laisse pas entre ses mains, Et il ne le condamne pas quand il est en jugement.\n34 Espère en l'Éternel, garde sa voie, Et il t'élèvera pour que tu possèdes le pays ; Tu verras les méchants retranchés.\n35 J'ai vu le méchant dans toute sa puissance ; Il s'étendait comme un arbre verdoyant.\n36 Il a passé, et voici, il n'est plus ; Je le cherche, et il ne se trouve plus.\n37 Observe celui qui est intègre, et regarde celui qui est droit ; Car il y a une postérité pour l'homme de paix.\n38 Mais les rebelles sont tous anéantis, La postérité des méchants est retranchée.\n39 Le salut des justes vient de l'Éternel ; Il est leur protecteur au temps de la détresse.\n40 L'Éternel les secourt et les délivre ; Il les délivre des méchants et les sauve, Parce qu'ils cherchent en lui leur refuge."
            }, {
                num: 38,
                titre: "Psaume de David. Pour souvenir.",
                premierVers: "Éternel, ne me punis pas dans ta colère, et ne me châtie pas dans ta fureur.",
                texte: "1 Éternel, ne me punis pas dans ta colère, Et ne me châtie pas dans ta fureur.\n2 Car tes flèches m'ont atteint, Et ta main s'est appesantie sur moi.\n3 Il n'y a rien de sain dans ma chair à cause de ta colère, Il n'y a plus de vigueur dans mes os à cause de mon péché.\n4 Car mes iniquités s'élèvent au-dessus de ma tête ; Comme un lourd fardeau, elles sont trop pesantes pour moi.\n5 Mes plaies sont infectes et purulentes, À cause de ma folie.\n6 Je suis courbé, abattu au dernier point ; Tout le jour je marche dans la tristesse.\n7 Car un mal brûlant dévore mes reins, Et il n'y a rien de sain dans ma chair.\n8 Je suis sans force, entièrement brisé ; Le trouble de mon cœur m'arrache des gémissements.\n9 Seigneur, tous mes désirs sont devant toi, Et mes soupirs ne te sont point cachés.\n10 Mon cœur est agité, ma force m'abandonne, Et la lumière de mes yeux n'est plus avec moi.\n11 Mes amis et mes compagnons s'éloignent de ma plaie, Et mes proches se tiennent à l'écart.\n12 Ceux qui en veulent à ma vie tendent leurs pièges ; Ceux qui cherchent mon malheur disent des méchancetés, Et méditent toute la journée des tromperies.\n13 Et moi, je suis comme un sourd, je n'entends pas ; Je suis comme un muet, qui n'ouvre pas la bouche.\n14 Je suis comme un homme qui n'entend pas, Et dans la bouche duquel il n'y a point de réplique.\n15 Éternel, c'est en toi que j'espère ; Tu répondras, Seigneur, mon Dieu !\n16 Car je dis : Ne permets pas qu'ils se réjouissent à mon sujet ! S'ils s'élèvent contre moi, que mon pied ne chancelle pas !\n17 Car je suis près de tomber, Et ma douleur est toujours devant moi.\n18 Car je reconnais mon iniquité, Je suis dans la crainte à cause de mon péché.\n19 Cependant mes ennemis sont pleins de vie, pleins de force ; Ceux qui me haïssent sans cause sont nombreux.\n20 Ils me rendent le mal pour le bien ; Ils sont mes adversaires, parce que je recherche le bien.\n21 Ne m'abandonne pas, Éternel ! Mon Dieu, ne t'éloigne pas de moi !\n22 Viens en hâte à mon secours, Seigneur, mon salut !"

                texte: "1 Je disais : Je veillerai sur mes voies, De peur de pécher par ma langue ; Je mettrai un frein à ma bouche, Tant que le méchant sera devant moi.\n2 Je suis resté muet, dans le silence ; Je me suis tu, quoique malheureux, Et ma douleur n'était pas moins vive.\n3 Mon cœur brûlait au-dedans de moi, Un feu intérieur me consumait, Et la parole est venue sur ma langue.\n4 Éternel, fais-moi connaître ma fin, Quelle est la mesure de mes jours ; Que je sache combien je suis fragile.\n5 Voici, tu as donné à mes jours la largeur de la main, Et ma durée est comme un rien devant toi. Oui, tout homme debout n'est qu'un souffle.\n6 Oui, l'homme se promène comme une ombre, Il s'agite vainement ; Il amasse, et il ne sait qui recueillera.\n7 Maintenant, Seigneur, que puis-je espérer ? Mon espérance est en toi.\n8 Délivre-moi de toutes mes transgressions ! Ne me rends pas l'opprobre de l'insensé !\n9 Je reste muet, je n'ouvre pas la bouche, Car c'est toi qui agis.\n10 Détourne de moi tes coups ! Je succombe sous la puissance de ta main.\n11 Tu châties l'homme en le punissant de son iniquité, Tu consumes comme la teigne ce qu'il a de plus cher. Oui, tout homme est un souffle.\n12 Écoute ma prière, Éternel, et prête l'oreille à mes cris ! Ne sois pas insensible à mes larmes ! Car je suis un étranger chez toi, Un habitant, comme tous mes pères.\n13 Détourne de moi le regard, et laisse-moi respirer, Avant que je m'en aille et que je ne sois plus !"
            }, {
                num: 40,
                titre: "Au chef des chantres. De David. Psaume.",
                premierVers: "J'avais mis en l'Éternel mon espérance ; et il s'est incliné vers moi, il a écouté mes cris.",
                texte: "1 J'avais mis en l'Éternel mon espérance ; Et il s'est incliné vers moi, il a écouté mes cris.\n2 Il m'a retiré de la fosse de destruction, Du fond de la boue ; Et il a dressé mes pieds sur le roc, Il a affermi mes pas.\n3 Il a mis dans ma bouche un cantique nouveau, Une louange à notre Dieu ; Beaucoup l'ont vu, et ont eu de la crainte, Et ils se sont confiés en l'Éternel.\n4 Heureux l'homme qui place en l'Éternel sa confiance, Et qui ne se tourne pas vers les hautains et les menteurs !\n5 Tu as multiplié, Éternel, mon Dieu, Tes merveilles et tes desseins en notre faveur ; Nul n'est comparable à toi ; Je voudrais les publier et les proclamer, Mais leur nombre est trop grand pour les raconter.\n6 Tu ne désires ni sacrifice ni offrande, Tu m'as ouvert les oreilles ; Tu ne demandes ni holocauste ni victime expiatoire.\n7 Alors je dis : Voici, je viens Avec le rouleau du livre écrit à mon sujet.\n8 Je prends plaisir à faire ta volonté, mon Dieu, Et ta loi est au fond de mon cœur.\n9 J'annonce la justice dans la grande assemblée ; Voici, je ne ferme pas mes lèvres, Éternel, tu le sais !\n10 Je ne cache pas ta justice dans mon cœur, Je publie ta vérité et ton salut ; Je ne dissimule pas ta bonté et ta fidélité Dans la grande assemblée.\n11 Toi, Éternel, tu ne me refuseras pas tes compassions ; Ta bonté et ta fidélité me garderont toujours.\n12 Car des maux sans nombre m'environnent ; Mes iniquités m'atteignent, et je ne puis en supporter la vue ; Elles sont plus nombreuses que les cheveux de ma tête, Et mon courage m'abandonne.\n13 Veuille me délivrer, ô Éternel ! Éternel, viens en hâte à mon secours !\n14 Que tous ensemble ils soient honteux et confus, Ceux qui en veulent à ma vie pour l'enlever ! Qu'ils reculent et rougissent, Ceux qui désirent ma perte !\n15 Qu'ils soient dans la stupeur par l'effet de leur honte, Ceux qui me disent : Ah ! ah !\n16 Que tous ceux qui te cherchent Soient dans l'allégresse et se réjouissent en toi ! Que ceux qui aiment ton salut Disent sans cesse : Exalté soit l'Éternel !\n17 Moi, je suis pauvre et indigent ; Mais le Seigneur pense à moi. Tu es mon aide et mon libérateur : Mon Dieu, ne tarde pas !"
            }, {
                num: 41,
                titre: "Au chef des chantres. Psaume de David.",
                premierVers: "Heureux celui qui s'intéresse au pauvre ! Au jour du malheur l'Éternel le délivre.",
                texte: "1 Heureux celui qui s'intéresse au pauvre ! Au jour du malheur l'Éternel le délivre.\n2 L'Éternel le garde et lui conserve la vie. Il est heureux sur la terre, Et tu ne le livres pas au bon plaisir de ses ennemis.\n3 L'Éternel le soutient sur son lit de douleur ; Tu le soulages dans toutes ses maladies.\n4 Je dis : Éternel, aie pitié de moi ! Guéris mon âme, car j'ai péché contre toi !\n5 Mes ennemis disent méchamment de moi : Quand mourra-t-il ? quand périra son nom ?\n6 Si quelqu'un vient me voir, il prend un langage faux, Il recueille des sujets de médire ; Il s'en va, et il parle au-dehors.\n7 Tous mes ennemis chuchotent ensemble contre moi, Ils pensent que mon mal me tuera :\n8 Il est dangereusement atteint, Le voilà couché, il ne se relèvera pas !\n9 Celui-là même avec qui j'étais en paix, En qui j'avais confiance, Et qui mangeait mon pain, lève le talon contre moi.\n10 Mais toi, Éternel, aie pitié de moi et relève-moi, Et je leur rendrai ce qui leur est dû.\n11 Je connaîtrai que tu m'aimes, Si mon ennemi ne triomphe pas contre moi.\n12 Tu m'as soutenu à cause de mon intégrité, Et tu m'as placé pour toujours en ta présence.\n13 Béni soit l'Éternel, le Dieu d'Israël, d'éternité en éternité ! Amen ! Amen !"
            }, {
                num: 42,
                titre: "Au chef des chantres. Cantique des fils de Koré.",
                premierVers: "Comme une biche soupire après des courants d'eau, ainsi mon âme soupire après toi, ô Dieu !",
                texte: "1 Comme une biche soupire après des courants d'eau, Ainsi mon âme soupire après toi, ô Dieu !\n2 Mon âme a soif de Dieu, du Dieu vivant : Quand irai-je et paraîtrai-je devant la face de Dieu ?\n3 Mes larmes sont ma nourriture jour et nuit, Pendant qu'on me dit sans cesse : Où est ton Dieu ?\n4 Je me rappelle avec effusion de cœur Quand je marchais entouré de la foule, Et que je m'avançais à sa tête vers la maison de Dieu, Au milieu des cris de joie et des actions de grâces D'une multitude en fête.\n5 Pourquoi t'abats-tu, mon âme, et gémis-tu au-dedans de moi ? Espère en Dieu, car je le louerai encore ; Il est mon salut et mon Dieu.\n6 Mon âme est abattue au-dedans de moi ; Aussi c'est à toi que je pense, depuis le pays du Jourdain, Depuis l'Hermon, depuis la montagne de Mitsear.\n7 L'abîme appelle un autre abîme au bruit de tes cascades ; Toutes tes vagues et tous tes flots passent sur moi.\n8 Le jour, l'Éternel m'accordait sa grâce ; La nuit, je chantais ses louanges, J'adressais une prière au Dieu de ma vie.\n9 Je dis à Dieu, mon rocher : Pourquoi m'oublies-tu ? Pourquoi dois-je marcher dans la tristesse, Sous l'oppression de l'ennemi ?\n10 Mes os se brisent quand mes persécuteurs m'outragent, En me disant sans cesse : Où est ton Dieu ?\n11 Pourquoi t'abats-tu, mon âme, et gémis-tu au-dedans de moi ? Espère en Dieu, car je le louerai encore ; Il est mon salut et mon Dieu."
