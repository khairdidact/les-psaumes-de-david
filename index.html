                texte: "1 Rends-moi justice, ô Dieu, défends ma cause contre une nation infidèle ! Délivre-moi des hommes de fraude et d'iniquité !\n2 Toi, mon Dieu protecteur, pourquoi me repousses-tu ? Pourquoi dois-je marcher dans la tristesse, Sous l'oppression de l'ennemi ?\n3 Envoie ta lumière et ta fidélité ; Qu'elles me guident, Qu'elles me conduisent à ta montagne sainte et à tes demeures !\n4 J'irai vers l'autel de Dieu, vers Dieu, ma joie et mon allégresse, Et je te célébrerai sur la harpe, ô Dieu, mon Dieu !\n5 Pourquoi t'abats-tu, mon âme, et gémis-tu au-dedans de moi ? Espère en Dieu, car je le louerai encore ; Il est mon salut et mon Dieu."
            }, {
                num: 44,
                titre: "Au chef des chantres. Des fils de Koré. Cantique.",
                premierVers: "Ô Dieu, nous avons entendu de nos oreilles, nos pères nous ont raconté les œuvres que tu as accomplies de leur temps, aux jours d'autrefois.",
                texte: "1 Ô Dieu, nous avons entendu de nos oreilles, Nos pères nous ont raconté Les œuvres que tu as accomplies de leur temps, Aux jours d'autrefois.\n2 De ta main tu as chassé des nations pour les établir, Tu as frappé des peuples pour les étendre.\n3 Car ce n'est point par leur épée qu'ils se sont emparés du pays, Ce n'est point leur bras qui les a sauvés ; Mais c'est ta droite, c'est ton bras, c'est la lumière de ta face, Parce que tu les aimais.\n4 Ô Dieu, tu es mon roi : Ordonne la délivrance de Jacob !\n5 Avec toi nous renversons nos ennemis, Avec ton nom nous écrasons nos adversaires.\n6 Car ce n'est pas en mon arc que je me confie, Ce n'est pas mon épée qui me sauvera ;\n7 Mais c'est toi qui nous délivres de nos ennemis, Et qui confonds ceux qui nous haïssent.\n8 Nous nous glorifions en Dieu chaque jour, Et nous célébrerons ton nom à jamais.\n9 Cependant tu nous repousses, tu nous couvres de honte, Tu ne sors plus avec nos armées ;\n10 Tu nous fais reculer devant l'ennemi, Et ceux qui nous haïssent nous dépouillent.\n11 Tu nous livres comme des brebis à dévorer, Tu nous disperses parmi les nations.\n12 Tu vends ton peuple pour rien, Tu ne l'estimes pas à une grande valeur.\n13 Tu fais de nous un objet d'opprobre pour nos voisins, De moquerie et de risée pour ceux qui nous entourent.\n14 Tu fais de nous un sujet de sarcasme parmi les nations, Et un objet de hochements de tête parmi les peuples.\n15 Ma honte est toujours devant moi, Et la confusion couvre mon visage,\n16 À la voix de celui qui m'outrage et m'insulte, À la vue de l'ennemi et du vindicatif.\n17 Tout cela nous arrive, et nous ne t'avons pas oublié, Nous n'avons pas violé ton alliance ;\n18 Notre cœur ne s'est point détourné, Nos pas ne se sont point éloignés de ton sentier,\n19 Pour que tu nous écrases dans le séjour des chacals, Et que tu nous couvres de l'ombre de la mort.\n20 Si nous avions oublié le nom de notre Dieu, Et tendu les mains vers un dieu étranger,\n21 Dieu ne l'aurait-il pas découvert, Lui qui connaît les secrets du cœur ?\n22 Mais c'est à cause de toi qu'on nous égorge tous les jours, Qu'on nous regarde comme des brebis destinées à la boucherie.\n23 Réveille-toi ! Pourquoi dors-tu, Seigneur ? Réveille-toi ! ne nous repousse pas à jamais !\n24 Pourquoi caches-tu ta face ? Oublies-tu notre misère et notre oppression ?\n25 Car notre âme est abattue dans la poussière, Notre corps est attaché à la terre.\n26 Lève-toi, viens à notre secours ! Délivre-nous à cause de ta bonté !"
            }, {
                num: 45,
                titre: "Au chef des chantres. Sur les lis. Des fils de Koré. Cantique. Chant d'amour.",
                premierVers: "Des paroles pleines de charme bouillonnent dans mon cœur. Je dis : Mon œuvre est pour le roi ! Que ma langue soit comme la plume d'un habile écrivain !",
                texte: "1 Des paroles pleines de charme bouillonnent dans mon cœur. Je dis : Mon œuvre est pour le roi ! Que ma langue soit comme la plume d'un habile écrivain !\n2 Tu es le plus beau des fils de l'homme, La grâce est répandue sur tes lèvres : C'est pourquoi Dieu t'a béni pour toujours.\n3 Ceins ton épée sur ta cuisse, vaillant héros, Dans ta gloire et ta magnificence.\n4 Oui, dans ta magnificence, avance-toi, monte sur ton char, Pour la cause de la vérité, de la douceur et de la justice ; Et que ta droite te fasse accomplir des exploits redoutables !\n5 Tes flèches sont aiguës ; Des peuples tomberont sous toi ; Elles perceront le cœur des ennemis du roi.\n6 Ton trône, ô Dieu, est à toujours ; Le sceptre de ton règne est un sceptre d'équité.\n7 Tu aimes la justice, et tu hais la méchanceté : C'est pourquoi, ô Dieu, ton Dieu t'a oint D'une huile de joie, par privilège sur tes collègues.\n8 La myrrhe, l'aloès et la casse parfument tous tes vêtements ; Dans les palais d'ivoire les instruments à cordes te réjouissent.\n9 Des filles de rois sont parmi tes bien-aimées ; La reine est à ta droite, parée d'or d'Ophir.\n10 Écoute, ma fille, vois, et prête l'oreille ; Oublie ton peuple et la maison de ton père.\n11 Le roi porte ses désirs sur ta beauté ; Puisqu'il est ton seigneur, rends-lui tes hommages.\n12 La fille de Tyr, avec des présents, Et les plus riches du peuple rechercheront ta faveur.\n13 Toute resplendissante est la fille du roi dans l'intérieur du palais ; Elle porte un vêtement tissu d'or.\n14 Elle est présentée au roi, vêtue de ses habits brodés, Et suivie des jeunes filles, ses compagnes, qui sont amenées auprès de toi.\n15 On les introduit au milieu des réjouissances et de l'allégresse, Elles entrent dans le palais du roi.\n16 Tes enfants prendront la place de tes pères ; Tu les établiras princes dans tout le pays.\n17 Je rappellerai ton nom dans tous les âges : Aussi les peuples te loueront éternellement et à jamais."
            }, {
                num: 46,
                titre: "Au chef des chantres. Des fils de Koré. Sur alamoth. Cantique.",
                premierVers: "Dieu est pour nous un refuge et un appui, un secours qui ne manque jamais dans la détresse.",
                texte: "1 Dieu est pour nous un refuge et un appui, Un secours qui ne manque jamais dans la détresse.\n2 C'est pourquoi nous sommes sans crainte quand la terre est bouleversée, Et que les montagnes chancellent au cœur des mers,\n3 Quand les flots de la mer mugissent, écument, Se soulèvent jusqu'à faire trembler les montagnes.\n4 Il est un fleuve dont les courants réjouissent la cité de Dieu, Le sanctuaire des demeures du Très-Haut.\n5 Dieu est au milieu d'elle : elle n'est point ébranlée ; Dieu la secourt dès le matin.\n6 Des nations s'agitent, des royaumes s'ébranlent ; Il fait entendre sa voix : la terre se fond.\n7 L'Éternel des armées est avec nous, Le Dieu de Jacob est pour nous une haute retraite.\n8 Venez, contemplez les œuvres de l'Éternel, Les ravages qu'il a opérés sur la terre !\n9 C'est lui qui a fait cesser les combats jusqu'au bout de la terre ; Il a brisé l'arc, et il a rompu la lance, Il a consumé par le feu les chars de guerre.\n10 Arrêtez, et sachez que je suis Dieu : Je domine sur les nations, je domine sur la terre.\n11 L'Éternel des armées est avec nous, Le Dieu de Jacob est pour nous une haute retraite."
            }, {
                num: 47,
                titre: "Au chef des chantres. Des fils de Koré. Psaume.",
                premierVers: "Vous tous, peuples, battez des mains ! Poussez vers Dieu des cris de joie !",
                texte: "1 Vous tous, peuples, battez des mains ! Poussez vers Dieu des cris de joie !\n2 Car l'Éternel, le Très-Haut, est redoutable, Il est un grand roi sur toute la terre.\n3 Il nous assujettit des peuples, Il met des nations sous nos pieds ;\n4 Il nous choisit notre héritage, La gloire de Jacob qu'il aime.\n5 Dieu monte au milieu des cris de triomphe, L'Éternel s'avance au son de la trompette.\n6 Chantez à Dieu, chantez ! Chantez à notre roi, chantez !\n7 Car Dieu est roi de toute la terre : Chantez un cantique !\n8 Dieu règne sur les nations, Dieu a pour siège son saint trône.\n9 Les princes des peuples se rassemblent Au peuple du Dieu d'Abraham ; Car à Dieu sont les boucliers de la terre : Il est souverainement élevé."
            }, {
                num: 48,
                titre: "Cantique. Psaume des fils de Koré.",
                premierVers: "L'Éternel est grand, il est l'objet de toutes les louanges, dans la cité de notre Dieu, sur sa montagne sainte.",
                texte: "1 L'Éternel est grand, il est l'objet de toutes les louanges, Dans la cité de notre Dieu, sur sa montagne sainte.\n2 Belle est la colline, joie de toute la terre, la montagne de Sion ; Du côté du septentrion, c'est la ville du grand roi.\n3 Dieu, dans ses palais, est connu pour une haute retraite.\n4 Car voici, les rois s'étaient concertés : Ils n'ont fait que passer ensemble.\n5 Ils ont regardé, tout stupéfaits, Ils ont eu peur, et ont pris la fuite.\n6 Là un tremblement les a saisis, Comme la douleur d'une femme qui accouche.\n7 Ils ont été chassés comme par le vent d'orient, Qui brise les navires de Tarsis.\n8 Ce que nous avions entendu dire, nous l'avons vu Dans la ville de l'Éternel des armées, Dans la ville de notre Dieu : Dieu la fera subsister à toujours.\n9 Ô Dieu, nous pensons à ta bonté, Au milieu de ton temple.\n10 Comme ton nom, ô Dieu, Ta louange retentit jusqu'aux extrémités de la terre ; Ta droite est pleine de justice.\n11 La montagne de Sion se réjouit, Les filles de Juda sont dans l'allégresse, À cause de tes jugements.\n12 Parcourez Sion, faites-en le tour, Comptez ses tours,\n13 Observez son rempart, Examinez ses palais, Pour le raconter à la génération future.\n14 Voilà le Dieu qui est notre Dieu éternellement et à jamais ; Il sera notre guide jusqu'à la mort."
            }, {
                num: 49,
                titre: "Au chef des chantres. Des fils de Koré. Psaume.",
                premierVers: "Écoutez ceci, vous tous, peuples, prêtez l'oreille, vous tous, habitants du monde,",
                texte: "1 Écoutez ceci, vous tous, peuples, Prêtez l'oreille, vous tous, habitants du monde,\n2 Petits et grands, Riches et pauvres !\n3 Ma bouche va faire entendre des paroles sages, Et mon cœur a des pensées pleines de sens.\n4 Je prête l'oreille aux sentences qui me sont inspirées, J'ouvre mon chant au son de la harpe.\n5 Pourquoi craindrais-je aux jours du malheur, Lorsque l'iniquité de mes adversaires m'enveloppe ?\n6 Ils ont confiance dans leurs biens, Et se glorifient de leur grande richesse.\n7 Ils ne peuvent se racheter l'un l'autre, Ni donner à Dieu le prix du rachat.\n8 Le rachat de leur âme est cher, Et n'aura jamais lieu ;\n9 Ils ne vivront pas toujours, Ils n'éviteront pas la vue de la fosse.\n10 Car ils la verront : les sages meurent, L'insensé et le stupide périssent également, Et ils laissent à d'autres leurs biens.\n11 Ils s'imaginent que leurs maisons seront éternelles, Que leurs demeures subsisteront d'âge en âge, Eux dont les noms sont honorés sur la terre.\n12 Mais l'homme qui est en honneur n'a point de durée, Il est semblable aux bêtes que l'on égorge.\n13 Telle est leur voie, leur folie, Et ceux qui les suivent se plaisent à leurs discours.\n14 Comme un troupeau, ils sont mis dans le séjour des morts, La mort en fait sa pâture ; Et bientôt les hommes droits les foulent aux pieds, Leur beauté s'évanouit, le séjour des morts est leur demeure.\n15 Mais Dieu sauvera mon âme du séjour des morts, Car il me prendra sous sa protection.\n16 Ne crains pas quand un homme s'enrichit, Quand les trésors de sa maison se multiplient ;\n17 Car il n'emporte rien en mourant, Ses trésors ne descendent point après lui.\n18 Il aura beau s'estimer heureux pendant sa vie, On aura beau te louer des jouissances que tu te donnes,\n19 Tu iras néanmoins au séjour de tes pères, Qui jamais ne reverront la lumière.\n20 L'homme qui est en honneur, et qui n'a pas d'intelligence, Est semblable aux bêtes que l'on égorge."
            }, {
                num: 50,
                titre: "Psaume d'Asaph.",
                premierVers: "Dieu, Dieu, l'Éternel, parle, et convoque la terre, depuis le soleil levant jusqu'au soleil couchant.",
                texte: "1 Dieu, Dieu, l'Éternel, parle, et convoque la terre, Depuis le soleil levant jusqu'au soleil couchant.\n2 De Sion, beauté parfaite, Dieu resplendit.\n3 Il vient, notre Dieu, il ne reste pas en silence ; Devant lui est un feu dévorant, Autour de lui une violente tempête.\n4 Il crie vers les cieux en haut, Et vers la terre, pour juger son peuple :\n5 Rassemblez-moi mes fidèles, Qui ont fait alliance avec moi par le sacrifice !\n6 Et les cieux publieront sa justice, Car c'est Dieu qui est juge.\n7 Écoute, mon peuple, et je parlerai ; Israël, et je t'avertirai ! Je suis Dieu, ton Dieu.\n8 Ce n'est pas pour tes sacrifices que je te fais des reproches ; Tes holocaustes sont constamment devant moi.\n9 Je ne prendrai pas de taureau dans ta maison, Ni de bouc dans tes bergeries.\n10 Car tous les animaux des forêts sont à moi, Tout le bétail des montagnes par milliers ;\n11 Je connais tous les oiseaux des montagnes, Et tout ce qui se meut dans les champs m'appartient.\n12 Si j'avais faim, je ne te le dirais pas, Car le monde est à moi et tout ce qu'il renferme.\n13 Est-ce que je mange la chair des taureaux ? Est-ce que je bois le sang des boucs ?\n14 Offre pour sacrifice à Dieu des actions de grâces, Et accomplis tes vœux envers le Très-Haut.\n15 Et invoque-moi au jour de la détresse ; Je te délivrerai, et tu me glorifieras.\n16 Et Dieu dit au méchant : Quoi donc ! tu énumères mes lois, Et tu as mon alliance à la bouche,\n17 Toi qui hais les avis, Et qui jettes mes paroles derrière toi !\n18 Si tu vois un voleur, tu te plais avec lui, Et ta part est avec les adultères.\n19 Tu livres ta bouche au mal, Et ta langue est un tissu de tromperies.\n20 Tu t'assieds, et tu parles contre ton frère, Tu diffames le fils de ta mère.\n21 Voilà ce que tu as fait, et je me suis tu. Tu t'es imaginé que je te ressemblais ; Mais je vais te reprendre, et tout mettre sous tes yeux.\n22 Prenez-y donc garde, vous qui oubliez Dieu, De peur que je ne déchire, sans que personne délivre.\n23 Celui qui offre pour sacrifice des actions de grâces me glorifie, Et à celui qui veille sur sa voie Je ferai voir le salut de Dieu."
            }, {
                num: 51,
                titre: "Au chef des chantres. Psaume de David. Lorsque Nathan le prophète vint à lui, après que David fut allé vers Bath-Schéba.",
                premierVers: "Ô Dieu, aie pitié de moi dans ta bonté ; selon ta grande miséricorde, efface mes transgressions.",
                texte: "1 Ô Dieu, aie pitié de moi dans ta bonté ; Selon ta grande miséricorde, efface mes transgressions.\n2 Lave-moi complètement de mon iniquité, Et purifie-moi de mon péché.\n3 Car je reconnais mes transgressions, Et mon péché est constamment devant moi.\n4 J'ai péché contre toi seul, Et j'ai fait ce qui est mal à tes yeux, En sorte que tu seras juste dans ta sentence, Sans reproche dans ton jugement.\n5 Voici, je suis né dans l'iniquité, Et ma mère m'a conçu dans le péché.\n6 Mais tu veux que la vérité soit au fond du cœur : Fais donc pénétrer la sagesse au-dedans de moi !\n7 Purifie-moi avec l'hysope, et je serai pur ; Lave-moi, et je serai plus blanc que la neige.\n8 Fais-moi entendre l'allégresse et la joie, Et les os que tu as brisés se réjouiront.\n9 Détourne ton regard de mes péchés, Efface toutes mes iniquités.\n10 Ô Dieu, crée en moi un cœur pur, Renouvelle en moi un esprit bien disposé.\n11 Ne me rejette pas loin de ta face, Ne me retire pas ton Esprit saint.\n12 Rends-moi la joie de ton salut, Et soutiens-moi par un esprit de bonne volonté !\n13 J'enseignerai tes voies à ceux qui les transgressent, Et les pécheurs se convertiront à toi.\n14 Ô Dieu, Dieu de mon salut, délivre-moi du sang versé, Et ma langue célébrera ta justice.\n15 Seigneur, ouvre mes lèvres, Et ma bouche publiera ta louange.\n16 Si tu eusses voulu des sacrifices, je t'en aurais offert ; Mais tu ne prends point plaisir aux holocaustes.\n17 Les sacrifices qui sont agréables à Dieu, c'est un esprit brisé : Ô Dieu, tu ne dédaignes pas un cœur brisé et contrit.\n18 Répands par ta grâce tes bienfaits sur Sion, Bâtis les murs de Jérusalem !\n19 Alors tu agréeras des sacrifices de justice, Des holocaustes et des victimes tout entières ; Alors on offrira des taureaux sur ton autel."
            }, {
                num: 52,
                titre: "Au chef des chantres. Cantique de David. À l'occasion du rapport que Doëg l'Édomite vint faire à Saül, en disant : David s'est rendu dans la maison d'Achimélec.",
                premierVers: "Pourquoi te glorifies-tu de ta méchanceté, homme puissant ? La bonté de Dieu subsiste toujours.",
                texte: "1 Pourquoi te glorifies-tu de ta méchanceté, homme puissant ? La bonté de Dieu subsiste toujours.\n2 Ta langue n'invente que malice, comme un rasoir affilé, fourbe que tu es !\n3 Tu aimes le mal plutôt que le bien, Le mensonge plutôt que la droiture.\n4 Tu aimes toutes les paroles de destruction, Langue trompeuse !\n5 Aussi Dieu t'abattra pour toujours, Il te saisira et t'enlèvera de ta tente ; Il te déracinera de la terre des vivants.\n6 Les justes le verront, et auront de la crainte, Et ils feront de lui le sujet de leurs moqueries :\n7 Voilà l'homme qui ne prenait point Dieu pour protecteur, Mais qui se confiait en ses grandes richesses, Et qui triomphait dans sa malice !\n8 Et moi, je suis dans la maison de Dieu comme un olivier verdoyant, Je me confie dans la bonté de Dieu, éternellement et à jamais.\n9 Je te louerai toujours, parce que tu as agi ; Et je veux espérer en ton nom, parce qu'il est favorable, En présence de tes fidèles."
            }, {
                num: 53,
                titre: "Au chef des chantres. Sur la flûte. Cantique de David.",
                premierVers: "L'insensé dit en son cœur : Il n'y a point de Dieu ! Ils se sont corrompus, ils ont commis des iniquités abominables ; il n'en est aucun qui fasse le bien.",
                texte: "1 L'insensé dit en son cœur : Il n'y a point de Dieu ! Ils se sont corrompus, ils ont commis des iniquités abominables ; Il n'en est aucun qui fasse le bien.\n2 Dieu, du haut des cieux, regarde les fils de l'homme, Pour voir s'il y a quelqu'un qui soit intelligent, Qui cherche Dieu.\n3 Tous sont égarés, tous sont pervertis ; Il n'en est aucun qui fasse le bien, Pas même un seul.\n4 Ceux qui commettent l'iniquité ont-ils perdu le sens ? Ils dévorent mon peuple, ils le prennent pour nourriture ; Ils n'invoquent point Dieu.\n5 Alors ils trembleront d'épouvante, Sans qu'il y ait sujet d'épouvante ; Dieu dispersera les os de ceux qui campent contre toi ; Tu les confondras, car Dieu les a rejetés.\n6 Oh ! qui fera partir de Sion la délivrance d'Israël ? Quand Dieu ramènera les captifs de son peuple, Jacob sera dans l'allégresse, Israël se réjouira."
            }, {
                num: 54,
                titre: "Au chef des chantres. Avec instruments à cordes. Cantique de David. Lorsque les Ziphiens vinrent dire à Saül : David n'est-il pas caché parmi nous ?",
                premierVers: "Ô Dieu, sauve-moi par ton nom, et rends-moi justice par ta puissance !",
                texte: "1 Ô Dieu, sauve-moi par ton nom, Et rends-moi justice par ta puissance !\n2 Ô Dieu, écoute ma prière, Prête l'oreille aux paroles de ma bouche !\n3 Car des étrangers se sont levés contre moi, Des hommes violents en veulent à ma vie ; Ils ne portent pas leurs pensées sur Dieu.\n4 Voici, Dieu est mon secours, Le Seigneur est le soutien de mon âme.\n5 Le mal retombera sur mes adversaires ; Anéantis-les, dans ta fidélité !\n6 Je t'offrirai de bon cœur des sacrifices ; Je louerai ton nom, ô Éternel, car il est favorable,\n7 Car il me délivre de toute détresse, Et mes yeux se réjouissent à la vue de mes ennemis."
            }, {
                num: 55,
                titre: "Au chef des chantres. Avec instruments à cordes. Cantique de David.",
                premierVers: "Ô Dieu, prête l'oreille à ma prière, et ne te dérobe pas à mes supplications !",
                texte: "1 Ô Dieu, prête l'oreille à ma prière, Et ne te dérobe pas à mes supplications !\n2 Écoute-moi, et réponds-moi ! J'erre çà et là dans mon chagrin et je m'agite,\n3 À cause de la voix de l'ennemi et de l'oppression du méchant ; Car ils font tomber sur moi le malheur, Et me poursuivent avec colère.\n4 Mon cœur tremble au-dedans de moi, Et les terreurs de la mort me surprennent ;\n5 La crainte et l'épouvante m'assaillent, Et le frisson m'enveloppe.\n6 Je dis : Oh ! si j'avais les ailes de la colombe, Je m'envolerais, et je trouverais le repos ;\n7 Voici, je fuirais bien loin, J'irais séjourner au désert ;\n8 Je m'échapperais en toute hâte, Plus rapide que le vent impétueux, que la tempête.\n9 Réduis à néant, Seigneur, divise leurs langues ! Car je vois dans la ville la violence et les querelles ;\n10 Elles en font jour et nuit le tour sur ses murs ; L'iniquité et la malice sont au milieu d'elle ;\n11 La méchanceté est au milieu d'elle, Et la fraude et la tromperie ne quittent point ses places.\n12 Ce n'est pas un ennemi qui m'outrage, je le supporterais ; Ce n'est pas mon adversaire qui s'élève contre moi, Je me cacherais devant lui.\n13 C'est toi, que j'estimais mon égal, Toi, mon confident et mon ami !\n14 Ensemble nous vivions dans une douce intimité, Nous allions avec la foule à la maison de Dieu !\n15 Que la mort les surprenne, Qu'ils descendent vivants au séjour des morts ! Car la méchanceté est dans leur demeure, au milieu d'eux.\n16 Et moi, je crie à Dieu, Et l'Éternel me sauvera.\n17 Le soir, le matin, et à midi, je soupire et je gémis, Et il entendra ma voix.\n18 Il me délivrera de leur approche et me rendra la paix, Car ils sont nombreux contre moi.\n19 Dieu entendra, et il les humiliera, Lui qui de toute éternité est assis sur son trône ; Car il n'y a point en eux de changement, Et ils ne craignent point Dieu.\n20 Il porte la main sur ceux qui étaient en paix avec lui, Il viole son alliance ;\n21 Sa bouche est plus douce que la crème, Mais la guerre est dans son cœur ; Ses paroles sont plus onctueuses que l'huile, Mais ce sont des épées nues.\n22 Remets ton sort à l'Éternel, et il te soutiendra ; Il ne laissera jamais chanceler le juste.\n23 Et toi, ô Dieu, tu les feras descendre au fond de la fosse ; Les hommes de sang et de fraude N'atteindront pas la moitié de leurs jours. C'est en toi que je me confie."
            }, {
                num: 56,
                titre: "Au chef des chantres. Sur « Colombe des térébinthes lointains ». Hymne de David. Lorsque les Philistins le saisirent à Gath.",
                premierVers: "Aie pitié de moi, ô Dieu, car des hommes me harcèlent ; tout le jour ils me font la guerre, ils me tourmentent.",
                texte: "1 Aie pitié de moi, ô Dieu, car des hommes me harcèlent ; Tout le jour ils me font la guerre, ils me tourmentent.\n2 Tout le jour mes adversaires me harcèlent ; Ils sont nombreux, ils me font la guerre, ô Très-Haut !\n3 Quand je suis dans la crainte, En toi je me confie.\n4 Je me glorifierai en Dieu, en sa parole ; Je me confie en Dieu, je ne crains rien : Que peuvent me faire des hommes ?\n5 Sans cesse ils portent atteinte à mes droits, Ils n'ont à mon égard que de mauvaises pensées.\n6 Ils complotent, ils épient, ils observent mes traces, Parce qu'ils en veulent à ma vie.\n7 C'est par l'iniquité qu'ils espèrent échapper : Dans ta colère, ô Dieu, précipite les peuples !\n8 Tu comptes les pas de ma vie errante ; Recueille mes larmes dans ton outre : Ne sont-elles pas inscrites dans ton livre ?\n9 Mes ennemis reculeront, au jour où je crierai ; Je sais que Dieu est pour moi.\n10 Je me glorifierai en Dieu, en sa parole ; Je me glorifierai en l'Éternel, en sa parole ;\n11 Je me confie en Dieu, je ne crains rien : Que peuvent me faire des hommes ?\n12 Ô Dieu, je dois accomplir les vœux que je t'ai faits ; Je t'offrirai des actions de grâces.\n13 Car tu as délivré mon âme de la mort, Tu as garanti mes pieds de la chute, Afin que je marche devant Dieu, à la lumière des vivants."
            }, {
                num: 57,
                titre: "Au chef des chantres. « Ne détruis pas ». Hymne de David. Lorsqu'il se réfugia dans la caverne, poursuivi par Saül.",
                premierVers: "Aie pitié de moi, ô Dieu, aie pitié de moi ! Car en toi mon âme cherche un refuge ; je cherche un abri à l'ombre de tes ailes, jusqu'à ce que les calamités soient passées.",
                texte: "1 Aie pitié de moi, ô Dieu, aie pitié de moi ! Car en toi mon âme cherche un refuge ; Je cherche un abri à l'ombre de tes ailes, Jusqu'à ce que les calamités soient passées.\n2 Je crie au Dieu Très-Haut, Au Dieu qui agit en ma faveur.\n3 Il m'enverra du ciel le salut, Tandis que mon persécuteur se répand en outrages ; Dieu enverra sa bonté et sa fidélité.\n4 Mon âme est parmi des lions ; Je suis couché au milieu de gens qui vomissent la flamme, Au milieu d'hommes qui ont pour dents la lance et les flèches, Et dont la langue est un glaive tranchant.\n5 Élève-toi sur les cieux, ô Dieu ! Que ta gloire soit sur toute la terre !\n6 Ils avaient tendu un filet sous mes pas : Mon âme se courbait ; Ils avaient creusé une fosse devant moi : Ils y sont tombés.\n7 Mon cœur est affermi, ô Dieu, mon cœur est affermi ; Je chanterai, je ferai retentir mes instruments.\n8 Réveille-toi, mon âme ! réveillez-vous, mon luth et ma harpe ! Je réveillerai l'aurore.\n9 Je te louerai parmi les peuples, Seigneur ! Je te chanterai parmi les nations.\n10 Car ta bonté atteint jusqu'aux cieux, Et ta fidélité jusqu'aux nues.\n11 Élève-toi sur les cieux, ô Dieu ! Que ta gloire soit sur toute la terre !"
            }, {
                num: 58,
                titre: "Au chef des chantres. « Ne détruis pas ». Hymne de David.",
                premierVers: "Est-ce donc en vous taisant que vous rendez la justice ? Est-ce ainsi que vous jugez avec droiture, fils de l'homme ?",
                texte: "1 Est-ce donc en vous taisant que vous rendez la justice ? Est-ce ainsi que vous jugez avec droiture, fils de l'homme ?\n2 Loin de là ! Dans le cœur, vous commettez des iniquités ; Dans le pays, vous faites place à la violence de vos mains.\n3 Les méchants sont pervertis dès le sein maternel, Les menteurs s'égarent au sortir du ventre de leur mère.\n4 Ils ont un venin pareil au venin d'un serpent, D'une vipère sourde qui ferme son oreille,\n5 Qui n'entend pas la voix des enchanteurs, Du plus habile des charmeurs.\n6 Ô Dieu, brise-leur les dents dans la bouche ! Éternel, arrache les mâchoires des lionceaux !\n7 Qu'ils s'écoulent comme des eaux qui se perdent ! Qu'ils ne lancent que des flèches émoussées !\n8 Qu'ils périssent en se fondant, comme un limaçon ; Sans voir le soleil, comme l'avorton d'une femme !\n9 Avant que vos chaudières sentent l'épine, Verte ou enflammée, le tourbillon l'emportera.\n10 Le juste sera dans la joie, à la vue de la vengeance ; Il baignera ses pieds dans le sang des méchants.\n11 Et l'on dira : Oui, il est une récompense pour le juste ; Oui, il est un Dieu qui juge sur la terre."
            }, {
                num: 59,
                titre: "Au chef des chantres. « Ne détruis pas ». Hymne de David. Lorsque Saül envoya cerner la maison pour le faire mourir.",
                premierVers: "Mon Dieu, délivre-moi de mes ennemis, protège-moi contre mes adversaires !",
                texte: "1 Mon Dieu, délivre-moi de mes ennemis, Protège-moi contre mes adversaires !\n2 Délivre-moi des malfaiteurs, Et sauve-moi des hommes de sang !\n3 Car voici, ils sont aux aguets pour m'ôter la vie ; Des hommes violents complotent contre moi, Sans que je sois coupable, sans que j'aie péché, ô Éternel !\n4 Malgré mon innocence, ils courent, ils se préparent : Réveille-toi, viens à ma rencontre, et regarde !\n5 Toi, Éternel, Dieu des armées, Dieu d'Israël, Lève-toi pour châtier toutes les nations ! N'aie pitié d'aucun de ces méchants infidèles !\n6 Ils reviennent chaque soir, ils hurlent comme des chiens, Ils font le tour de la ville.\n7 Voici, de leur bouche ils font jaillir le mal, Des glaives sont sur leurs lèvres ; Car, qui est-ce qui entend ?\n8 Et toi, Éternel, tu te ris d'eux, Tu te moques de toutes les nations.\n9 Quelle que soit leur force, c'est en toi que j'espère, Car Dieu est ma haute retraite.\n10 Mon Dieu vient au-devant de moi dans sa bonté, Dieu me fait contempler avec joie ceux qui me persécutent.\n11 Ne les tue pas, de peur que mon peuple ne l'oublie ; Fais-les errer par ta puissance, et précipite-les, Seigneur, notre bouclier !\n12 Leur bouche pèche à chaque parole de leurs lèvres : Qu'ils soient pris dans leur propre orgueil ! Ils ne profèrent que malédictions et mensonges.\n13 Détruis-les, dans ta fureur, détruis-les, et qu'ils ne soient plus ! Qu'ils sachent que Dieu règne sur Jacob, Jusqu'aux extrémités de la terre !\n14 Ils reviennent chaque soir, ils hurlent comme des chiens, Ils font le tour de la ville.\n15 Ils errent çà et là, cherchant leur proie, Et ils passent la nuit sans être rassasiés.\n16 Et moi, je chanterai ta force ; Dès le matin, je célébrerai ta bonté. Car tu es pour moi une haute retraite, Un refuge au jour de ma détresse.\n17 Ô ma force, c'est toi que je célébrerai, Car Dieu, mon Dieu tout bon, est ma haute retraite."
            }, {
                num: 60,
                titre: "Au chef des chantres. Sur le lys lyrique. Hymne de David, pour enseigner. Lorsqu'il fit la guerre aux Syriens de Mésopotamie et aux Syriens de Tsoba, et que Joab revint et battit dans la vallée du sel douze mille Édomites.",
                premierVers: "Ô Dieu, tu nous as repoussés, tu nous as dispersés, tu t'es irrité : relève-nous !",
                texte: "1 Ô Dieu, tu nous as repoussés, tu nous as dispersés, Tu t'es irrité : relève-nous !\n2 Tu as ébranlé la terre, tu l'as déchirée : Répare ses brèches, car elle chancelle !\n3 Tu as fait voir à ton peuple des choses dures, Tu nous as abreuvés d'un vin d'étourdissement.\n4 Tu as donné à ceux qui te craignent une bannière, Pour qu'elle s'élève à cause de la vérité.\n5 Afin que tes bien-aimés soient délivrés, Sauve par ta droite, et exauce-nous !\n6 Dieu a dit dans sa sainteté : Je triompherai, Je partagerai Sichem, je mesurerai la vallée de Succoth ;\n7 À moi Galaad, à moi Manassé ; Éphraïm est le rempart de ma tête, Et Juda, mon sceptre ;\n8 Moab est le bassin où je me lave ; Je jette mon soulier sur Édom ; Pays des Philistins, pousse des cris de joie à mon sujet !\n9 Qui me mènera dans la ville forte ? Qui me conduira à Édom ?\n10 N'est-ce pas toi, ô Dieu, qui nous as repoussés, Et qui ne sortais plus, ô Dieu, avec nos armées ?\n11 Donne-nous du secours contre l'ennemi ! Car le secours de l'homme n'est que vanité.\n12 Avec Dieu, nous ferons des exploits ; Il écrasera nos ennemis."
            }, {
                num: 61,
                titre: "Au chef des chantres. Sur instruments à cordes. De David.",
                premierVers: "Ô Dieu, écoute mes cris, sois attentif à ma prière !",
                texte: "1 Ô Dieu, écoute mes cris, Sois attentif à ma prière !\n2 Du bout de la terre je crie à toi, le cœur abattu ; Conduis-moi sur le rocher que je ne puis atteindre !\n3 Car tu es un refuge pour moi, Une tour forte, en face de l'ennemi.\n4 Je voudrais séjourner éternellement dans ta tente, Me réfugier à l'abri de tes ailes.\n5 Car toi, ô Dieu, tu exauces mes vœux, Tu me donnes l'héritage de ceux qui craignent ton nom.\n6 Ajoute des jours aux jours du roi ; Que ses années se prolongent à jamais !\n7 Qu'il reste sur son trône éternellement devant Dieu ! Fais que ta bonté et ta fidélité veillent sur lui !\n8 Alors je chanterai sans cesse ton nom, En accomplissant chaque jour mes vœux."
            }, {
                num: 62,
                titre: "Au chef des chantres. D'après Jeduthun. Psaume de David.",
                premierVers: "Oui, c'est en Dieu que mon âme se confie ; de lui vient mon salut.",
                texte: "1 Oui, c'est en Dieu que mon âme se confie ; De lui vient mon salut.\n2 Oui, c'est lui qui est mon rocher et mon salut ; Ma haute retraite : je ne chancellerai guère.\n3 Jusques à quand vous jetterez-vous sur un homme, Chercherez-vous tous à l'abattre, Comme une muraille qui penche, Comme une clôture sur le point de tomber ?\n4 Ils conspirent pour le précipiter de son poste élevé ; Ils prennent plaisir au mensonge ; Ils bénissent de leur bouche, Et ils maudissent dans leur cœur.\n5 Oui, mon âme, confie-toi en Dieu ! Car de lui vient mon espérance.\n6 Oui, c'est lui qui est mon rocher et mon salut ; Ma haute retraite : je ne chancellerai pas.\n7 Sur Dieu reposent mon salut et ma gloire ; Le rocher de ma force, mon refuge, est en Dieu.\n8 En tout temps, peuples, confiez-vous en lui, Répandez vos cœurs en sa présence ! Dieu est notre refuge.\n9 Oui, vanité, les fils de l'homme ! Mensonge, les fils de l'homme ! Dans une balance, ils monteraient Tous ensemble, plus légers qu'un souffle.\n10 Ne vous confiez pas dans la violence, Et ne mettez pas un vain espoir dans la rapine ; Quand les richesses s'accroissent, N'y attachez pas votre cœur.\n11 Dieu a parlé une fois ; Deux fois j'ai entendu ceci : C'est que la force est à Dieu.\n12 À toi aussi, Seigneur, la bonté ; Car tu rends à chacun selon ses œuvres."
            }, {
                num: 63,
                titre: "Psaume de David. Lorsqu'il était dans le désert de Juda.",
                premierVers: "Ô Dieu, tu es mon Dieu, je te cherche ; mon âme a soif de toi, mon corps soupire après toi, dans une terre aride, desséchée, sans eau.",
                texte: "1 Ô Dieu, tu es mon Dieu, je te cherche ; Mon âme a soif de toi, mon corps soupire après toi, Dans une terre aride, desséchée, sans eau.\n2 Ainsi je te contemple dans le sanctuaire, Pour voir ta puissance et ta gloire.\n3 Car ta bonté vaut mieux que la vie : Mes lèvres célèbrent tes louanges.\n4 Je te bénirai donc toute ma vie, J'élèverai mes mains en ton nom.\n5 Mon âme sera rassasiée comme de mets gras et succulents, Et, avec des cris de joie sur les lèvres, ma bouche te louera.\n6 Lorsque je pense à toi sur ma couche, Je médite sur toi pendant les veilles de la nuit.\n7 Car tu es mon secours, Et je suis dans l'allégresse à l'ombre de tes ailes.\n8 Mon âme est attachée à toi ; Ta droite me soutient.\n9 Mais ceux qui cherchent à m'ôter la vie Iront dans les profondeurs de la terre ;\n10 Ils seront livrés au glaive, Ils seront la proie des chacals.\n11 Et le roi se réjouira en Dieu ; Quiconque jure par lui s'en glorifiera, Car la bouche des menteurs sera fermée."
            }, {
                num: 64,
                titre: "Au chef des chantres. Psaume de David.",
                premierVers: "Ô Dieu, écoute ma voix, quand je gémis ! Protège ma vie contre l'ennemi que je crains !",
                texte: "1 Ô Dieu, écoute ma voix, quand je gémis ! Protège ma vie contre l'ennemi que je crains !\n2 Garantis-moi des complots des méchants, Du tumulte des hommes injustes !\n3 Ils aiguisent leur langue comme un glaive, Ils lancent comme des flèches leurs paroles amères,\n4 Pour tirer en cachette sur l'innocent ; Ils tirent sur lui à l'improviste, sans rien craindre.\n5 Ils se fortifient dans leur méchanceté ; Ils se concertent pour tendre des pièges, Ils disent : Qui les verra ?\n6 Ils méditent des crimes : Nous voici prêts, le plan est conçu ! La pensée intime, le cœur de chacun est un abîme.\n7 Mais Dieu lance contre eux ses flèches : Soudain les voilà frappés.\n8 Leur langue a causé leur chute ; Tous ceux qui les voient secouent la tête.\n9 Tous les hommes sont saisis de crainte, Ils publient ce que Dieu fait, Et prennent garde à son œuvre.\n10 Le juste se réjouit en l'Éternel et cherche en lui son refuge, Tous ceux qui ont le cœur droit se glorifient."
            }, {
                num: 65,
                titre: "Au chef des chantres. Psaume de David. Cantique.",
                premierVers: "Avec confiance, ô Dieu, on te louera dans Sion, et l'on accomplira les vœux qu'on t'a faits.",
                texte: "1 Avec confiance, ô Dieu, on te louera dans Sion, Et l'on accomplira les vœux qu'on t'a faits.\n2 Ô toi, qui écoutes la prière ! Tous les hommes viendront à toi.\n3 Les iniquités m'accablent : Tu pardonneras nos transgressions.\n4 Heureux celui que tu choisis et que tu admets en ta présence, Pour qu'il habite dans tes parvis ! Nous nous rassasierons du bonheur de ta maison, De la sainteté de ton temple.\n5 Dans ta bonté, tu nous exauces par des prodiges, Dieu de notre salut, Espoir de toutes les extrémités lointaines de la terre et de la mer !\n6 Il affermit les montagnes par sa force, Il est ceint de puissance ;\n7 Il apaise le mugissement des mers, le mugissement de leurs flots, Et le tumulte des peuples.\n8 Ceux qui habitent aux extrémités du monde sont remplis de crainte à la vue de tes prodiges ; Tu fais jubiler les contrées de l'orient et de l'occident.\n9 Tu visites la terre et tu lui donnes l'abondance, Tu la combles de richesses ; Le ruisseau de Dieu est plein d'eau ; Tu prépares le blé, quand tu la fertilises ainsi.\n10 En arrosant ses sillons, en aplanissant ses mottes, Tu la détrempes par des pluies, tu bénis son germe.\n11 Tu couronnes l'année de tes biens, Et tes pas versent l'abondance ;\n12 Les plaines du désert sont abreuvées, Et les collines sont ceintes d'allégresse ;\n13 Les pâturages se couvrent de troupeaux, Et les vallées se parent de froment. Les cris de joie et les chants retentissent."
            }, {
                num: 66,
                titre: "Au chef des chantres. Cantique. Psaume.",
                premierVers: "Poussez vers Dieu des cris de joie, vous tous, habitants de la terre !",
                texte: "1 Poussez vers Dieu des cris de joie, Vous tous, habitants de la terre !\n2 Chantez la gloire de son nom, Célébrez sa gloire par vos louanges !\n3 Dites à Dieu : Que tes œuvres sont redoutables ! À cause de la grandeur de ta force, tes ennemis te flattent.\n4 Toute la terre se prosterne devant toi et chante en ton honneur ; Elle chante ton nom.\n5 Venez et contemplez les œuvres de Dieu ! Il est redoutable quand il agit sur les fils de l'homme.\n6 Il changea la mer en une terre sèche, On traversa le fleuve à pied : Alors nous nous réjouîmes en lui.\n7 Il domine éternellement par sa puissance, Ses yeux observent les nations : Que les rebelles ne s'élèvent pas !\n8 Peuples, bénissez notre Dieu, Faites retentir sa louange !\n9 Il a conservé la vie à notre âme, Et il n'a pas permis que notre pied chancelât.\n10 Car tu nous as éprouvés, ô Dieu ! Tu nous as fait passer au creuset comme l'argent.\n11 Tu nous as amenés dans le filet, Tu as mis sur nos reins un pesant fardeau,\n12 Tu as laissé les hommes monter sur nos têtes ; Nous avons passé par le feu et par l'eau. Mais tu nous en as tirés pour nous donner l'abondance.\n13 J'irai dans ta maison avec des holocaustes, J'accomplirai mes vœux envers toi :\n14 Pour eux mes lèvres se sont ouvertes, Et ma bouche les a prononcés dans ma détresse.\n15 Je t'offrirai des brebis grasses en holocauste, Avec la graisse des béliers ; Je sacrifierai des brebis avec des boucs.\n16 Venez, écoutez, vous tous qui craignez Dieu, et je raconterai Ce qu'il a fait à mon âme.\n17 J'ai crié à lui de ma bouche, Et la louange a été sur ma langue.\n18 Si j'avais conçu l'iniquité dans mon cœur, Le Seigneur ne m'aurait pas exaucé.\n19 Mais Dieu m'a exaucé, Il a été attentif à la voix de ma prière.\n20 Béni soit Dieu, Qui n'a pas rejeté ma prière, Et qui ne m'a pas retiré sa bonté !"
            }, {
                num: 67,
                titre: "Au chef des chantres. Avec instruments à cordes. Psaume. Cantique.",
                premierVers: "Que Dieu ait pitié de nous et qu'il nous bénisse, qu'il fasse luire sur nous sa face,",
                texte: "1 Que Dieu ait pitié de nous et qu'il nous bénisse, Qu'il fasse luire sur nous sa face,\n2 Afin que l'on connaisse sur la terre ta voie, Et parmi toutes les nations ton salut !\n3 Les peuples te louent, ô Dieu ! Tous les peuples te louent.\n4 Les nations se réjouissent et sont dans l'allégresse ; Car tu juges les peuples avec droiture, Et tu conduis les nations sur la terre.\n5 Les peuples te louent, ô Dieu ! Tous les peuples te louent.\n6 La terre donne ses produits ; Dieu, notre Dieu, nous bénit.\n7 Dieu nous bénit, Et toutes les extrémités de la terre le craignent."
            }, {
                num: 68,
                titre: "Au chef des chantres. De David. Psaume. Cantique.",
                premierVers: "Dieu se lève, ses ennemis se dispersent, et ses adversaires fuient devant sa face.",
                texte: "1 Dieu se lève, ses ennemis se dispersent, Et ses adversaires fuient devant sa face.\n2 Comme la fumée se dissipe, tu les dissipes ; Comme la cire se fond au feu, Les méchants disparaissent devant Dieu.\n3 Mais les justes se réjouissent, ils triomphent devant Dieu, Ils ont des transports d'allégresse.\n4 Chantez à Dieu, célébrez son nom ! Frayez le chemin à celui qui s'avance à travers les plaines ! L'Éternel est son nom : réjouissez-vous devant lui !\n5 Le père des orphelins, le défenseur des veuves, C'est Dieu dans sa demeure sainte.\n6 Dieu donne une famille à ceux qui étaient abandonnés, Il délivre les captifs et les rend heureux ; Les rebelles seuls habitent des lieux arides.\n7 Ô Dieu, quand tu sortis à la tête de ton peuple, Quand tu marchais dans le désert,\n8 La terre trembla, les cieux se fondirent devant Dieu, Le Sinaï s'ébranla devant Dieu, le Dieu d'Israël.\n9 Tu fis tomber une pluie bienfaisante, ô Dieu ; Tu fortifias ton héritage épuisé.\n10 Ton peuple établit sa demeure dans le lieu Que ta bonté, ô Dieu, tu avais préparé pour les malheureux.\n11 Le Seigneur dit une parole, Et les messagères de bonnes nouvelles sont une grande armée.\n12 Les rois des armées fuient, fuient, Et celle qui reste à la maison partage le butin.\n13 Tandis que vous reposez au milieu des étables, Les ailes de la colombe sont couvertes d'argent, Et son plumage est d'un jaune d'or.\n14 Lorsque le Tout-Puissant dispersa les rois dans le pays, La terre devint blanche comme la neige du Tsalmon.\n15 Montagne de Dieu, montagne de Basan, Montagne aux cimes nombreuses, montagne de Basan,\n16 Pourquoi, montagnes aux cimes nombreuses, jalousez-vous La montagne que Dieu a voulue pour résidence ? L'Éternel en fera sa demeure à perpétuité.\n17 Les chars de Dieu se comptent par vingt mille, par milliers et par milliers ; Le Seigneur est au milieu d'eux, le Sinaï est dans le sanctuaire.\n18 Tu es monté dans les hauteurs, tu as emmené des captifs, Tu as pris des dons parmi les hommes ; Les rebelles habiteront aussi près de l'Éternel Dieu.\n19 Béni soit le Seigneur chaque jour ! Quand on nous accable, Dieu nous délivre.\n20 Dieu est pour nous le Dieu des délivrances, Et l'Éternel, le Seigneur, peut nous garantir de la mort.\n21 Oui, Dieu brisera la tête de ses ennemis, Le crâne de ceux qui vivent dans le péché.\n22 Le Seigneur dit : Je les ramènerai de Basan, Je les ramènerai du fond de la mer,\n23 Afin que tu plonges ton pied dans le sang, Et que la langue de tes chiens ait sa part des ennemis.\n24 Ils voient ta marche, ô Dieu ! La marche de mon Dieu, de mon roi, dans le sanctuaire.\n25 En tête vont les chanteurs, puis ceux qui jouent des instruments, Au milieu de jeunes filles battant du tambourin.\n26 Bénissez Dieu dans les assemblées, Bénissez le Seigneur, descendants d'Israël !\n27 Là est Benjamin, le plus jeune, qui domine sur eux, Les chefs de Juda et leur troupe, Les chefs de Zabulon, les chefs de Nephthali.\n28 Ton Dieu ordonne que tu sois puissant ; Affermis, ô Dieu, ce que tu as fait pour nous !\n29 De ton temple tu règnes sur Jérusalem ; Les rois t'apporteront des présents.\n30 Repousse l'armée des bêtes sauvages, La troupe des taureaux avec les veaux des peuples, Qui se prosternent avec des pièces d'argent ! Disperse les peuples qui prennent plaisir à la guerre !\n31 Des grands viennent de l'Égypte ; L'Éthiopie accourt, les mains tendues vers Dieu.\n32 Royaumes de la terre, chantez à Dieu, Célébrez le Seigneur !\n33 Chantez à celui qui s'avance dans les cieux, les cieux éternels ! Voici, il fait entendre sa voix, sa voix puissante.\n34 Rendez gloire à Dieu ! Sa majesté est sur Israël, et sa puissance dans les cieux.\n35 De ton sanctuaire, ô Dieu, tu es redoutable. Le Dieu d'Israël donne à son peuple la force et la puissance. Béni soit Dieu !"
            }, {
                num: 69,
                titre: "Au chef des chantres. Sur les lis. De David.",
                premierVers: "Sauve-moi, ô Dieu, car les eaux menacent ma vie !",
                texte: "1 Sauve-moi, ô Dieu, car les eaux menacent ma vie !\n2 J'enfonce dans une boue profonde, sans pouvoir me tenir ; Je suis tombé dans un gouffre, et les eaux m'inondent.\n3 Je m'épuise à crier, mon gosier se dessèche, Mes yeux se consument, tandis que je regarde vers mon Dieu.\n4 Ils sont plus nombreux que les cheveux de ma tête, Ceux qui me haïssent sans cause ; Ils sont puissants, ceux qui veulent me perdre, Qui sont sans raison mes ennemis. Ce que je n'ai pas dérobé, il faut que je le rende.\n5 Ô Dieu, tu connais ma folie, Et mes fautes ne te sont point cachées.\n6 Que ceux qui espèrent en toi ne soient pas confus à cause de moi, Seigneur, Éternel des armées ! Que ceux qui te cherchent ne soient pas dans la honte à cause de moi, Dieu d'Israël !\n7 Car c'est pour toi que je porte l'opprobre, Que la honte couvre mon visage ;\n8 Je suis devenu un étranger pour mes frères, Un inconnu pour les fils de ma mère.\n9 Car le zèle de ta maison me dévore, Et les outrages de ceux qui t'insultent tombent sur moi.\n10 Je verse des larmes et je jeûne, Et cela m'attire l'opprobre ;\n11 Je prends un sac pour vêtement, Et je suis l'objet de leurs sarcasmes.\n12 Ceux qui sont assis à la porte parlent de moi, Et les buveurs de liqueurs fortes me mettent en chansons.\n13 Mais je t'adresse ma prière, ô Éternel ! Que ce soit le temps favorable, ô Dieu, par ta grande bonté ! Réponds-moi, en m'assurant ton secours fidèle !\n14 Retire-moi de la boue, et que je n'enfonce plus ! Que je sois délivré de mes ennemis et des eaux profondes !\n15 Que les flots ne m'inondent plus, Que l'abîme ne m'engloutisse pas, Et que la fosse ne se ferme pas sur moi !\n16 Exauce-moi, Éternel, car ta bonté est immense ! Dans tes grandes compassions, tourne vers moi les regards,\n17 Et ne cache pas ta face à ton serviteur ! Puisque je suis dans la détresse, hâte-toi de m'exaucer !\n18 Approche-toi de mon âme, délivre-la ! Sauve-moi, à cause de mes ennemis !\n19 Tu connais mon opprobre, ma honte, mon ignominie ; Tous mes adversaires sont devant toi.\n20 L'opprobre me brise le cœur, et je suis malade ; J'attends de la pitié, mais en vain, Des consolateurs, et je n'en trouve aucun.\n21 Ils mettent du fiel dans ma nourriture, Et, pour apaiser ma soif, ils m'abreuvent de vinaigre.\n22 Que leur table soit pour eux un piège, Et un filet au sein de leur sécurité !\n23 Que leurs yeux s'obscurcissent et ne voient plus, Et fais continuellement chanceler leurs reins !\n24 Répands sur eux ta colère, Et que ton ardente fureur les atteigne !\n25 Que leur demeure soit dévastée, Qu'il n'y ait plus d'habitants dans leurs tentes !\n26 Car ils persécutent celui que tu frappes, Ils racontent les souffrances de celui que tu blesses.\n27 Ajoute des iniquités à leurs iniquités, Et qu'ils n'aient point part à ta miséricorde !\n28 Qu'ils soient effacés du livre de vie, Et qu'ils ne soient point inscrits avec les justes !\n29 Moi, je suis malheureux et souffrant : Ô Dieu, que ton secours me relève !\n30 Je louerai le nom de Dieu par des cantiques, Je l'exalterai par des actions de grâces.\n31 Cela est agréable à l'Éternel, plus qu'un taureau Avec des cornes et des sabots.\n32 Les malheureux le voient et se réjouissent ; Vous qui cherchez Dieu, que votre cœur vive !\n33 Car l'Éternel écoute les pauvres, Et il ne méprise point ses captifs.\n34 Que les cieux et la terre le célèbrent, Les mers et tout ce qui s'y meut !\n35 Car Dieu sauvera Sion, et bâtira les villes de Juda ; On s'y établira, et l'on en possédera le pays ;\n36 La postérité de ses serviteurs en héritera, Et ceux qui aiment son nom y auront leur demeure."
            }, {
                num: 70,
                titre: "Au chef des chantres. De David. Pour souvenir.",
                premierVers: "Ô Dieu, hâte-toi de me délivrer ! Éternel, hâte-toi de me secourir !",
                texte: "1 Ô Dieu, hâte-toi de me délivrer ! Éternel, hâte-toi de me secourir !\n2 Qu'ils soient honteux et confus, ceux qui en veulent à ma vie ! Qu'ils reculent et rougissent, ceux qui désirent ma perte !\n3 Qu'ils retournent en arrière par l'effet de leur honte, Ceux qui disent : Ah ! ah !\n4 Que tous ceux qui te cherchent Soient dans l'allégresse et se réjouissent en toi ! Que ceux qui aiment ton salut Disent sans cesse : Exalté soit Dieu !\n5 Moi, je suis pauvre et indigent : Ô Dieu, hâte-toi en ma faveur ! Tu es mon aide et mon libérateur : Éternel, ne tarde pas !"
            }, {
                num: 71,
                titre: "",
                premierVers: "Éternel, je cherche en toi mon refuge : que jamais je ne sois confondu !",
                texte: "1 Éternel, je cherche en toi mon refuge : Que jamais je ne sois confondu !\n2 Dans ta justice, sauve-moi et délivre-moi ! Incline vers moi ton oreille, et secours-moi !\n3 Sois pour moi un rocher qui me serve d'asile, Où je puisse toujours me retirer ! Tu as résolu de me sauver, Car tu es mon rocher et ma forteresse.\n4 Mon Dieu, délivre-moi de la main du méchant, De la main de l'homme injuste et violent !\n5 Car tu es mon espérance, Seigneur Éternel ! En toi je me confie dès ma jeunesse.\n6 Dès le ventre de ma mère je m'appuie sur toi ; C'est toi qui m'as fait sortir du sein maternel ; Tu es sans cesse l'objet de mes louanges.\n7 Je suis pour plusieurs comme un prodige, Et toi, tu es mon puissant refuge.\n8 Que ma bouche soit remplie de tes louanges, Que chaque jour elle te glorifie !\n9 Ne me rejette pas au temps de la vieillesse ; Quand mes forces s'en vont, ne m'abandonne pas !\n10 Car mes ennemis parlent de moi, Et ceux qui guettent mon âme se concertent entre eux,\n11 Disant : Dieu l'abandonne ; Poursuivez-le, saisissez-le ; il n'y a personne pour le délivrer.\n12 Ô Dieu, ne t'éloigne pas de moi ! Mon Dieu, viens en hâte à mon secours !\n13 Qu'ils soient confus, anéantis, ceux qui en veulent à ma vie ! Qu'ils soient couverts de honte et d'opprobre, ceux qui cherchent ma perte !\n14 Et moi, j'espérerai toujours, Je te louerai de plus en plus.\n15 Ma bouche publiera ta justice, ton salut, chaque jour, Car j'ignore quelles en sont les bornes.\n16 Je dirai tes œuvres puissantes, Seigneur Éternel ! Je rappellerai ta justice, la tienne seule.\n17 Ô Dieu, tu m'as instruit dès ma jeunesse, Et jusqu'à présent j'annonce tes merveilles.\n18 Ne m'abandonne pas, ô Dieu, même dans la blanche vieillesse, Afin que j'annonce ta force à la génération présente, Ta puissance à la génération future !\n19 Ta justice, ô Dieu, atteint jusqu'au ciel ; Tu as accompli de grandes choses, ô Dieu ! Qui est semblable à toi ?\n20 Tu nous as fait éprouver bien des détresses et des malheurs ; Mais tu nous redonneras la vie, Tu nous feras remonter des abîmes de la terre.\n21 Relève ma grandeur, Console-moi de nouveau !\n22 Et je te louerai au son du luth, Je chanterai ta fidélité, mon Dieu, Je te célébrerai avec la harpe, Saint d'Israël !\n23 En te célébrant, j'aurai la joie sur les lèvres, La joie dans mon âme que tu as délivrée ;\n24 Et ma langue chaque jour publiera ta justice, Car ceux qui cherchent ma perte sont honteux et confus."
            }, {
                num: 72,
                titre: "De Salomon.",
                premierVers: "Ô Dieu, donne tes jugements au roi, et ta justice au fils du roi !",
                texte: "1 Ô Dieu, donne tes jugements au roi, Et ta justice au fils du roi !\n2 Il jugera ton peuple avec justice, Et tes malheureux avec équité.\n3 Les montagnes porteront la paix pour le peuple, Et les collines aussi, par l'effet de ta justice.\n4 Il fera droit aux malheureux du peuple, Il sauvera les enfants du pauvre, Et il écrasera l'oppresseur.\n5 On te craindra, tant que subsistera le soleil, Tant que paraîtra la lune, de génération en génération.\n6 Il descendra comme la pluie sur l'herbe coupée, Comme des ondées qui arrosent la campagne.\n7 En ses jours le juste fleurira, Et la paix sera grande jusqu'à ce qu'il n'y ait plus de lune.\n8 Il dominera d'une mer à l'autre, Et du fleuve aux extrémités de la terre.\n9 Devant lui, les habitants du désert fléchiront le genou, Et ses ennemis lécheront la poussière.\n10 Les rois de Tarsis et des îles paieront des tributs, Les rois de Séba et de Saba offriront des présents.\n11 Tous les rois se prosterneront devant lui, Toutes les nations le serviront.\n12 Car il délivrera le pauvre qui crie, Et le malheureux qui n'a point d'aide.\n13 Il aura pitié du misérable et de l'indigent, Et il sauvera la vie des pauvres ;\n14 Il les affranchira de l'oppression et de la violence, Et leur sang aura du prix à ses yeux.\n15 Ils vivront, et lui donneront de l'or de Séba ; Ils prieront pour lui sans cesse, ils le béniront chaque jour.\n16 Les blés abonderont dans le pays, au sommet des montagnes, Et leurs épis s'agiteront comme les arbres du Liban ; Les hommes fleuriront dans les villes comme l'herbe de la terre.\n17 Son nom subsistera toujours, Aussi longtemps que le soleil, son nom se perpétuera ; Par lui on se bénira mutuellement, Et toutes les nations le diront heureux.\n18 Béni soit l'Éternel Dieu, le Dieu d'Israël, qui seul fait des prodiges !\n19 Béni soit à jamais son nom glorieux ! Que toute la terre soit remplie de sa gloire ! Amen ! Amen !\n20 Fin des prières de David, fils d'Isaï."
            }, {
                num: 73,
                titre: "Psaume d'Asaph.",
                premierVers: "Oui, Dieu est bon pour Israël, pour ceux qui ont le cœur pur.",
                texte: "1 Oui, Dieu est bon pour Israël, Pour ceux qui ont le cœur pur.\n2 Toutefois, mon pied allait fléchir, Mes pas étaient sur le point de glisser ;\n3 Car je portais envie aux insensés, En voyant le bonheur des méchants.\n4 Rien ne les tourmente jusqu'à leur mort, Et leur corps est chargé d'embonpoint ;\n5 Ils n'ont aucune part aux souffrances humaines, Ils ne sont point frappés comme le reste des hommes.\n6 Aussi l'orgueil leur sert de collier, La violence est le vêtement qui les enveloppe ;\n7 L'iniquité sort de leurs entrailles, Les pensées de leur cœur se font jour.\n8 Ils raillent, et parlent méchamment d'opprimer ; Ils profèrent des discours hautains,\n9 Ils élèvent leur bouche jusqu'aux cieux, Et leur langue se promène sur la terre.\n10 Voilà pourquoi son peuple se tourne de leur côté, Il avale l'eau abondamment,\n11 Et il dit : Comment Dieu saurait-il, Comment le Très-Haut connaîtrait-il ?\n12 Ainsi sont les méchants : Toujours heureux, ils accroissent leurs richesses.\n13 C'est donc en vain que j'ai purifié mon cœur, Et que j'ai lavé mes mains dans l'innocence ;\n14 Chaque jour je suis frappé, Tous les matins mon châtiment est là.\n15 Si je disais : Je veux parler comme eux, Voici, je trahirais la race de tes enfants.\n16 Quand j'ai réfléchi là-dessus pour m'éclairer, La difficulté fut grande à mes yeux,\n17 Jusqu'à ce que j'eusse pénétré dans les sanctuaires de Dieu, Et que j'eusse pris garde au sort final des méchants.\n18 Oui, tu les places sur des voies glissantes, Tu les fais tomber dans la ruine.\n19 Eh quoi ! en un instant les voilà détruits ! Ils sont enlevés, anéantis par une fin soudaine !\n20 Comme un songe au réveil, Seigneur, à ton réveil, tu repousses leur image.\n21 Lorsque mon cœur s'aigrissait, Et que je me sentais percé dans les entrailles,\n22 J'étais stupide et sans intelligence, J'étais à ton égard comme les bêtes.\n23 Cependant je suis toujours avec toi, Tu m'as saisi la main droite ;\n24 Tu me conduiras par ton conseil, Puis tu me recevras dans la gloire.\n25 Quel autre ai-je au ciel que toi ? Et sur la terre je ne prends plaisir qu'en toi.\n26 Ma chair et mon cœur peuvent se consumer : Dieu sera toujours le rocher de mon cœur et mon partage.\n27 Car voici, ceux qui s'éloignent de toi périssent ; Tu anéantis tous ceux qui te sont infidèles.\n28 Pour moi, m'approcher de Dieu, c'est mon bien : Je place mon refuge dans le Seigneur, l'Éternel, Afin de raconter toutes tes œuvres."
            }, {
                num: 74,
                titre: "Cantique d'Asaph.",
                premierVers: "Pourquoi, ô Dieu, rejettes-tu pour toujours ? Pourquoi t'irrites-tu contre le troupeau de ton pâturage ?",
                texte: "1 Pourquoi, ô Dieu, rejettes-tu pour toujours ? Pourquoi t'irrites-tu contre le troupeau de ton pâturage ?\n2 Souviens-toi de ton peuple que tu as acquis autrefois, Que tu as racheté comme la tribu de ton héritage ! Souviens-toi de la montagne de Sion, où tu faisais ta résidence ;\n3 Porte tes pas vers ces lieux constamment dévastés ! L'ennemi a tout ravagé dans le sanctuaire.\n4 Tes adversaires ont rugi au milieu de ton temple ; Ils ont établi pour signes leurs signes.\n5 On les a vus, pareils à celui qui lève La cognée dans une épaisse forêt ;\n6 Et bientôt ils ont brisé toutes les sculptures, À coups de haches et de marteaux.\n7 Ils ont mis le feu à ton sanctuaire ; Ils ont abattu, profané la demeure de ton nom.\n8 Ils disaient en leur cœur : Traitons-les tous avec violence ! Ils ont brûlé dans le pays tous les lieux saints.\n9 Nous ne voyons plus nos signes ; Il n'y a plus de prophète, Et personne parmi nous qui sache jusques à quand.\n10 Jusques à quand, ô Dieu, l'oppresseur outragera-t-il, L'ennemi méprisera-t-il sans cesse ton nom ?\n11 Pourquoi retires-tu ta main et ta droite ? Sors-la de ton sein, détruis !\n12 Dieu est mon roi d'autrefois, Lui qui opère des délivrances au milieu de la terre.\n13 Tu as fendu la mer par ta puissance, Tu as brisé les têtes des monstres sur les eaux ;\n14 Tu as écrasé la tête du crocodile, Tu l'as donné pour nourriture au peuple du désert.\n15 Tu as fait jaillir des sources et des torrents, Tu as mis à sec des fleuves qui ne tarissent point.\n16 À toi est le jour, à toi est la nuit ; Tu as créé la lumière et le soleil.\n17 Tu as fixé toutes les limites de la terre, Tu as établi l'été et l'hiver.\n18 Souviens-toi que l'ennemi outrage l'Éternel, Et qu'un peuple insensé méprise ton nom !\n19 Ne livre pas aux bêtes l'âme de ta tourterelle, N'oublie pas à toujours la vie de tes malheureux !\n20 Aie égard à l'alliance ! Car les lieux sombres du pays sont pleins de repaires de brigands.\n21 Que l'opprimé ne retourne pas confus ! Que le malheureux et le pauvre célèbrent ton nom !\n22 Lève-toi, ô Dieu, défends ta cause ! Souviens-toi des outrages que te fait chaque jour l'insensé !\n23 N'oublie pas les clameurs de tes adversaires, Le tumulte sans cesse croissant de ceux qui s'élèvent contre toi !"
            }, {
                num: 75,
                titre: "Au chef des chantres. « Ne détruis pas ». Psaume d'Asaph. Cantique.",
                premierVers: "Nous te louons, ô Dieu, nous te louons ; ton nom est dans nos bouches ; nous publions tes merveilles.",
                texte: "1 Nous te louons, ô Dieu, nous te louons ; Ton nom est dans nos bouches ; Nous publions tes merveilles.\n2 Au temps que j'aurai fixé, Je jugerai avec droiture.\n3 La terre avec tous ceux qui l'habitent chancelle : J'en affermis les colonnes.\n4 Je dis à ceux qui se glorifient : Ne vous glorifiez pas ! Et aux méchants : N'élevez pas la tête !\n5 N'élevez pas si haut votre tête, Ne parlez pas avec tant d'arrogance !\n6 Car ce n'est ni de l'orient, ni de l'occident, Ni du désert, que vient l'élévation.\n7 Mais Dieu est celui qui juge : Il abaisse l'un, et il élève l'autre.\n8 Il y a dans la main de l'Éternel une coupe, Où fermente un vin plein de mixture, Et il en verse : Tous les méchants de la terre sucent, boivent jusqu'à la lie.\n9 Je publierai ces choses à jamais ; Je chanterai en l'honneur du Dieu de Jacob.\n10 Et j'abattrai toutes les forces des méchants ; Les forces du juste seront élevées."
            }, {
                num: 76,
                titre: "Au chef des chantres. Avec instruments à cordes. Psaume d'Asaph. Cantique.",
                premierVers: "Dieu est connu en Juda, son nom est grand en Israël.",
                texte: "1 Dieu est connu en Juda, Son nom est grand en Israël.\n2 Sa tente est à Salem, Et sa demeure à Sion.\n3 C'est là qu'il a brisé les flèches, Le bouclier, l'épée et les armes de guerre.\n4 Tu es majestueux, plus puissant que les montagnes des ravisseurs.\n5 Ils ont été dépouillés, ces héros pleins de courage, Ils se sont endormis de leur dernier sommeil ; Ils n'ont pas su se défendre, tous ces vaillants hommes.\n6 À ta menace, Dieu de Jacob, Ils se sont endormis, cavaliers et chevaux.\n7 Tu es redoutable, ô toi ! Qui peut te résister, quand ta colère éclate ?\n8 Du haut des cieux tu as proclamé la sentence ; La terre effrayée s'est tenue tranquille,\n9 Lorsque Dieu s'est levé pour faire justice, Pour sauver tous les malheureux de la terre.\n10 L'homme te célèbre même dans sa fureur, Quand tu te revêts de tout ton courroux.\n11 Faites des vœux à l'Éternel, votre Dieu, et accomplissez-les ! Que tous ceux qui l'environnent apportent des dons au Dieu terrible !\n12 Il abat l'orgueil des princes, Il est redoutable aux rois de la terre."
            }, {
                num: 77,
                titre: "Au chef des chantres. D'après Jeduthun. Psaume d'Asaph.",
                premierVers: "Ma voix s'élève à Dieu, et je crie ; ma voix s'élève à Dieu, et il m'écoutera.",
                texte: "1 Ma voix s'élève à Dieu, et je crie ; Ma voix s'élève à Dieu, et il m'écoutera.\n2 Au jour de ma détresse, je cherche le Seigneur ; La nuit, mes mains sont étendues sans se lasser ; Mon âme refuse toute consolation.\n3 Je me souviens de Dieu, et je gémis ; Je médite, et mon esprit est abattu.\n4 Tu tiens mes paupières en éveil ; Et, dans mon trouble, je ne puis parler.\n5 Je pense aux jours anciens, Aux années d'autrefois.\n6 Je pense à mes cantiques pendant la nuit, Je fais des réflexions au-dedans de mon cœur, Et mon esprit sonde cette question :\n7 Le Seigneur rejettera-t-il pour toujours ? Ne sera-t-il plus favorable ?\n8 Sa bonté est-elle à jamais épuisée ? Sa parole est-elle anéantie pour l'éternité ?\n9 Dieu a-t-il oublié d'avoir compassion ? A-t-il, dans sa colère, retiré sa miséricorde ?\n10 Je dis : Ce qui fait ma souffrance, C'est que la droite du Très-Haut n'est plus la même.\n11 Je rappellerai les œuvres de l'Éternel, Car je me souviens de tes merveilles d'autrefois ;\n12 Je parlerai de toutes tes œuvres, Je raconterai tes hauts faits.\n13 Ô Dieu, tes voies sont saintes ; Quel dieu est grand comme Dieu ?\n14 Tu es le Dieu qui fait des prodiges ; Tu as manifesté parmi les peuples ta puissance.\n15 Par ton bras tu as délivré ton peuple, Les fils de Jacob et de Joseph.\n16 Les eaux t'ont vu, ô Dieu, Les eaux t'ont vu, elles ont tremblé ; Les abîmes se sont émus.\n17 Les nuages versèrent de l'eau par torrents, Le tonnerre retentit dans les nues, Et tes flèches volèrent de toutes parts.\n18 Ta voix retentit dans le tourbillon, Les éclairs illuminèrent le monde ; La terre s'émut et trembla.\n19 Tu te frayas un chemin par la mer, Un sentier par les grandes eaux, Et tes traces ne furent plus reconnues.\n20 Tu as conduit ton peuple comme un troupeau, Par la main de Moïse et d'Aaron."
            }, {
                num: 78,
                titre: "Cantique d'Asaph.",
                premierVers: "Mon peuple, écoute mes instructions ! Prêtez l'oreille aux paroles de ma bouche !",
                texte: "1 Mon peuple, écoute mes instructions ! Prêtez l'oreille aux paroles de ma bouche !\n2 J'ouvre la bouche par des sentences, Je publie la sagesse des temps anciens.\n3 Ce que nous avons entendu, ce que nous savons, Ce que nos pères nous ont raconté,\n4 Nous ne le cacherons point à leurs enfants ; Nous dirons à la génération future les louanges de l'Éternel, Et sa puissance, et les prodiges qu'il a opérés.\n5 Il a établi un témoignage en Jacob, Il a mis une loi en Israël, Et il a ordonné à nos pères de l'enseigner à leurs enfants,\n6 Pour qu'elle fût connue de la génération future, Des enfants qui naîtraient, Et que, devenus grands, ils en parlassent à leurs enfants,\n7 Afin qu'ils missent en Dieu leur confiance, Qu'ils n'oubliassent pas les œuvres de Dieu, Et qu'ils observassent ses commandements,\n8 Afin qu'ils ne fussent pas, comme leurs pères, Une race indocile et rebelle, Une race dont le cœur n'était pas ferme, Et dont l'esprit n'était pas fidèle à Dieu.\n9 Les fils d'Éphraïm, armés et tirant de l'arc, Tournèrent le dos le jour du combat.\n10 Ils ne gardèrent point l'alliance de Dieu, Et ils refusèrent de marcher selon sa loi.\n11 Ils mirent en oubli ses œuvres, Ses merveilles qu'il leur avait fait voir.\n12 Devant leurs pères il avait fait des prodiges, Au pays d'Égypte, dans les campagnes de Tsoan.\n13 Il fendit la mer et leur ouvrit un passage, Il fit dresser les eaux comme une muraille.\n14 Il les conduisit le jour par la nuée, Et toute la nuit par un feu éclatant.\n15 Il fendit des rochers dans le désert, Et il donna à boire comme des flots abondants ;\n16 Du rocher il fit jaillir des sources, Et couler des eaux comme des fleuves.\n17 Mais ils continuèrent à pécher contre lui, À se révolter contre le Très-Haut dans le désert.\n18 Ils tentèrent Dieu dans leur cœur, En demandant de la nourriture selon leur désir.\n19 Ils parlèrent contre Dieu, Ils dirent : Dieu pourrait-il Dresser une table dans le désert ?\n20 Voici, il a frappé le rocher, et des eaux ont coulé, Et des torrents se sont répandus ; Pourra-t-il aussi donner du pain, Ou fournir de la viande à son peuple ?\n21 L'Éternel entendit, et il fut irrité ; Un feu s'alluma contre Jacob, Et la colère s'éleva contre Israël,\n22 Parce qu'ils ne crurent pas en Dieu, Parce qu'ils n'eurent pas confiance dans son secours.\n23 Il commanda aux nuages d'en haut, Et il ouvrit les portes des cieux ;\n24 Il fit pleuvoir sur eux la manne pour nourriture, Il leur donna le blé du ciel.\n25 Ils mangèrent tous le pain des grands, Il leur envoya de la nourriture à satiété.\n26 Il fit souffler dans les cieux le vent d'orient, Et il amena par sa puissance le vent du midi ;\n27 Il fit pleuvoir sur eux la viande comme de la poussière, Et comme le sable des mers les oiseaux ailés ;\n28 Il les fit tomber au milieu de leur camp, Tout autour de leurs demeures.\n29 Ils mangèrent et se rassasièrent abondamment : Dieu leur donna ce qu'ils avaient désiré.\n30 Ils n'avaient pas satisfait leur désir, Ils avaient encore leur nourriture à la bouche,\n31 Quand la colère de Dieu s'éleva contre eux ; Il frappa de mort les plus vigoureux, Il abattit les jeunes hommes d'Israël.\n32 Malgré tout cela, ils péchèrent encore, Et ils ne crurent point à ses prodiges.\n33 Il consuma leurs jours par la vanité, Et leurs années par une fin soudaine.\n34 Quand il les frappait, ils le cherchaient, Ils revenaient et se tournaient vers Dieu ;\n35 Ils se souvenaient que Dieu était leur rocher, Que le Dieu Très-Haut était leur libérateur.\n36 Mais ils le trompaient de la bouche, Et ils lui mentaient de la langue ;\n37 Leur cœur n'était pas ferme envers lui, Et ils n'étaient pas fidèles à son alliance.\n38 Toutefois, dans sa miséricorde, il pardonne l'iniquité et ne détruit pas ; Il retient souvent sa colère et ne se livre pas à toute sa fureur.\n39 Il se souvint qu'ils n'étaient que chair, Un souffle qui s'en va et ne revient pas.\n40 Que de fois ils se révoltèrent contre lui dans le désert ! Que de fois ils l'irritèrent dans la solitude !\n41 Ils ne cessèrent de tenter Dieu, Et de provoquer le Saint d'Israël.\n42 Ils ne se souvinrent pas de sa puissance, Du jour où il les délivra de l'ennemi,\n43 Des miracles qu'il accomplit en Égypte, Et de ses prodiges dans les campagnes de Tsoan.\n44 Il changea leurs fleuves en sang, Et ils ne purent en boire les eaux.\n45 Il envoya contre eux des mouches venimeuses qui les dévorèrent, Et des grenouilles qui les détruisirent.\n46 Il livra leurs récoltes aux sauterelles, Le produit de leur travail aux sauterelles.\n47 Il fit périr leurs vignes par la grêle, Et leurs sycomores par la gelée.\n48 Il abandonna leur bétail à la grêle, Et leurs troupeaux au feu du ciel.\n49 Il lança contre eux son ardente colère, La fureur, la rage et la détresse, Une troupe de messagers de malheur.\n50 Il donna libre cours à sa colère : Il ne sauva pas leur âme de la mort, Il livra leur vie à la mortalité.\n51 Il frappa tous les premiers-nés en Égypte, Les prémices de la force sous les tentes de Cham.\n52 Il fit partir son peuple comme des brebis, Il les conduisit comme un troupeau dans le désert.\n53 Il les dirigea sûrement, pour qu'ils fussent sans crainte, Et la mer couvrit leurs ennemis.\n54 Il les amena vers sa frontière sainte, Vers cette montagne que sa droite a acquise.\n55 Il chassa devant eux les nations, Leur distribua le pays en héritage, Et fit habiter dans leurs tentes les tribus d'Israël.\n56 Mais ils tentèrent le Dieu Très-Haut et se révoltèrent contre lui, Et ils n'observèrent point ses ordonnances.\n57 Ils s'éloignèrent et furent infidèles, comme leurs pères, Ils tournèrent, comme un arc trompeur.\n58 Ils l'irritèrent par leurs hauts lieux, Et ils excitèrent sa jalousie par leurs idoles.\n59 Dieu entendit, et il fut courroucé ; Il repoussa fortement Israël.\n60 Il abandonna la demeure de Silo, La tente où il habitait parmi les hommes ;\n61 Il livra sa gloire à la captivité, Et sa majesté entre les mains de l'ennemi.\n62 Il mit son peuple à la merci du glaive, Et il s'indigna contre son héritage.\n63 Le feu dévora ses jeunes hommes, Et ses vierges ne furent pas célébrées ;\n64 Ses sacrificateurs tombèrent par l'épée, Et ses veuves ne pleurèrent pas.\n65 Le Seigneur s'éveilla comme celui qui a dormi, Comme un héros qu'a subjugué le vin.\n66 Il frappa ses adversaires en fuite, Il les couvrit d'un opprobre éternel.\n67 Cependant il rejeta la tente de Joseph, Et il ne choisit point la tribu d'Éphraïm ;\n68 Il préféra la tribu de Juda, La montagne de Sion qu'il aimait.\n69 Et il bâtit son sanctuaire comme les lieux élevés, Comme la terre qu'il a fondée pour toujours.\n70 Il choisit David, son serviteur, Et il le tira des bergeries ;\n71 Il le prit derrière les brebis qui allaitent, Pour lui faire paître Jacob, son peuple, Et Israël, son héritage.\n72 Et David les dirigea avec un cœur intègre, Et les conduisit avec des mains intelligentes."
            }, {
                num: 79,
                titre: "Psaume d'Asaph.",
                premierVers: "Ô Dieu, les nations ont envahi ton héritage, elles ont profané ton saint temple, elles ont fait de Jérusalem un monceau de pierres.",
                texte: "1 Ô Dieu, les nations ont envahi ton héritage, Elles ont profané ton saint temple, Elles ont fait de Jérusalem un monceau de pierres.\n2 Elles ont livré les cadavres de tes serviteurs En pâture aux oiseaux du ciel, La chair de tes fidèles aux bêtes de la terre ;\n3 Elles ont versé leur sang comme de l'eau Tout autour de Jérusalem, Et personne ne leur a donné la sépulture.\n4 Nous sommes devenus un objet d'opprobre pour nos voisins, De moquerie et de risée pour ceux qui nous entourent.\n5 Jusques à quand, Éternel, t'irriteras-tu sans cesse, Et ta colère s'embrasera-t-elle comme le feu ?\n6 Répands ta fureur sur les nations qui ne te connaissent pas, Et sur les royaumes qui n'invoquent pas ton nom !\n7 Car on a dévoré Jacob, Et ravagé sa demeure.\n8 Ne te souviens plus de nos iniquités passées ! Que tes compassions viennent en hâte au-devant de nous ! Car nous sommes bien malheureux.\n9 Secours-nous, Dieu de notre salut, pour la gloire de ton nom ! Délivre-nous, et pardonne nos péchés, à cause de ton nom !\n10 Pourquoi les nations diraient-elles : Où est leur Dieu ? Qu'on sache parmi les nations, et sous nos yeux, Que tu venges le sang de tes serviteurs, le sang répandu !\n11 Que les gémissements des captifs parviennent jusqu'à toi ! Par ton bras puissant sauve ceux qui sont voués à la mort !\n12 Rends à nos voisins sept fois dans leur sein Les outrages qu'ils t'ont faits, Seigneur !\n13 Et nous, ton peuple, le troupeau de ton pâturage, Nous te célébrerons éternellement ; De génération en génération nous publierons tes louanges."
            }, {
                num: 80,
                titre: "Au chef des chantres. Sur les lis. Témoignage. D'Asaph. Psaume.",
                premierVers: "Prête l'oreille, berger d'Israël, toi qui conduis Joseph comme un troupeau ! Parais dans ta splendeur, toi qui es assis sur les chérubins !",
                texte: "1 Prête l'oreille, berger d'Israël, Toi qui conduis Joseph comme un troupeau ! Parais dans ta splendeur, Toi qui es assis sur les chérubins !\n2 Devant Éphraïm, Benjamin et Manassé, réveille ta force, Et viens à notre secours !\n3 Ô Dieu, relève-nous ! Fais briller ta face, et nous serons sauvés !\n4 Éternel, Dieu des armées, Jusques à quand t'irriteras-tu contre la prière de ton peuple ?\n5 Tu les nourris d'un pain de larmes, Tu les abreuves de larmes à pleine mesure.\n6 Tu fais de nous un objet de discorde pour nos voisins, Et nos ennemis se raillent de nous.\n7 Dieu des armées, relève-nous ! Fais briller ta face, et nous serons sauvés !\n8 Tu avais arraché de l'Égypte une vigne ; Tu as chassé des nations, et tu l'as plantée.\n9 Tu as préparé le sol devant elle, Et elle a poussé des racines et rempli la terre ;\n10 Les montagnes étaient couvertes de son ombre, Et ses rameaux étaient comme des cèdres de Dieu ;\n11 Elle étendait ses branches jusqu'à la mer, Et ses rejetons jusqu'au fleuve.\n12 Pourquoi as-tu rompu ses clôtures, En sorte que tous les passants la dépouillent ?\n13 Le sanglier de la forêt la ronge, Et les bêtes des champs en font leur pâture.\n14 Dieu des armées, reviens donc ! Regarde du haut des cieux, et vois ! considère cette vigne !\n15 Protège ce que ta droite a planté, Et le fils que tu t'es choisi !\n16 Elle est brûlée par le feu, elle est coupée ! Ils périssent devant ta face menaçante.\n17 Que ta main soit sur l'homme de ta droite, Sur le fils de l'homme que tu t'es choisi !\n18 Et nous ne nous éloignerons plus de toi. Fais-nous revivre, et nous invoquerons ton nom.\n19 Éternel, Dieu des armées, relève-nous ! Fais briller ta face, et nous serons sauvés !"
            }, {
                num: 81,
                titre: "Au chef des chantres. Sur la guitthith. D'Asaph.",
                premierVers: "Chantez avec allégresse à Dieu, notre force ! Poussez des cris de joie vers le Dieu de Jacob !",
                texte: "1 Chantez avec allégresse à Dieu, notre force ! Poussez des cris de joie vers le Dieu de Jacob !\n2 Entonnez des cantiques, faites retentir le tambourin, La harpe mélodieuse et le luth !\n3 Sonnez de la trompette à la nouvelle lune, À la pleine lune, pour le jour de notre fête !\n4 Car c'est une loi pour Israël, Une ordonnance du Dieu de Jacob.\n5 Il en fit un statut pour Joseph, Quand il marcha contre le pays d'Égypte. J'entends une voix qui m'est inconnue :\n6 J'ai déchargé son épaule du fardeau, Et ses mains ont lâché la corbeille.\n7 Tu as crié dans la détresse, et je t'ai délivré ; Je t'ai répondu dans le lieu secret du tonnerre ; Je t'ai éprouvé près des eaux de Meriba.\n8 Écoute, mon peuple, et je t'avertirai ; Israël, puisses-tu m'écouter !\n9 Qu'il n'y ait point au milieu de toi de dieu étranger ! Ne te prosterne pas devant des dieux étrangers !\n10 Je suis l'Éternel, ton Dieu, qui t'ai fait monter du pays d'Égypte ; Ouvre ta bouche, et je la remplirai.\n11 Mais mon peuple n'a point écouté ma voix, Israël ne m'a point obéi.\n12 Alors je les ai livrés aux penchants de leur cœur, Et ils ont marché selon leurs propres conseils.\n13 Oh ! si mon peuple m'écoutait, Si Israël marchait dans mes voies !\n14 En un instant je confondrais leurs ennemis, Je tournerais ma main contre leurs adversaires ;\n15 Ceux qui haïssent l'Éternel le flatteraient, Et le temps d'Israël durerait toujours ;\n16 Je le nourrirais du meilleur froment, Et je le rassasierais du miel du rocher."

                texte: "1 Dieu se tient dans l'assemblée de Dieu ; Il juge au milieu des dieux.\n2 Jusques à quand jugerez-vous avec injustice, Et aurez-vous égard à la personne des méchants ?\n3 Rendez justice au faible et à l'orphelin, Faites droit au malheureux et au pauvre,\n4 Sauvez le misérable et l'indigent, Délivrez-les de la main des méchants.\n5 Ils n'ont ni savoir ni intelligence, Ils marchent dans les ténèbres ; Tous les fondements de la terre sont ébranlés.\n6 J'avais dit : Vous êtes des dieux, Vous êtes tous des fils du Très-Haut.\n7 Cependant vous mourrez comme des hommes, Vous tomberez comme un prince quelconque.\n8 Lève-toi, ô Dieu, juge la terre ! Car toutes les nations t'appartiennent."

                texte: "1 Ô Dieu, ne reste pas dans le silence ! Ne te tais pas, et ne te repose pas, ô Dieu !\n2 Car voici, tes ennemis s'agitent, Ceux qui te haïssent lèvent la tête.\n3 Ils forment contre ton peuple des projets pleins de ruse, Et ils délibèrent contre ceux que tu protèges.\n4 Venez, disent-ils, exterminons-les du milieu des nations, Et qu'on ne se souvienne plus du nom d'Israël !\n5 Ils se concertent tous d'un même cœur, Ils font une alliance contre toi ;\n6 Les tentes d'Édom et les Ismaélites, Moab et les Hagaréniens,\n7 Guebal, Ammon, Amalek, Les Philistins avec les habitants de Tyr ;\n8 L'Assyrie aussi se joint à eux, Elle prête son bras aux enfants de Lot.\n9 Traite-les comme Madian, Comme Sisera, comme Jabin au torrent de Kison !\n10 Ils ont été détruits à En-Dor, Ils sont devenus du fumier pour la terre.\n11 Traite leurs chefs comme Oreb et Zeeb, Et tous leurs princes comme Zébach et Tsalmuna !\n12 Car ils disent : Emparons-nous Des demeures de Dieu !\n13 Mon Dieu, rends-les semblables au tourbillon, Au chaume qu'emporte le vent,\n14 Comme le feu brûle la forêt, Comme la flamme embrase les montagnes !\n15 Poursuis-les ainsi de ta tempête, Et fais-les trembler par ton ouragan !\n16 Couvre leur face d'ignominie, Afin qu'ils cherchent ton nom, ô Éternel !\n17 Qu'ils soient confus et épouvantés pour toujours, Qu'ils soient honteux et qu'ils périssent !\n18 Qu'ils sachent que toi seul, dont le nom est l'Éternel, Tu es le Très-Haut sur toute la terre !"
            }, {
